<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ScriptRoom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=VT323&display=swap">
<style>
/* Layout: programa de 1995 maximizado — barra de título, menus, ferramentas, painel + folha datilografada, barra de status e barra de tarefas com Iniciar.
   Visual de época deliberado (um tema só, com esquemas de cores escolhidos pelo usuário). */
:root{
  --desktop:#008080; --face:#C0C0C0; --light:#DFDFDF; --hi:#FFFFFF; --lo:#808080; --dk:#0A0A0A;
  --text:#000000; --muted:#3C3C3C; --title1:#000080; --title2:#1084D0; --titletext:#FFFFFF; --off1:#808080; --off2:#B5B5B5;
  --sel:#000080; --seltext:#FFFFFF; --field:#FFFFFF; --tip:#FFFFE1; --err:#B00000; --warn:#7A5A00; --ok:#006400; --link:#0000C0;
  --paper:#FFFFFF; --type:#141414; --deskgrey:#808080;
  --f-ui:Tahoma,Verdana,"Arimo","Segoe UI",sans-serif; --f-type:"Courier New","Courier Prime",Courier,monospace; --f-pix:"VT323",ui-monospace,monospace;
  color-scheme:light;
}
body[data-scheme=tijolo]{--desktop:#6E2A1C;--face:#C6BFA6;--light:#E1DBC6;--lo:#8A8268;--title1:#800000;--title2:#C0603A;--sel:#800000;--deskgrey:#8A8268}
body[data-scheme=berinjela]{--desktop:#4C3A5E;--face:#A8B6AF;--light:#CCD8D2;--lo:#6B7B74;--title1:#402040;--title2:#86608A;--sel:#402040;--deskgrey:#6B7B74}
body[data-scheme=deserto]{--desktop:#A08048;--face:#D6CDBB;--light:#EBE4D6;--lo:#A1977E;--title1:#007878;--title2:#40A8A8;--sel:#007878;--deskgrey:#A1977E}
body[data-scheme=contraste]{--desktop:#000000;--face:#000000;--light:#4A4A4A;--hi:#FFFFFF;--lo:#9A9A9A;--dk:#FFFFFF;--text:#FFFFFF;--muted:#E8E8E8;
  --title1:#800080;--title2:#A000A0;--off1:#404040;--off2:#606060;--sel:#00A0A0;--seltext:#000000;--field:#000000;--tip:#000000;--err:#FF7070;--warn:#FFD040;--ok:#70FF70;--link:#7FD4FF;--deskgrey:#202020;color-scheme:dark}
html,body{height:100%}
body{background:var(--desktop);color:var(--text);font:12px/1.35 var(--f-ui);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--title1)}
button,input,select,textarea{font:inherit;color:inherit}
.raised{box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.sunken{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.thin-sunken{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}

/* ---------- janela principal ---------- */
.app{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--face);padding:3px;
  padding-left:max(3px,env(safe-area-inset-left,0px));padding-right:max(3px,env(safe-area-inset-right,0px));
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light),inset -2px -2px var(--lo),inset 2px 2px var(--hi)}
.titlebar{background:linear-gradient(90deg,var(--title1),var(--title2));color:var(--titletext);font-weight:700;display:flex;align-items:center;gap:5px;padding:2px 2px 2px 4px;min-height:18px;user-select:none}
.titlebar.off{background:linear-gradient(90deg,var(--off1),var(--off2))}
.titlebar .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlebar svg{flex:none}
.tb-btn{width:16px;height:14px;background:var(--face);border:0;padding:0;display:flex;align-items:center;justify-content:center;font:700 10px/1 var(--f-ui);color:var(--text);cursor:pointer;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.tb-btn:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--light),inset 2px 2px var(--lo)}
.menubar{display:flex;flex-wrap:wrap;padding:1px 0 2px}
.menubar>button{border:0;background:transparent;padding:3px 7px;cursor:default}
.menubar>button[aria-expanded=true]{background:var(--sel);color:var(--seltext)}
.menubar>button:focus-visible{outline:1px dotted var(--text);outline-offset:-2px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:3px 2px;box-shadow:inset 0 1px var(--lo),inset 0 2px var(--hi);margin-bottom:2px}
.tbtn{width:24px;height:22px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;cursor:default}
.tbtn:hover{box-shadow:inset -1px -1px var(--lo),inset 1px 1px var(--hi)}
.tbtn:active,.tbtn[aria-pressed=true]{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo);background:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px}
.tbtn:focus-visible{outline:1px dotted var(--text);outline-offset:-3px}
.tsep{width:2px;height:20px;border-left:1px solid var(--lo);border-right:1px solid var(--hi);margin:0 4px}
.tlbl{padding:0 3px 0 4px}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--field);color:var(--text);border:0;border-radius:0;padding:3px 4px;min-width:0;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
select{height:21px;padding:1px 2px}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px dotted var(--text);outline-offset:-4px}
input[type=checkbox],input[type=radio]{accent-color:var(--sel);margin:0 4px 0 0}
input[type=range]{accent-color:var(--sel)}
textarea{width:100%;box-sizing:border-box;resize:vertical}
.work{flex:1;display:grid;grid-template-columns:320px minmax(0,1fr);gap:3px;min-height:0}
body[data-painel=off] .work{grid-template-columns:minmax(0,1fr)}
body[data-painel=off] .side{display:none}
.side{overflow:auto;min-width:0;padding:4px 4px 30px}
.desk{overflow:auto;min-width:0;background:var(--deskgrey);position:relative;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.statusbar{display:flex;gap:2px;padding:2px 0 0;flex-wrap:wrap}
.sb{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo);padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;display:flex;align-items:center;gap:6px}
.sb.grow{flex:1 1 160px}
.status i{width:8px;height:8px;display:inline-block;background:var(--lo);box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk)}
.status.ok i{background:#00C000} .status.busy i,.status.local i{background:#E0C000}
.prog{width:84px;height:12px;padding:1px;display:flex;gap:1px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo);background:var(--field)}
.prog i{width:6px;background:var(--sel);flex:none}

/* ---------- barra de tarefas ---------- */
.taskbar{display:flex;align-items:center;gap:3px;background:var(--face);box-shadow:inset 0 1px var(--light),inset 0 2px var(--hi);
  padding:4px max(3px,env(safe-area-inset-right,0px)) calc(3px + env(safe-area-inset-bottom,0px)) max(3px,env(safe-area-inset-left,0px));min-height:24px}
.start{font-weight:700;display:flex;gap:4px;align-items:center;padding:2px 6px 2px 4px;height:22px;border:0;background:var(--face);cursor:default;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.start[aria-expanded=true],.task[aria-pressed=true]{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--light),inset 2px 2px var(--lo)}
.task[aria-pressed=true]{background:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px;font-weight:700}
.task{flex:0 1 220px;min-width:0;height:22px;border:0;background:var(--face);display:flex;gap:4px;align-items:center;padding:0 6px;text-align:left;cursor:default;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.mob{display:none}
.tray{margin-left:auto;display:flex;align-items:center;gap:6px;padding:2px 8px;height:20px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.tray button{border:0;background:transparent;padding:0;display:flex;cursor:default}
.tray .clock{font-variant-numeric:tabular-nums}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:90;background:var(--face);padding:2px;min-width:190px;max-width:calc(100vw - 8px);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light),inset -2px -2px var(--lo),inset 2px 2px var(--hi),2px 2px 0 rgba(0,0,0,.25)}
.mi{display:grid;grid-template-columns:18px minmax(0,1fr) auto 12px;gap:4px;align-items:center;width:100%;border:0;background:transparent;padding:3px 4px 3px 2px;text-align:left;white-space:nowrap;cursor:default}
.mi .ic{display:flex;align-items:center;justify-content:center}
.mi .k{color:inherit;opacity:.85;padding-left:16px}
.mi:hover,.mi:focus,.mi.open{background:var(--sel);color:var(--seltext);outline:none}
.mi:disabled{color:var(--lo);text-shadow:1px 1px var(--hi);background:transparent}
.mi.big{grid-template-columns:26px minmax(0,1fr) auto 12px;padding:5px 4px 5px 2px}
.menu hr{border:0;border-top:1px solid var(--lo);border-bottom:1px solid var(--hi);margin:3px 2px}
.startmenu{display:flex;padding:3px}
.sm-band{width:22px;background:linear-gradient(0deg,var(--title1),var(--lo));color:var(--face);writing-mode:vertical-rl;transform:rotate(180deg);font:700 15px/22px var(--f-ui);padding:8px 0;letter-spacing:.04em;text-align:left;white-space:nowrap}
.sm-band b{color:var(--hi)}
.sm-items{flex:1;display:flex;flex-direction:column;min-width:210px}

/* ---------- janelas de diálogo ---------- */
.scrim{position:fixed;inset:0;z-index:79}
.win{position:fixed;z-index:80;background:var(--face);padding:3px;display:flex;flex-direction:column;max-width:calc(100vw - 12px);max-height:calc(100vh - 48px);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light),inset -2px -2px var(--lo),inset 2px 2px var(--hi),3px 3px 0 rgba(0,0,0,.3)}
.win .titlebar{cursor:move}
.win-body{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:9px;min-height:0}
.win-btns{display:flex;justify-content:flex-end;gap:6px;padding:2px 10px 10px;flex-wrap:wrap}
.btn{min-width:75px;height:23px;border:0;background:var(--face);padding:0 10px;cursor:default;white-space:nowrap;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.btn:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--light),inset 2px 2px var(--lo);padding-top:1px}
.btn.def{outline:1px solid var(--dk);outline-offset:-1px}
.btn:focus-visible{outline:1px dotted var(--text);outline-offset:-5px}
.btn.def:focus-visible{outline:1px dotted var(--text);outline-offset:-5px}
.btn:disabled{color:var(--lo);text-shadow:1px 1px var(--hi)}
.btn.sm{min-width:0;height:21px;padding:0 7px}
.btn.armed{color:var(--err);font-weight:700}
fieldset{border:0;margin:0;padding:12px 10px 9px;position:relative;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--lo),inset 2px 2px var(--hi)}
legend{padding:0 3px;position:absolute;top:-7px;left:8px;background:var(--face)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:2px}
.radio{display:flex;align-items:flex-start;gap:2px;padding:3px 0}
.radio small{display:block;color:var(--muted)}
.tip{background:var(--tip);padding:10px;display:flex;gap:10px;align-items:flex-start;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.tip b{display:block;margin-bottom:3px;font-size:13px}
.listview{background:var(--field);overflow:auto;max-height:52vh;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.listview table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.listview th{position:sticky;top:0;background:var(--face);text-align:left;font-weight:400;padding:2px 6px;white-space:nowrap;cursor:default;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo)}
.listview td{padding:2px 6px;vertical-align:top;border-bottom:1px dotted var(--light)}
.listview tr.sel td,.listview tbody tr:hover td{background:var(--sel);color:var(--seltext)}
.listview tr.sel td .muted,.listview tbody tr:hover td .muted{color:var(--seltext)}
.listview td.num,.listview th.num{text-align:right}
.wiz{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px}
.wiz-art{background:var(--title1);display:flex;align-items:flex-end;justify-content:center;padding:10px;min-height:220px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.welcome{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px}
.welcome .art{display:flex;flex-direction:column;gap:8px}
.splash{background:linear-gradient(180deg,var(--title1),#000);color:#fff;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:150px;text-align:center}
.splash .big{font:400 30px/1 var(--f-pix);letter-spacing:.04em}
.splash .sub{font:400 18px/1 var(--f-pix);color:#9FD4FF}
@media (max-width:620px){.welcome,.wiz{grid-template-columns:minmax(0,1fr)}.welcome .art .splash{min-height:90px}.wiz-art{display:none}}
.desligado{position:fixed;inset:0;z-index:200;background:#000;color:#FF9C00;display:flex;align-items:center;justify-content:center;text-align:center;font:400 34px/1.3 var(--f-pix);padding:24px;cursor:pointer}
.toast{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));background:var(--tip);color:#000;border:1px solid #000;padding:6px 10px;z-index:95;max-width:min(360px,calc(100vw - 16px));box-shadow:2px 2px 0 rgba(0,0,0,.3)}

/* ---------- painel lateral (abas) ---------- */
.ptabs{display:flex;flex-wrap:wrap;padding-left:2px;position:relative;z-index:1}
.ptabs button{border:0;background:var(--face);padding:3px 7px 2px;margin-top:2px;cursor:default;border-radius:3px 3px 0 0;
  box-shadow:inset 1px 1px var(--hi),inset -1px 0 var(--dk),inset -2px 0 var(--lo),inset 0 2px var(--light)}
.ptabs button[aria-pressed=true]{margin-top:0;padding-bottom:4px;margin-bottom:-2px;position:relative;z-index:2}
.ptabs .cnt{display:inline-block;min-width:14px;padding:0 3px;margin-left:3px;background:var(--err);color:#fff;font-size:10px;line-height:14px;text-align:center}
.tabpanel{padding:9px 8px;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.panel{display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.stat{background:var(--field);padding:4px 7px;min-width:0;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.stat b{display:block;font:400 22px/1 var(--f-pix);color:var(--sel)}
body[data-scheme=contraste] .stat b{color:var(--link)}
.stat span{color:var(--muted)}
.panel-list{background:var(--field);padding:2px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.scn{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:1px 6px;align-items:start;text-align:left;border:0;background:transparent;padding:3px 4px;cursor:default;width:100%}
.scn:hover{background:var(--light)}
.scn.cur{background:var(--sel);color:var(--seltext)} .scn.cur .m,.scn.cur .tc,.scn.cur .no{color:var(--seltext)}
.scn .no{font-weight:700;color:var(--sel);display:flex;gap:3px;align-items:center}
.scn .no .sw{width:8px;height:8px;border:1px solid var(--text);display:inline-block}
.scn .h{font-weight:700;overflow-wrap:anywhere}
.scn .m{grid-column:2/4;color:var(--muted);overflow-wrap:anywhere}
.scn .tc{color:var(--muted);white-space:nowrap}
.scn .tc.bad{color:var(--err)}
.scn-wrap{display:flex;align-items:flex-start;gap:1px}
.scn-wrap .mv{display:flex;flex-direction:column;gap:1px;padding-top:2px}
.ib{width:16px;height:15px;border:0;background:var(--face);padding:0;font-size:8px;line-height:1;cursor:default;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo)}
.ib:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk)}
.actrow{font-weight:700;padding:6px 4px 2px;border-top:1px solid var(--lo);margin-top:2px;letter-spacing:.06em}
.chr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;border:0;background:transparent;padding:4px;cursor:default;width:100%}
.chr:hover{background:var(--sel);color:var(--seltext)} .chr:hover .n{color:var(--seltext)}
.chr b{overflow-wrap:anywhere}
.chr .n{color:var(--muted);font-variant-numeric:tabular-nums}
.chr .bar{grid-column:1/3;height:8px;padding:1px;display:flex;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.chr .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sel) 0 5px,transparent 5px 6px)}
.finding{background:var(--field);padding:6px 8px;display:flex;flex-direction:column;gap:2px;cursor:default;text-align:left;border:0;width:100%;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.finding:hover{outline:1px dotted var(--text);outline-offset:-3px}
.finding .sev{font-weight:700}
.finding .det{color:var(--muted);overflow-wrap:anywhere}
.sev.err{color:var(--err)} .sev.warn{color:var(--warn)} .sev.info{color:var(--muted)}
.hit{display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-bottom:1px dotted var(--lo);background:transparent;padding:4px;cursor:default;width:100%}
.hit:hover{background:var(--light)} .hit small{color:var(--muted);font-weight:700}
.hit span{overflow-wrap:anywhere}
mark{background:#FFFF00;color:#000}
.ver{display:flex;align-items:center;gap:6px;background:var(--field);padding:5px 7px;flex-wrap:wrap;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.ver .vt{flex:1 1 140px;min-width:0} .ver .vt b{display:block} .ver .vt span{color:var(--muted)}
.inline-form{display:flex;gap:6px;flex-wrap:wrap} .inline-form input{flex:1 1 140px}
.empty{padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--field);box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.help{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.help kbd{font:inherit;background:var(--face);padding:0 5px;white-space:nowrap;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi)}
.muted{color:var(--muted)}

/* ---------- régua e folha ---------- */
.scale{padding:14px 16px 80px;width:fit-content;margin:0 auto}
body.maquina .scale{padding-bottom:60vh}
.ruler{width:210mm;height:22px;margin:0 auto 8px;position:relative;background:#E8E8E8;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080;overflow:hidden;color:#000}
.ruler .area{position:absolute;top:2px;bottom:2px;left:38.1mm;right:25.4mm;background:#fff;
  background-image:repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 2.5mm),repeating-linear-gradient(90deg,#000 0 1px,transparent 1px 10mm);
  background-size:2.5mm 4px,10mm 7px;background-repeat:repeat-x;background-position:0 100%,0 100%}

body[data-regua=off] .ruler{display:none}
.sheet{width:210mm;box-sizing:border-box;padding:25.4mm 25.4mm 25.4mm 38.1mm;background:var(--paper);color:var(--type);font:12pt/12pt var(--f-type);position:relative;box-shadow:3px 3px 0 #000}
.tp{min-height:calc(297mm - 50.8mm);text-align:center;cursor:pointer;display:flex;flex-direction:column}

.tp .c{font-size:14pt;line-height:1.1;margin-bottom:12pt}
.tp .t{font-size:14pt;font-weight:700;line-height:1.1;margin-bottom:52pt}
.tp .i{font-size:11pt;line-height:1.15;margin-bottom:4pt}
.tp .e{font-size:11pt;line-height:1.15;margin-bottom:48pt}
.tp .n{font-size:10pt;font-style:italic;color:#444;line-height:1.15;margin-bottom:4pt}
.tp:hover{outline:1px dotted #000;outline-offset:6px}
.pgd{margin:14pt -25.4mm 14pt -38.1mm;border-top:1px dashed #9AA0AA;position:relative;height:0;user-select:none;pointer-events:none}
.pgd span{position:absolute;right:25.4mm;top:-7px;background:#fff;padding:0 6px;font:9px/14px "Courier New",monospace;color:#6A6F78}
.el{white-space:pre-wrap;overflow-wrap:break-word;outline:none;position:relative;min-height:12pt;caret-color:#000080}
.el:empty::before{content:attr(data-ph);color:#B0B4BA}
.el.e-scene::before{content:attr(data-num)}
.el.e-scene:empty::before{content:attr(data-num) attr(data-ph);color:#B0B4BA}
.el.e-scene[data-cor]{box-shadow:-9px 0 0 -5px var(--cor)}
.el:focus{background:#FFFFE8}
.el:focus::after{content:attr(data-label);position:absolute;left:-34mm;top:var(--pt,0);width:28mm;text-align:right;font:700 9px/12pt Tahoma,Arial,sans-serif;color:#000080;pointer-events:none}
.e-act{text-align:center;font-weight:700;text-transform:uppercase;padding:24pt 0 12pt;--pt:24pt}
.e-scene{font-weight:700;text-transform:uppercase;padding-top:24pt;--pt:24pt}
.e-time{font-size:10pt;font-style:italic;color:#666;padding-bottom:12pt}
.e-note{font-size:11pt;font-style:italic;color:#444;padding-bottom:12pt}
.e-action{padding-bottom:12pt}
.e-character{margin-left:50.8mm;text-transform:uppercase}
.e-paren{margin:0 38.1mm}
.e-dialogue{margin:0 25.4mm}
.e-dialogue.end{padding-bottom:12pt}
.el.flash{background:#FFFF80;transition:background .8s}
.el.hl{background:#C8F0FF!important}
.ac{position:fixed;z-index:85;background:var(--field);padding:1px;min-width:220px;max-width:min(420px,calc(100vw - 32px));box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--lo),1px 1px 0 #000}
.ac button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:2px 6px;cursor:default;font:12px/1.3 "Courier New",monospace}
.ac button small{opacity:.7;font-family:var(--f-ui)}
.ac button[aria-selected=true]{background:var(--sel);color:var(--seltext)}
.desk-empty{max-width:420px;margin:60px auto;padding:16px;text-align:center;background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}

/* ---------- quadro de cenas ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px;align-content:start}
.actsep{grid-column:1/-1;color:#fff;font:400 22px/1 var(--f-pix);letter-spacing:.08em;padding:4px 2px;border-bottom:2px dotted rgba(255,255,255,.6)}
.actsep.drop{background:rgba(255,255,255,.18)}
.icard{background:#FFFEF6;color:#111;display:flex;flex-direction:column;min-height:150px;box-shadow:2px 2px 0 #000;position:relative;cursor:grab;
  background-image:linear-gradient(var(--cor,#E04040),var(--cor,#E04040)),repeating-linear-gradient(#FFFEF6 0 17px,#B7CDE8 17px 18px);background-size:100% 4px,100% 100%;background-repeat:no-repeat,repeat;background-position:0 30px,0 34px}
.icard.nocor{--cor:#E04040}
.icard header{display:flex;gap:6px;align-items:flex-start;padding:6px 6px 0;min-height:24px}
.icard .cn{font:700 12px/1.3 "Courier New",monospace;background:#000080;color:#fff;padding:0 4px}
.icard .ch{flex:1;font:700 11px/1.25 "Courier New",monospace;text-transform:uppercase;overflow-wrap:anywhere;max-height:2.6em;overflow:hidden}
.icard .cbtn{width:18px;height:16px;border:0;padding:0;background:var(--cor,#ccc);box-shadow:inset -1px -1px #000,inset 1px 1px #fff;cursor:default}
.icard textarea{flex:1;border:0;box-shadow:none;background:transparent;resize:none;font:12px/18px "Courier New",monospace;padding:6px 8px 0;margin-top:6px;color:#111;min-height:90px}
.icard textarea::placeholder{color:#8A8F99;font-style:italic}
.icard footer{display:flex;justify-content:space-between;gap:6px;padding:3px 8px 5px;font:10.5px/1.2 Tahoma,Arial,sans-serif;color:#555;background:#FFFEF6;border-top:1px solid #DDD}
.icard.drop-before{outline:3px solid #FFFF00;outline-offset:2px}
.icard.dragging{opacity:.4}
.addcard{min-height:150px;border:2px dashed rgba(255,255,255,.7);background:transparent;color:#fff;font:400 22px/1 var(--f-pix);cursor:default}

/* ---------- celular ---------- */
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)!important}
  body[data-view=page] .side{display:none} body[data-view=panel] .desk{display:none}
  body[data-view=panel] .side{display:block!important}
  .task.mob{display:flex;flex:0 1 auto} .task.main{display:none}
  .menubar>button{padding:3px 5px}
  .hide-sm{display:none!important}
}

/* barras de rolagem de época */
*{scrollbar-color:var(--face) var(--light)}
::-webkit-scrollbar{width:16px;height:16px}
::-webkit-scrollbar-track{background:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px}
::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
::-webkit-scrollbar-corner{background:var(--face)}

/* ---------- calendário de época ---------- */
.dpw{display:flex;min-width:0}
.dpw input{flex:1;min-width:0}
.dpb{width:21px;height:21px;border:0;background:var(--face);padding:0;cursor:default;display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--light)}
.dpb:active{box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--dk)}
.cal{position:fixed;z-index:96;background:var(--face);padding:6px;width:244px;box-sizing:border-box;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light),inset -2px -2px var(--lo),inset 2px 2px var(--hi),3px 3px 0 rgba(0,0,0,.3)}
.cal-head{display:flex;gap:4px;margin-bottom:6px;align-items:center}
.cal-head select{flex:1}
.cal-yr{display:flex;align-items:stretch}
.cal-yr input{width:52px;text-align:right}
.cal-yr .spin{display:flex;flex-direction:column}
.cal-yr .spin button{width:16px;height:10.5px;border:0;padding:0;background:var(--face);font-size:7px;line-height:1;cursor:default;box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--field);padding:2px;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.cal-grid .wd{text-align:center;font-weight:700;background:var(--title1);color:var(--titletext);padding:2px 0}
.cal-grid .wd.mon{text-decoration:underline}
.cal-grid button{border:0;background:transparent;height:23px;cursor:default;font-variant-numeric:tabular-nums;padding:0;color:var(--text)}
.cal-grid button.out{color:var(--lo)}
.cal-grid button.mon{font-weight:700}
.cal-grid button:hover{outline:1px dotted var(--text);outline-offset:-3px}
.cal-grid button.sel{background:var(--sel);color:var(--seltext)}
.cal-grid button.today{box-shadow:inset 0 0 0 1px var(--err)}
.cal-grid button:focus-visible{outline:1px dotted var(--text);outline-offset:-3px}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px}
.cal-foot .muted{font-size:11px}

/* ---------- elenco ---------- */
.cast{padding:10px;box-sizing:border-box}
.castwin{background:var(--face);padding:3px;max-width:1180px;margin:0 auto;
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light),inset -2px -2px var(--lo),inset 2px 2px var(--hi),3px 3px 0 rgba(0,0,0,.3)}
.castwin>.ptabs{margin-top:6px}
.cast-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:10px;align-items:start}
.clist{max-height:62vh}
.clist td.sw i{display:inline-block;width:10px;height:10px;border:1px solid var(--text);vertical-align:middle}
.clist tr.grp td{background:var(--face);color:var(--muted);font-weight:700;cursor:default}
.clist tbody tr.grp:hover td{background:var(--face);color:var(--muted)}
.ficha{display:flex;flex-direction:column;gap:8px;min-width:0}
.fhead{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start}
.foto{width:96px;height:120px;background:var(--field);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:default;border:0;padding:0;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.foto img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
.fname{font:400 34px/1 var(--f-pix);letter-spacing:.03em;overflow-wrap:anywhere}
.fsub{color:var(--muted);margin-top:4px}
.fbtns{display:flex;flex-direction:column;gap:4px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fgrid .full{grid-column:1/-1}
.swatches{display:flex;gap:3px;flex-wrap:wrap}
.swatches button{width:18px;height:18px;border:0;padding:0;cursor:default;box-shadow:inset -1px -1px #000,inset 1px 1px #fff}
.swatches button[aria-pressed=true]{outline:2px solid var(--text);outline-offset:1px}
.relrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding:8px 8px 0;background:var(--field);
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars .b i{display:block;width:70%;background:var(--sel);box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--light)}
.bars .b span{font-size:10.5px;padding:2px 0;white-space:nowrap}
.quote{font-family:var(--f-type);background:var(--field);padding:8px 10px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums;min-width:38px}
.heat td.warn{color:var(--warn);font-weight:700}
.mapbox{background:var(--field);padding:6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.mapbox svg text{font:11px Tahoma,Verdana,Arial,sans-serif}
.mapbox .node{cursor:pointer}
.mapbox .node:focus-visible circle{stroke-width:3}
@media (max-width:760px){.cast-grid{grid-template-columns:minmax(0,1fr)}.fhead{grid-template-columns:72px minmax(0,1fr)}.fhead .fbtns{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.foto{width:72px;height:90px}.fgrid{grid-template-columns:minmax(0,1fr)}}

/* ---------- bloco de notas, protetor de tela, modo nativo ---------- */
.np textarea{font:13px/1.4 "Courier New",monospace;min-height:300px;resize:vertical}
.saver{position:fixed;inset:0;z-index:300;background:#000;cursor:none}
.saver canvas{position:absolute;inset:0;width:100%;height:100%}
.sq{position:absolute;max-width:min(640px,82vw);color:#FFB000;font:400 30px/1.15 var(--f-pix);text-shadow:0 0 8px rgba(255,176,0,.5);transition:opacity .6s}
.sq-w{color:#9FD4FF;font-size:22px;margin-top:10px}
body.native #mainTitle{-webkit-app-region:drag}
body.native #mainTitle .tb-btn{-webkit-app-region:no-drag}

/* ---------- séries, temporada, comparar ---------- */
.fmtlist{display:flex;flex-direction:column;max-height:46vh;overflow:auto;background:var(--field);padding:2px;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.fmtlist label{display:grid;grid-template-columns:auto 22px minmax(0,1fr);gap:6px;align-items:start;padding:5px 6px;cursor:default}
.fmtlist label:has(input:checked){background:var(--sel);color:var(--seltext)}
.fmtlist label:has(input:checked) small{color:var(--seltext)}
.fmtlist small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip95{padding:1px 6px;background:var(--field);white-space:nowrap;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.chip95 i{display:inline-block;width:8px;height:8px;margin-right:4px;border:1px solid var(--text);vertical-align:middle}
.plan td{vertical-align:middle;border-bottom:1px solid var(--light)}
.plan tbody tr:hover td{background:transparent;color:inherit}
.plan tr.curep td{background:color-mix(in srgb,var(--sel) 12%,var(--field))}
.plan input[type=text],.plan select{width:100%}
.plan td .dpw{min-width:118px}
.plan .lg{min-width:240px}
.plan small{display:block;margin-top:2px}
.plan small.late{color:var(--err);font-weight:700}
.diff .d{padding:3px 8px;font:12px/1.4 "Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere;border-bottom:1px dotted #ccc}
.diff .d.add{background:#DFF5DF;color:#053}
.diff .d.del{background:#F8DADA;color:#600;text-decoration:line-through}
.diff .d small{font:700 11px Tahoma,Arial,sans-serif;text-decoration:none;display:inline-block;margin-right:8px}
.diff .ctx{color:var(--muted);font-weight:700;padding:8px 8px 3px;background:var(--field)}
.season{padding:10px;box-sizing:border-box}

/* ---------- acessórios ---------- */
.acc-root{display:flex;flex-direction:column;gap:6px;min-height:0;outline:none}
.accbar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;padding-bottom:4px;border-bottom:1px solid var(--lo);box-shadow:0 1px var(--hi)}
.accbar button{border:0;background:transparent;padding:2px 7px;cursor:default}
.accbar button:hover{background:var(--sel);color:var(--seltext)}
.accbar small{opacity:.7}
.accbar .chk{margin-left:auto}
.nptext{min-height:300px;flex:1;font:13px/1.45 "Courier New",monospace;resize:vertical;white-space:pre-wrap}
.accstatus{display:flex;gap:2px}
.accstatus span{flex:1;padding:1px 6px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo)}
.accstatus span+span{flex:0 0 auto}
.calc,.crono{display:flex;flex-direction:column;gap:8px}
.lcd{background:var(--field);color:var(--text);text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.lcd .expr{color:var(--muted);min-height:1.3em;overflow-wrap:anywhere;font-size:12px}
.lcd .res{font:400 34px/1.1 var(--f-pix)}
.lcd.big{text-align:center;font:400 54px/1.1 var(--f-pix);padding:10px}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.keys .ck{min-width:0;height:30px;padding:0;font-weight:700}
.keys .ck.op{color:#B00000}
.keys .ck.eq{grid-column:1/-1;color:#000080}
body[data-scheme=contraste] .keys .ck.op,body[data-scheme=contraste] .keys .ck.eq{color:var(--link)}
.mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));background:var(--field);padding:2px;
  box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}
.mc-grid button{height:32px;border:1px solid var(--light);background:var(--field);color:var(--text);font:18px "Courier New",serif;cursor:default;padding:0}
.mc-grid button:hover,.mc-grid button:focus-visible{background:var(--sel);color:var(--seltext);outline:none}
.mc-prev{margin-left:auto;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font:30px "Courier New",serif;background:var(--field);
  box-shadow:inset -1px -1px var(--dk),inset 1px 1px var(--hi),2px 2px 0 rgba(0,0,0,.25)}
.prog.wide{width:100%;height:18px;gap:2px;padding:2px}
.prog.wide i{width:calc((100% - 58px)/30)}
.prog.marquee i{width:14px;animation:marq 1.6s linear infinite}
@keyframes marq{from{transform:translateX(-40px)}to{transform:translateX(380px)}}
.balloon{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:97;max-width:300px;text-align:left;
  background:#FFFFE1;color:#000;border:1px solid #000;border-radius:7px;padding:8px 10px;box-shadow:2px 2px 0 rgba(0,0,0,.3);cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit}
.balloon b{display:flex;gap:5px;align-items:center}
.balloon::after{content:"";position:absolute;right:28px;bottom:-9px;border:9px solid transparent;border-top-color:#000;border-bottom:0}
body.tool{overflow:hidden}
.toolwin{height:100vh;box-sizing:border-box}
.toolbody{flex:1;overflow:auto;padding:8px;min-height:0;display:flex;flex-direction:column}
.toolbody .acc-root{flex:1}
.toolbody .nptext{min-height:0}
@media (prefers-reduced-motion:reduce){.prog.marquee i{animation:none}}

/* ---------- página e margens ---------- */
.ruler{width:calc(var(--pw,210)*1mm);position:sticky;top:0;z-index:5;box-shadow:inset -1px -1px #fff,inset 1px 1px #808080,0 2px 0 rgba(0,0,0,.25)}
.ruler .area{left:calc(var(--ml,38.1)*1mm);right:calc(var(--mr,25.4)*1mm)}
.ruler .mk{border:0;width:12px;height:9px;background:#000080;clip-path:polygon(50% 0,100% 100%,0 100%);cursor:ew-resize;bottom:0;touch-action:none}
.ruler .mk.r{background:#800000}
.ruler .hd{position:absolute;top:2px;width:7px;height:17px;transform:translateX(-50%);background:#C0C0C0;cursor:ew-resize;touch-action:none;
  box-shadow:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080}
.ruler .rtip{position:absolute;top:0;z-index:3;background:#FFFFE1;color:#000;border:1px solid #000;padding:1px 5px;font:11px Tahoma,Arial,sans-serif;white-space:nowrap;pointer-events:none}
.sheet{width:calc(var(--pw,210)*1mm);padding:calc(var(--mt,25.4)*1mm) calc(var(--mr,25.4)*1mm) calc(var(--mb,25.4)*1mm) calc(var(--ml,38.1)*1mm)}
.tp{min-height:calc((var(--ph,297) - var(--mt,25.4) - var(--mb,25.4))*1mm)}
.pgd{margin:14pt calc(var(--mr,25.4)*-1mm) 14pt calc(var(--ml,38.1)*-1mm)}
.pgd span{right:calc(var(--mr,25.4)*1mm)}
.e-character{margin-left:calc(var(--ic,50.8)*1mm)}
.e-paren{margin:0 calc(var(--ipr,38.1)*1mm) 0 calc(var(--ipl,38.1)*1mm)}
.e-dialogue{margin:0 calc(var(--idr,25.4)*1mm) 0 calc(var(--idl,25.4)*1mm)}
.pgsetup{display:grid;grid-template-columns:200px minmax(0,1fr) 210px;gap:12px;align-items:start}
.pglist{max-height:420px;padding:2px}
.pgopt{padding:6px 7px;cursor:default;border-bottom:1px dotted var(--light)}
.pgopt small{display:block;color:var(--muted);margin-top:2px}
.pgopt.sel{background:var(--sel);color:var(--seltext)}.pgopt.sel small{color:var(--seltext)}
.pgopt:focus-visible{outline:1px dotted var(--text);outline-offset:-3px}
.cmf{display:flex;align-items:center;gap:4px}.cmf input{width:70px}
.pgprev{background:var(--deskgrey);padding:4px;min-height:300px;box-shadow:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--light),inset 2px 2px var(--dk)}

<script>
"use strict";
/* ================================================================ modelo */
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const MES_IX={janeiro:1,fevereiro:2,"março":3,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
const uid=(p="")=>p+Math.random().toString(36).slice(2,8);
const parseISO=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null;};
const isoOf=d=>d.toISOString().slice(0,10);
const pad2=n=>String(n).padStart(2,"0");
const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtN=n=>n.toLocaleString("pt-BR");

const TYPES={
  scene:{label:"Cena",key:"1",ph:"INT. LOCAL — NOITE"},
  action:{label:"Ação",key:"2",ph:"Ação"},
  character:{label:"Personagem",key:"3",ph:"PERSONAGEM"},
  dialogue:{label:"Fala",key:"4",ph:"Fala"},
  paren:{label:"Rubrica",key:"5",ph:"(rubrica)"},
  note:{label:"Nota",key:"6",ph:"GRADE: …"},
  time:{label:"Minutagem",key:"7",ph:"[0:00–1:00]"},
  act:{label:"Ato",key:"8",ph:"ATO UM"},
};
const ORDER=["scene","action","character","dialogue","paren","note","time","act"];
const NEXT_ON_ENTER={act:"scene",scene:"time",time:"action",note:"action",action:"action",character:"dialogue",paren:"dialogue",dialogue:"character"};
const TAB={action:"character",character:"action",dialogue:"paren",paren:"dialogue",scene:"action",time:"action",note:"action",act:"scene"};
const STAB={action:"scene",character:"dialogue",dialogue:"character",paren:"dialogue",scene:"act",time:"scene",note:"action",act:"action"};
const UPPER=new Set(["scene","character","act"]);
const ACTS=["TEASER","ATO UM","ATO DOIS","ATO TRÊS","ATO QUATRO","ATO CINCO","EPÍLOGO"];

function newScript(prev){
  const meta={serie:"FUNDAÇÃO VARGUELIA",codigo:"ANS001",temporada:1,episodio:21,titulo:"TÍTULO DO EPISÓDIO.",duracao:"cerca de 60 minutos",estreia:"1984-03-05",canal:"C2",
    notas:["Película 16 mm, 4:3. Efeitos práticos, miniaturas e pintura em vidro.","Rascunho de teste · adaptação do livro com liberdade criativa"]};
  if(prev){Object.assign(meta,JSON.parse(JSON.stringify(prev.meta)));meta.episodio=(+prev.meta.episodio||0)+1;meta.titulo="TÍTULO DO EPISÓDIO.";meta.estreia=nextAir(prev.meta.estreia,S.series[prev.meta.serieId]);}
  const E=(t,x)=>({id:uid(),t,x});
  return {id:uid("ep"),meta,atualizado:Date.now(),els:[E("act","TEASER"),E("scene","INT. LOCAL — NOITE"),E("time","[0:00–1:00]"),E("note","GRADE: o mesmo plano em que o episódio anterior terminou."),E("action",""),E("act","ATO UM")]};
}
const epCode=m=>`${m.codigo} ${epTag(m)}`;
const epLabel=s=>`${epTag(s.meta)} · ${String(s.meta.titulo||"").replace(/[.“”"]+$/,"")}`;
function estreiaLine(m){const d=parseISO(m.estreia);if(!d)return "";return `Estreia: ${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}${m.canal?" · "+m.canal:""}`;}
const fmtDate=iso=>{const d=parseISO(iso);return d?`${d.getUTCDate()}/${d.getUTCMonth()+1}/${d.getUTCFullYear()}`:"?";};
const baseName=x=>String(x||"").replace(/\s*\(.*$/,"").trim().toUpperCase();

/* ================================================================ minutagem */
const TC=/^\s*\[(\d+):(\d{2})\s*[–-]\s*(\d+):(\d{2})\]\s*$/;
function parseTC(x){const m=TC.exec(x||"");return m?{a:+m[1]*60+ +m[2],b:+m[3]*60+ +m[4]}:null;}
const mmss=s=>`${Math.floor(s/60)}:${pad2(s%60)}`;

/* ================================================================ paginação (Courier: 10 caracteres por polegada) */
const WCH={act:57,scene:57,time:69,note:62,action:57,character:37,paren:27,dialogue:37};
let LPP=58;
function wrapCount(s,w){
  if(!s)return 1;let lines=0;
  for(const para of String(s).split("\n")){let len=0,l=1;
    for(const word of para.split(/\s+/).filter(Boolean)){const wl=word.length;
      if(len===0){len=wl;while(len>w){l++;len-=w;}}else if(len+1+wl<=w)len+=1+wl;else{l++;len=wl;while(len>w){l++;len-=w;}}}
    lines+=l;}
  return lines;
}
function paginate(sc){
  const LP=geomOf(sc).lpp;const info=layout(sc),els=sc.els;let y=0,page=2;const breaks=[];
  for(let i=0;i<els.length;i++){const f=info[i];
    if(f.keepNext&&y>0){let h=f.before+f.lines+f.after,j=i+1;
      while(j<els.length&&info[j].keepNext&&h<=LP){h+=info[j].before+info[j].lines+info[j].after;j++;}
      if(j<els.length)h+=info[j].before+(typeof tailH==="function"?tailH(els[j],info[j]):(info[j].keepLines?info[j].lines:1));
      if(h<=LP&&y+h>LP){page++;y=0;breaks.push({i,pos:"before",page});}}
    else if(f.keepLines&&y>0&&y+f.before+f.lines>LP&&f.lines<=LP){page++;y=0;breaks.push({i,pos:"before",page});}
    if(y>0)y+=f.before;
    f.page=page;let L=f.lines;
    while(y+L>LP){L-=(LP-y);page++;y=0;breaks.push({i,pos:"after",page});}
    y+=L+f.after;
    if(y>=LP&&i<els.length-1){page++;y=0;breaks.push({i,pos:"after",page});}
  }
  const seen=new Set();
  return {info,breaks:breaks.filter(b=>!seen.has(b.page)&&seen.add(b.page)),pages:y>0?page:page-1,lpp:LP};
}

/* ================================================================ cenas e personagens */
function scenesOf(sc,info){
  info=info||paginate(sc).info;const out=[];let cur=null,act="";
  sc.els.forEach((e,i)=>{
    if(e.t==="act"){act=e.x;cur=null;out.push({act:e.x,i,id:e.id});return;}
    if(e.t==="scene"){cur={n:info[i].num,label:info[i].label,id:e.id,i,h:e.x,act,tc:null,tcId:null,chars:new Set(),lines:0,falas:0,page:info[i].page,cor:e.cor,syn:e.syn,first:""};out.push(cur);}
    if(!cur)return;
    const f=info[i];cur.lines+=f.before+f.lines+f.after;
    if(e.t==="time"&&!cur.tc){cur.tc=parseTC(e.x);cur.tcRaw=e.x;cur.tcId=e.id;}
    if(e.t==="character"){cur.chars.add(baseName(e.x));cur.falas++;}
    if(e.t==="action"&&!cur.first&&e.x.trim())cur.first=e.x;
  });
  return out;
}
function charStats(sc){
  const m=new Map();let curScene=0,who=null;
  sc.els.forEach((e,i)=>{
    if(e.t==="scene")curScene++;
    if(e.t==="character"){who=baseName(e.x);let s=m.get(who);if(!s)m.set(who,s={name:who,falas:0,palavras:0,cenas:new Set(),ids:[]});s.falas++;s.cenas.add(curScene);s.ids.push(e.id);}
    else if(e.t==="dialogue"&&who){const s=m.get(who);s.palavras+=(e.x.match(/[\p{L}\p{N}]+/gu)||[]).length;}
    else if(e.t!=="paren")who=null;
  });
  return [...m.values()].sort((a,b)=>b.falas-a.falas);
}

/* ================================================================ estado */
const LS="varguelia.sala.v1",LS_VER="varguelia.sala.versoes.v1";
const S={eps:{},cur:null,db:null,dl:null,dirty:new Set(),saving:false,tool:"cenas",focusId:null,q:{find:"",rep:"",all:false,cs:false},cyc:{},lay:null};
const cur=()=>S.eps[S.cur];
const layOk=sc=>(S.lay&&sc===cur()&&S.lay.info&&S.lay.info.length===sc.els.length)?S.lay:paginate(sc);
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"null");}catch(e){return null;}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({eps:S.eps,cur:S.cur}));}catch(e){}}
function setStatus(k,t){const el=document.getElementById("status");el.className="status "+k;el.lastElementChild.textContent=t;}
let saveT=null;
function markChanged(sc){sc=sc||cur();if(!sc)return;sc.atualizado=Date.now();S.dirty.add(sc.id);clearTimeout(saveT);setStatus("busy","Alterações não salvas");saveT=setTimeout(flush,1500);}
async function flush(){
  lsSave();lsSaveExtra();lsSaveSeries();
  if(!S.db){setStatus("local","Salvo só neste navegador");S.dirty.clear();S.dirtyC.clear();S.dirtyN=false;S.dirtyS.clear();S.dirtyM.clear();return;}
  if(S.saving){saveT=setTimeout(flush,800);return;}
  S.saving=true;setStatus("busy","Salvando…");const ids=[...S.dirty];S.dirty.clear();const cids=[...S.dirtyC];S.dirtyC.clear();const nt=S.dirtyN;S.dirtyN=false;const sids=[...S.dirtyS];S.dirtyS.clear();const mids=[...S.dirtyM];S.dirtyM.clear();
  try{for(const id of ids){const s=S.eps[id];if(s)await S.db.collection("roteiros").doc(id).set(JSON.parse(JSON.stringify(s)));}
    for(const id of cids){const c=S.chars[id];if(c)await S.db.collection("personagens").doc(id).set(JSON.parse(JSON.stringify(c)));}
    if(nt&&S.notas.sala)await S.db.collection("notas").doc("sala").set(S.notas.sala);
    for(const id of sids){const v=S.series[id];if(v)await S.db.collection("series").doc(id).set(JSON.parse(JSON.stringify(v)));}
    for(const id of mids){const v=S.modelos[id];if(v)await S.db.collection("modelos").doc(id).set(JSON.parse(JSON.stringify(v)));}
    setStatus("ok",S.okText||"Salvo");}
  catch(e){ids.forEach(i=>S.dirty.add(i));cids.forEach(i=>S.dirtyC.add(i));if(nt)S.dirtyN=true;sids.forEach(i=>S.dirtyS.add(i));mids.forEach(i=>S.dirtyM.add(i));setStatus("local",e&&e.code==="invalid_argument"?"Item grande demais para a nuvem; salvo neste navegador":"Sem acesso ao armazenamento agora; salvo neste navegador");}
  S.saving=false;
}

/* desfazer */
const H={undo:[],redo:[],last:null,t:null,auto:new Set()};
const snap=()=>{const s=cur();return s?JSON.stringify({meta:s.meta,els:s.els}):null;};
function histReset(){clearTimeout(H.t);H.t=null;H.undo=[];H.redo=[];H.last=snap();}
function histCommit(){clearTimeout(H.t);H.t=null;const now=snap();if(!now||now===H.last)return;
  if(H.last&&!H.auto.has(S.cur)){H.auto.add(S.cur);saveVersion("Automática · antes desta sessão",true,JSON.parse(H.last)).catch(()=>{});}
  H.undo.push(H.last);if(H.undo.length>80)H.undo.shift();H.redo=[];H.last=now;}
function touch(structural){markChanged();if(structural)histCommit();else{clearTimeout(H.t);H.t=setTimeout(histCommit,800);}scheduleDecor();}
function histApply(s){const sc=cur(),o=JSON.parse(s);sc.meta=o.meta;sc.els=o.els;H.last=s;markChanged();const f=S.focusId;renderAll();if(f&&findEl(f))focusEl(f,"end");}
function undo(){histCommit();if(!H.undo.length){toast("Nada para desfazer");return;}H.redo.push(H.last);histApply(H.undo.pop());}
function redo(){histCommit();if(!H.redo.length){toast("Nada para refazer");return;}H.undo.push(H.last);histApply(H.redo.pop());}

/* versões */
function lsVer(){try{return JSON.parse(localStorage.getItem(LS_VER)||"[]");}catch(e){return [];}}
function lsVerSet(a){try{localStorage.setItem(LS_VER,JSON.stringify(a.slice(-30)));}catch(e){}}
async function saveVersion(label,auto,snapshot){
  const sc=cur();if(!sc)return;const s=snapshot||{meta:sc.meta,els:sc.els};
  const v={id:uid("v"),epId:sc.id,label,auto:!!auto,at:Date.now(),cenas:s.els.filter(e=>e.t==="scene").length,snapshot:JSON.parse(JSON.stringify(s))};
  if(S.db){try{await S.db.collection("versoes").doc(v.id).set(v);return v;}catch(e){}}
  const a=lsVer();a.push(v);lsVerSet(a);return v;
}
async function listVersions(epId){
  let out=[];
  if(S.db){try{out=(await S.db.collection("versoes").where("epId","==",epId).get()).docs.map(d=>Object.assign(d.data(),{id:d.id}));}catch(e){}}
  out=out.concat(lsVer().filter(v=>v.epId===epId).map(v=>Object.assign(v,{local:true}))).sort((a,b)=>b.at-a.at);
  const autos=out.filter(v=>v.auto);if(autos.length>10)for(const v of autos.slice(10)){await delVersion(v);out=out.filter(x=>x!==v);}
  return out;
}
async function delVersion(v){if(v.local){lsVerSet(lsVer().filter(x=>x.id!==v.id));return;}if(S.db){try{await S.db.collection("versoes").doc(v.id).delete();}catch(e){}}}

let decorT=null;
function scheduleDecor(){clearTimeout(decorT);decorT=setTimeout(decor,250);}
let zoom=1;
function fitSheet(){const avail=desk.clientWidth-36,full=(typeof geomOf==="function"&&cur()?geomOf(cur()).paper.w:210)*3.7795;const z=(typeof prefs!=="undefined"?prefs.zoom:"fit");zoom=z==="fit"?Math.min(1,avail/full):(+z/100);document.getElementById("scale").style.zoom=zoom;}

  if(typeof updStatus==="function"){updStatus();updRuler(f?f.e.t:null);updTitle();}

function setCaret(node,where){
  node.focus({preventScroll:true});const s=getSelection(),r=document.createRange();
  const t=node.firstChild;const len=node.textContent.length;
  let off=where==="end"?len:where==="start"?0:Math.min(+where||0,len);
  if(t&&t.nodeType===3)r.setStart(t,Math.min(off,t.length));else r.setStart(node,0);
  r.collapse(true);s.removeAllRanges();s.addRange(r);
}
function caretOff(node){const s=getSelection();if(!s.rangeCount)return 0;const r=s.getRangeAt(0);const p=r.cloneRange();p.selectNodeContents(node);p.setEnd(r.startContainer,r.startOffset);return p.toString().length;}
function selLen(){const s=getSelection();return s.rangeCount?s.getRangeAt(0).toString().length:0;}
function focusEl(id,where,scroll){const n=nodeOf(id);if(!n)return;setCaret(n,where==null?"end":where);
  if(scroll!==false){const r=n.getBoundingClientRect(),d=desk.getBoundingClientRect();if(r.top<d.top+60||r.bottom>d.bottom-40)n.scrollIntoView({block:"center"});}}
function flash(id){const n=nodeOf(id);if(!n)return;n.classList.add("flash");setTimeout(()=>n.classList.remove("flash"),900);}

function insertEl(afterIdx,t,x,where){
  const sc=cur();const e={id:uid(),t,x:x||""};markRev(e);sc.els.splice(afterIdx+1,0,e);
  const ref=afterIdx>=0?nodeOf(sc.els[afterIdx].id):null;
  const tmp=document.createElement("div");tmp.innerHTML=elHTML(e,{num:"?",end:true});const n=tmp.firstChild;
  if(ref){let r=ref;n&&r.after(n);}else{const tp=document.getElementById("titlePage");const nx=tp.nextElementSibling;(nx&&nx.classList.contains("pgd")?nx:tp).after(n);}
  touch(true);setCaret(n,where==null?"end":where);n.scrollIntoView({block:"nearest"});return e;
}
function setType(id,t){
  const f=findEl(id);if(!f||f.e.t===t)return;const old=f.e.t;f.e.t=t;markRev(f.e);
  if(t==="paren"&&!/^\(/.test(f.e.x))f.e.x="("+f.e.x+")";
  if(old==="paren"&&t!=="paren")f.e.x=f.e.x.replace(/^\(|\)$/g,"");
  if(t==="time"&&!f.e.x.trim())f.e.x=suggestTC(f.i);
  const n=nodeOf(id);const off=n?caretOff(n):0;
  const tmp=document.createElement("div");tmp.innerHTML=elHTML(f.e,{num:"?",end:true});const nn=tmp.firstChild;n.replaceWith(nn);
  touch(true);setCaret(nn,t==="paren"&&f.e.x==="()"?1:off);decor();
}
function suggestTC(idx){
  const sc=cur();let prevEnd=null;for(let k=idx-1;k>=0;k--){const e=sc.els[k];if(e.t==="time"){const tc=parseTC(e.x);if(tc){prevEnd=tc.b;break;}}}
  const a=prevEnd==null?0:prevEnd;return `[${mmss(a)}–${mmss(a+60)}]`;
}
function removeEl(idx){const sc=cur();const e=sc.els[idx];const n=nodeOf(e.id);sc.els.splice(idx,1);if(n)n.remove();touch(true);}

/* entrada de texto */
sheet.addEventListener("input",e=>{
  const n=e.target.closest(".el");if(!n)return;const f=findEl(n.dataset.id);if(!f)return;
  if(n.childNodes.length>1||(n.firstChild&&n.firstChild.nodeType!==3)){const off=caretOff(n);n.textContent=n.textContent;setCaret(n,off);}
  f.e.x=n.textContent;
  if(f.e.t==="action"&&/^(INT|EXT|INT\.\/EXT)\.\s/i.test(f.e.x)){setType(f.e.id,"scene");}
  else if(f.e.t==="dialogue"&&f.e.x==="("){f.e.x="()";n.textContent="()";setType(f.e.id,"paren");setCaret(nodeOf(f.e.id),1);}
  touch(false);
  if(f.e.t==="character"||f.e.t==="scene"||f.e.t==="trans")showAC(f.e.id);else hideAC();
});
sheet.addEventListener("focusin",e=>{const n=e.target.closest(".el");if(!n)return;S.focusId=n.dataset.id;renderTypebar();markSceneInSide();});
sheet.addEventListener("focusout",e=>{const n=e.target.closest(".el");if(!n)return;setTimeout(()=>{const a=document.activeElement;if(a&&a.dataset&&a.dataset.id&&a.dataset.id===acFor)return;if(!a||!a.closest||!a.closest(".ac"))hideAC();},120);
  const f=findEl(n.dataset.id);if(f&&f.e.t==="paren"){const x=f.e.x.trim();if(x&&!/^\(.*\)$/.test(x)){f.e.x="("+x.replace(/^\(|\)$/g,"")+")";n.textContent=f.e.x;touch(false);}}});
sheet.addEventListener("click",e=>{if(e.target.closest("#titlePage")){S.tool="episodio";renderSide();if(document.body.dataset.view==="page"&&innerWidth<=900)setView("panel");}});
sheet.addEventListener("paste",e=>{
  const n=e.target.closest(".el");if(!n)return;e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData("text").replace(/\r/g,"");
  if(!/\n/.test(txt.trim())){document.execCommand("insertText",false,txt);return;}
  const f=findEl(n.dataset.id);const els=parseText(txt);if(!els.length)return;
  const sc=cur();const repl=!f.e.x.trim();els.forEach(markRev);sc.els.splice(repl?f.i:f.i+1,repl?1:0,...els);
  touch(true);renderSheet();focusEl(els[els.length-1].id,"end");toast(`${els.length} elementos colados`);
});
sheet.addEventListener("keydown",e=>{
  const n=e.target.closest(".el");if(!n)return;const f=findEl(n.dataset.id);if(!f)return;
  if(acOpen()&&["ArrowDown","ArrowUp","Enter","Tab","Escape"].includes(e.key)){if(acKey(e))return;}
  const off=caretOff(n),len=n.textContent.length,sl=selLen();
  if(e.altKey&&/^Digit[1-9]$/.test(e.code)){e.preventDefault();const t=ORDER.find(k=>TYPES[k].key===e.code.slice(5));setType(f.e.id,t);return;}
  if(e.key==="Tab"){e.preventDefault();setType(f.e.id,(e.shiftKey?STAB:TAB)[f.e.t]||"action");return;}
  if(e.key==="Enter"){
    e.preventDefault();hideAC();
    if(!f.e.x.trim()&&f.e.t!=="action"){setType(f.e.id,"action");return;}
    if(!f.e.x.trim()&&f.e.t==="action")return;
    if(off<len&&sl===0&&off>0&&["action","dialogue","note"].includes(f.e.t)){const a=f.e.x.slice(0,off).replace(/\s+$/,""),b=f.e.x.slice(off).replace(/^\s+/,"");f.e.x=a;n.textContent=a;insertEl(f.i,f.e.t,b,"start");return;}
    if(f.e.t==="character"){f.e.x=f.e.x.toUpperCase();n.textContent=f.e.x;}
    const nt=NEXT_ON_ENTER[f.e.t]||"action";
    const x=nt==="time"?suggestTC(f.i+1):nt==="paren"?"()":"";
    insertEl(f.i,nt,x,nt==="time"?"end":0);
    if(nt==="time"){const nn=nodeOf(cur().els[f.i+1].id);const v=nn.textContent;setCaret(nn,v.length-1);}
    return;
  }
  if(e.key==="Backspace"&&off===0&&sl===0){
    if(f.i===0&&f.e.x)return;e.preventDefault();
    const sc=cur();const prev=sc.els[f.i-1];
    if(!f.e.x){removeEl(f.i);if(prev)focusEl(prev.id,"end");else if(sc.els[0])focusEl(sc.els[0].id,"start");scheduleDecor();return;}
    if(!prev)return;const j=prev.x.length;prev.x=prev.x+(prev.x&&!/\s$/.test(prev.x)?" ":"")+f.e.x;const pn=nodeOf(prev.id);pn.textContent=prev.x;removeEl(f.i);setCaret(pn,j+(j?1:0));scheduleDecor();return;
  }
  if(e.key==="Delete"&&off===len&&sl===0){
    const sc=cur();const nx=sc.els[f.i+1];if(!nx)return;e.preventDefault();
    f.e.x=f.e.x+(f.e.x&&nx.x?" ":"")+nx.x;n.textContent=f.e.x;removeEl(f.i+1);setCaret(n,off);scheduleDecor();return;
  }
  if((e.key==="ArrowUp"||e.key==="ArrowLeft")&&sl===0){
    const atStart=e.key==="ArrowLeft"?off===0:(off===0||onEdgeLine(n,"top"));
    if(atStart){const prev=cur().els[f.i-1];if(prev){e.preventDefault();focusEl(prev.id,e.key==="ArrowLeft"?"end":"end");}}
  }
  if((e.key==="ArrowDown"||e.key==="ArrowRight")&&sl===0){
    const atEnd=e.key==="ArrowRight"?off===len:(off===len||onEdgeLine(n,"bottom"));
    if(atEnd){const nx=cur().els[f.i+1];if(nx){e.preventDefault();focusEl(nx.id,"start");}}
  }
});
function onEdgeLine(n,edge){
  const s=getSelection();if(!s.rangeCount)return true;const r=s.getRangeAt(0).cloneRange();const rects=r.getClientRects();const rr=rects[0]||r.getBoundingClientRect();
  if(!rr||(!rr.height&&!rr.top))return true;
  const cs=getComputedStyle(n);const er=n.getBoundingClientRect();
  const pt=parseFloat(cs.paddingTop)*zoom,pb=parseFloat(cs.paddingBottom)*zoom,lh=rr.height||16*zoom;
  return edge==="top"?(rr.top-(er.top+pt))<lh*0.6:((er.bottom-pb)-rr.bottom)<lh*0.6;
}

/* ================================================================ autocompletar */
let acEl=null,acList=[],acIdx=0,acFor=null;
function knownNames(){const m=new Map();for(const s of seriesEps(curSid()))for(const e of s.els)if(e.t==="character"&&e.x.trim()){const k=e.x.trim().toUpperCase();m.set(k,(m.get(k)||0)+1);}for(const c of seriesChars())[c.nome,...(c.aliases||[])].forEach(n=>{if(n&&!m.has(n.toUpperCase()))m.set(n.toUpperCase(),0);});return m;}
function knownHeads(){const m=new Map();for(const s of seriesEps(curSid()))for(const e of s.els)if(e.t==="scene"&&e.x.trim()){const k=e.x.trim().toUpperCase();m.set(k,(m.get(k)||0)+1);}return m;}
let acCache={k:"",names:null,heads:null};
function acSource(t){const k=curSid()+":"+Object.keys(S.eps).length+":"+Object.values(S.eps).reduce((a,s)=>a+s.els.length,0);if(acCache.k!==k)acCache={k,names:null,heads:null};
  if(t==="character")return acCache.names||(acCache.names=knownNames());return acCache.heads||(acCache.heads=knownHeads());}
function showAC(id){
  const f=findEl(id);if(!f)return hideAC();const q=f.e.x.trim().toUpperCase();
  if(!q){hideAC();return;}
  const src=acSource(f.e.t);
  acList=[...src.entries()].filter(([k])=>k.startsWith(q)&&k!==q).sort((a,b)=>b[1]-a[1]).slice(0,7);
  if(!acList.length){hideAC();return;}
  acFor=id;acIdx=0;
  if(!acEl){acEl=document.createElement("div");acEl.className="ac";acEl.setAttribute("role","listbox");document.body.appendChild(acEl);
    acEl.addEventListener("mousedown",ev=>{ev.preventDefault();const b=ev.target.closest("button");if(b){acIdx=+b.dataset.i;acAccept();}});}
  acEl.innerHTML=acList.map(([k,c],i)=>`<button type="button" role="option" data-i="${i}" aria-selected="${i===acIdx}">${escH(k)}<small>${c?c+"×":"ficha"}</small></button>`).join("");
  const r=nodeOf(id).getBoundingClientRect();
  acEl.style.top=Math.min(r.bottom+4,innerHeight-acEl.offsetHeight-8)+"px";
  const left=f.e.t==="character"?r.left:r.left;acEl.style.left=Math.max(16,Math.min(left,innerWidth-acEl.offsetWidth-16))+"px";
}
const acOpen=()=>!!(acEl&&acList.length&&acEl.isConnected&&!acEl.hidden);
function hideAC(){if(acEl){acEl.remove();acEl=null;}acList=[];acFor=null;}
function acKey(e){
  if(e.key==="Escape"){e.preventDefault();hideAC();return true;}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();acIdx=(acIdx+(e.key==="ArrowDown"?1:-1)+acList.length)%acList.length;[...acEl.children].forEach((b,i)=>b.setAttribute("aria-selected",i===acIdx));return true;}
  if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();acAccept();return true;}
  return false;
}
function acAccept(){const f=findEl(acFor);if(!f)return hideAC();const v=acList[acIdx][0];f.e.x=v;const n=nodeOf(f.e.id);n.textContent=v;hideAC();setCaret(n,"end");touch(false);}

/* ================================================================ colar texto corrido → elementos */
function parseText(txt){
  let L=txt.replace(/\r/g,"").split("\n").map(s=>s.replace(/\s+$/,""));parseText.meta=null;
  if(/^(Title|Credit|Author|Episode|Draft date|Notes|Contact)\s*:/i.test(L[0]||"")){const meta={};let k=0;while(k<L.length&&L[k].trim()){const m=/^([^:]+):\s*(.*)$/.exec(L[k]);if(m)meta[m[1].toLowerCase().trim()]=m[2];k++;}L=L.slice(k);parseText.meta=meta;}
  const out=[];let prev=null;
  let pq=false;const E2=(t,x)=>{const e={id:uid(),t,x};if(pq){e.quebra=true;pq=false;}out.push(e);prev=e;return e;};
  const caps=s=>/\p{Lu}/u.test(s)&&!/\p{Ll}/u.test(s.replace(/\(.*?\)/g,""))&&s.length<=48&&!/[.!?…:]$/.test(s.replace(/\(.*?\)$/,"").trim());
  for(let k=0;k<L.length;k++){
    let s=L[k].trim();if(!s){prev=null;continue;}let m;
    if(/^={3,}$/.test(s)){pq=true;prev=null;continue;}
    if((m=/^>\s*(.+?)\s*<$/.exec(s))){E2("act",m[1].toUpperCase());continue;}
    if((m=/^>\s*(.+)$/.exec(s))){E2("trans",m[1].toUpperCase());continue;}
    if(/^(CORTA|CORTE|FUSÃO|FADE|CONGELA)[A-ZÀ-Ý .]*:$/.test(s)){E2("trans",s);continue;}
    if((m=/^\[\[(.*)\]\]$/.exec(s))){const inner=m[1].trim();if(TC.test("["+inner+"]"))E2("time","["+inner+"]");else E2("note",inner);continue;}
    if((m=/^CENA\s*\d+\s*[—–-]\s*(.+)$/i.exec(s))){E2("scene",m[1].replace(/\s*#[^#]+#\s*$/,""));continue;}
    if(/^(INT|EXT|INT\.\/EXT|EST|I\/E)[.\s\/]/i.test(s)&&!/\p{Ll}{3}/u.test(s.slice(0,6))&&(!prev||prev.t!=="character")){E2("scene",s.replace(/\s*#[^#]+#\s*$/,""));continue;}
    if((m=/^\.(?!\.)(.+)$/.exec(s))){E2("scene",m[1].replace(/\s*#[^#]+#\s*$/,""));continue;}
    if(TC.test(s)){E2("time",s);continue;}
    if(/^(TEASER|ATO [A-ZÇÊÔÃ]+|EPÍLOGO|AVISO AOS TELESPECTADORES)$/i.test(s)){E2("act",s.toUpperCase());continue;}
    if(/^(GRADE|NOTA DE PRODUÇÃO|NOTA|INSERT|CARTELA):/.test(s)){E2("note",s);continue;}
    if(/^\(.*\)$/.test(s)&&prev&&["character","dialogue","paren"].includes(prev.t)){E2("paren",s);continue;}
    if(prev&&(prev.t==="character"||prev.t==="paren")){E2("dialogue",s);continue;}
    if(prev&&prev.t==="dialogue"){prev.x+=" "+s;continue;}
    const nextLine=(L[k+1]||"").trim();
    if((m=/^@(.+)$/.exec(s))){const c2=E2("character",m[1].trim().replace(/\s*\^$/,"").replace(/\s*\(CONT\.?\)\s*$/i,""));if(/\^$/.test(m[1].trim()))c2.dual=true;continue;}
    if(caps(s)&&nextLine&&(!prev||prev.t!=="action")){const c2=E2("character",s.replace(/\s*\^$/,"").replace(/\s*\(CONT\.?\)\s*$/i,""));if(/\^$/.test(s))c2.dual=true;continue;}
    if(prev&&prev.t==="action"){prev.x+=" "+s;continue;}
    E2("action",s.replace(/^!/,""));
  }
  return out;
}

function lev1(a,b){if(a===b)return false;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;let i=0;while(i<la&&i<lb&&a[i]===b[i])i++;

  const lay=(sc===cur()&&S.lay&&S.lay.info.length===sc.els.length)?S.lay:paginate(sc);const scs=scenesOf(sc,lay.info).filter(x=>x.n);let pe=null,pn=null;

async function syncStore(db,whenReady,okText){

    sn.docs.forEach(d=>{const r=d.data();if(!r||!r.meta)return;r.id=d.id;rem.set(d.id,r.atualizado||0);const l=S.eps[d.id];if(!l||(r.atualizado||0)>=(l.atualizado||0)){S.eps[d.id]=r;changed=true;}});
    Object.values(S.eps).forEach(s=>{if(!rem.has(s.id)||(s.atualizado||0)>rem.get(s.id))S.dirty.add(s.id);});
    try{const cs=await db.collection("personagens").get();const remC=new Map();cs.docs.forEach(d=>{const r=d.data();if(!r||!r.nome)return;r.id=d.id;remC.set(d.id,r.atualizado||0);const l=S.chars[d.id];if(!l||(r.atualizado||0)>=(l.atualizado||0)){S.chars[d.id]=r;changed=true;}});
      Object.values(S.chars).forEach(c=>{if(!remC.has(c.id)||(c.atualizado||0)>remC.get(c.id))S.dirtyC.add(c.id);});}catch(e){}
    for(const [col,obj,dirty] of [["series",S.series,S.dirtyS],["modelos",S.modelos,S.dirtyM]]){try{const cs=await db.collection(col).get();const rem=new Map();cs.docs.forEach(d=>{const r=d.data();if(!r)return;r.id=d.id;rem.set(d.id,r.atualizado||0);const l=obj[d.id];if(!l||(r.atualizado||0)>=(l.atualizado||0)){obj[d.id]=r;changed=true;}});Object.values(obj).forEach(v=>{if(!rem.has(v.id)||(v.atualizado||0)>rem.get(v.id))dirty.add(v.id);});}catch(e){}}
    try{const ns=await db.collection("notas").get();ns.docs.forEach(d=>{const r=d.data();if(d.id==="sala"&&r&&((r.atualizado||0)>=((S.notas.sala||{}).atualizado||0)))S.notas.sala=r;});}catch(e){}

const ul=(label,letter)=>{const i=letter?label.toLowerCase().indexOf(letter.toLowerCase()):-1;return i<0?escH(label):escH(label.slice(0,i))+"<u>"+escH(label[i])+"</u>"+escH(label.slice(i+1));};

/* ---------- motor de menus (barra, Iniciar, submenus) ---------- */
let menuStack=[];let menuOwner=null;
function closeMenus(from,keepOwner){from=from||0;while(menuStack.length>from){menuStack.pop().remove();}if(!from&&!keepOwner){if(menuOwner)menuOwner.setAttribute("aria-expanded","false");menuOwner=null;}}
function itemsFromIds(ids){return ids.filter(id=>id==="-"||!(CMD[id].hide&&CMD[id].hide())).map(id=>id==="-"?"-":{id,label:CMD[id].label,icon:CMD[id].icon,key:CMD[id].key,check:CMD[id].check,disabled:CMD[id].needs&&!cur(),run:()=>runCmd(id)});}
function showMenu(items,x,y,level,opts){
  opts=opts||{};closeMenus(level,true);
  const m=document.createElement("div");m.className="menu"+(opts.start?" startmenu":"");m.setAttribute("role","menu");
  const body=items.map((it,i)=>{if(it==="-")return "<hr>";const chk=it.check&&it.check();
    return `<button type="button" class="mi${opts.big?" big":""}" role="menuitem" data-i="${i}"${it.disabled?" disabled":""}><span class="ic">${it.icon?icon(it.icon,opts.big?22:16):chk?"✓":""}</span><span>${it.html||escH(it.label)}</span><span class="k">${it.key||""}</span><span>${it.sub?"▸":""}</span></button>`;}).join("");
  m.innerHTML=opts.start?`<div class="sm-band"><b>Script</b>Room</div><div class="sm-items">${body}</div>`:body;
  document.body.appendChild(m);menuStack.push(m);
  const w=m.offsetWidth,h=m.offsetHeight;
  if(opts.up)y=y-h;
  m.style.left=Math.max(4,Math.min(x,innerWidth-w-4))+"px";m.style.top=Math.max(4,Math.min(y,innerHeight-h-4))+"px";
  const open=(btn)=>{const it=items[+btn.dataset.i];if(!it||it==="-"||it.disabled)return;
    if(it.sub){m.querySelectorAll(".mi.open").forEach(b=>b.classList.remove("open"));btn.classList.add("open");const r=btn.getBoundingClientRect();const sub=typeof it.sub==="function"?it.sub():it.sub;showMenu(sub,r.right-3,r.top-3,level+1,{});return;}
    closeMenus();it.run();};
  m.addEventListener("click",e=>{const b=e.target.closest(".mi");if(b)open(b);});
  m.addEventListener("mouseover",e=>{const b=e.target.closest(".mi");if(!b||b.disabled)return;const it=items[+b.dataset.i];
    if(it&&it.sub&&!b.classList.contains("open"))open(b);else if(it&&!it.sub){closeMenus(level+1);m.querySelectorAll(".mi.open").forEach(x=>x.classList.remove("open"));}});
  m.addEventListener("keydown",e=>{const bs=[...m.querySelectorAll(".mi:not(:disabled)")];const i=bs.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(bs[i+1]||bs[0]).focus();}
    else if(e.key==="ArrowUp"){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus();}
    else if(e.key==="ArrowRight"){const it=items[+(document.activeElement.dataset||{}).i];if(it&&it.sub){e.preventDefault();open(document.activeElement);setTimeout(()=>{const s=menuStack[level+1];s&&s.querySelector(".mi:not(:disabled)").focus();});}else if(!opts.start&&menuOwner&&menuOwner.parentElement.id==="menubar"){e.preventDefault();shiftBar(1);}}
    else if(e.key==="ArrowLeft"){if(level>0){e.preventDefault();closeMenus(level);const p=menuStack[level-1];p&&p.querySelector(".mi.open")&&p.querySelector(".mi.open").focus();}else if(menuOwner&&menuOwner.parentElement.id==="menubar"){e.preventDefault();shiftBar(-1);}}
    else if(e.key==="Escape"){e.preventDefault();const o=menuOwner;closeMenus(level?level:0);if(!level&&o)o.focus();}
    else if(e.key.length===1){const u=[...m.querySelectorAll(".mi:not(:disabled)")].find(b=>{const x=b.querySelector("u");return x&&x.textContent.toLowerCase()===e.key.toLowerCase();});if(u){e.preventDefault();open(u);}}});
  if(opts.focus!==false)setTimeout(()=>{const f=m.querySelector(".mi:not(:disabled)");if(f)f.focus();},0);
  return m;
}
function openBarMenu(i,focus){
  const bar=document.getElementById("menubar");const btn=bar.children[i];if(!btn)return;
  closeMenus();menuOwner=btn;btn.setAttribute("aria-expanded","true");const [,,ids]=MENUS[i];const r=btn.getBoundingClientRect();
  showMenu(itemsFromIds(ids),r.left,r.bottom,0,{focus});
}
function shiftBar(d){const bar=document.getElementById("menubar");const i=[...bar.children].indexOf(menuOwner);openBarMenu((i+d+MENUS.length)%MENUS.length,true);}
function buildMenubar(){
  const bar=document.getElementById("menubar");
  bar.innerHTML=MENUS.map(([l,k],i)=>`<button type="button" aria-haspopup="menu" aria-expanded="false" data-mb="${i}">${ul(l,k)}</button>`).join("");
  bar.addEventListener("click",e=>{const b=e.target.closest("[data-mb]");if(!b)return;if(menuOwner===b){closeMenus();return;}openBarMenu(+b.dataset.mb,true);});
  bar.addEventListener("mouseover",e=>{const b=e.target.closest("[data-mb]");if(b&&menuOwner&&menuOwner!==b&&menuOwner.parentElement===bar)openBarMenu(+b.dataset.mb,false);});
}
document.addEventListener("mousedown",e=>{if(!menuStack.length)return;if(e.target.closest(".menu")||e.target.closest("#menubar")||e.target.closest("#startBtn"))return;closeMenus();});
document.getElementById("startBtn").addEventListener("click",e=>{
  const b=e.currentTarget;if(menuOwner===b){closeMenus();return;}
  closeMenus();menuOwner=b;b.setAttribute("aria-expanded","true");const r=b.getBoundingClientRect();
  showMenu(startItems(),r.left,r.top-2,0,{start:true,big:true,up:true});
});

function dialog(o){

  document.body.appendChild(w);paintIcons(w);

    const tm=document.getElementById("taskMain");if(tm)tm.after(tk);w._task=tk;
    tk.onclick=()=>{if(w.hidden){w.hidden=false;w.style.zIndex=++winZ;tk.setAttribute("aria-pressed","true");}else if(+w.style.zIndex<winZ){w.style.zIndex=++winZ;}else{w.hidden=true;tk.setAttribute("aria-pressed","false");}};
    w.addEventListener("pointerdown",()=>{w.style.zIndex=++winZ;});}
  const close=()=>{w.remove();if(w._task)w._task.remove();if(scrim)scrim.remove();if(o.onClose)o.onClose();if(o.restore&&o.restore.isConnected)o.restore.focus();};w._close=close;
  const place=()=>{const r=w.getBoundingClientRect();w.style.left=Math.max(6,(innerWidth-r.width)/2)+"px";w.style.top=Math.max(6,Math.min((innerHeight-r.height)/2-20,innerHeight-r.height-40))+"px";
    if(o.modal===false){const n=document.querySelectorAll(".win:not([aria-modal])").length-1;if(n>0){const k=n%8;w.style.left=Math.max(6,Math.min(80+k*28,innerWidth-r.width-6))+"px";w.style.top=Math.max(6,Math.min(70+k*28,innerHeight-r.height-40))+"px";}}};place();
  w.addEventListener("click",async e=>{const x=e.target.closest("[data-w]");if(x&&x.dataset.w==="x"){close();return;}if(x&&x.dataset.w==="min"){w.hidden=true;if(w._task)w._task.setAttribute("aria-pressed","false");return;}
    const b=e.target.closest("[data-b]");if(b){const bt=o.buttons[+b.dataset.b];const r=bt.run?await bt.run(w,close):undefined;if(r!==false)close();}});
  w.addEventListener("keydown",e=>{if(e.key==="Escape"){e.stopPropagation();close();}
    if(e.key==="Enter"&&!e.target.matches("textarea,button,select")&&o.buttons){const d=o.buttons.findIndex(b=>b.def);if(d>=0){e.preventDefault();w.querySelector(`[data-b="${d}"]`).click();}}});
  const tb=w.querySelector(".titlebar");
  tb.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;const r=w.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;tb.setPointerCapture(e.pointerId);w.style.zIndex=++winZ;
    const mv=ev=>{w.style.left=Math.max(-r.width+60,Math.min(ev.clientX-sx,innerWidth-60))+"px";w.style.top=Math.max(0,Math.min(ev.clientY-sy,innerHeight-30))+"px";};
    const up=()=>{tb.removeEventListener("pointermove",mv);tb.removeEventListener("pointerup",up);};tb.addEventListener("pointermove",mv);tb.addEventListener("pointerup",up);});
  if(o.onOpen)o.onOpen(w,close);
  setTimeout(()=>{const f=w.querySelector("[autofocus]")||w.querySelector("input,select,textarea")||w.querySelector(".btn.def")||w.querySelector(".btn");if(f)f.focus();},0);
  return {el:w,close};
}

function locParse(h){h=String(h||"").toUpperCase().trim();let ie="";const m=/^(INT\.\/EXT\.|EXT\.\/INT\.|INT\.|EXT\.)\s*/.exec(h);if(m){ie=m[1].replace(/\.$/,"").replace(/\./g,"");h=h.slice(m[0].length);}
  const parts=h.split(/\s+[—–-]\s+/);const tod=parts.length>1?parts.pop():"";return {ie:ie||"?",loc:parts.join(" — ")||"(sem local)",tod:tod||"(sem período)"};}
function reportRows(kind,all){
  const eps=all?seriesEps(curSid()):[cur()];
  if(kind==="cenas"){const sc=cur();const lay=paginate(sc);return {cols:["Nº","Cabeçalho","Minutagem","Duração","Páginas","Personagens"],num:[0,3,4],rows:scenesOf(sc,lay.info).filter(x=>x.n).map(x=>[x.label||x.n,x.h,x.tc?x.tcRaw.replace(/[\[\]]/g,""):"—",x.tc?mmss(x.tc.b-x.tc.a):"—",(x.lines/LPP).toFixed(1).replace(".",","),[...x.chars].join(", ")])};}
  if(kind==="cenarios"||kind==="periodos"){const m=new Map();let totalLines=0;
    for(const sc of eps){const lay=paginate(sc);for(const x of scenesOf(sc,lay.info).filter(x=>x.n)){const p=locParse(x.h);totalLines+=x.lines;const key=kind==="cenarios"?p.loc:p.tod;
      let r=m.get(key);if(!r)m.set(key,r={key,ie:new Set(),cenas:[],lines:0,tods:new Map()});r.ie.add(p.ie);r.cenas.push(all?`${sc.meta.episodio}/${x.n}`:String(x.n));r.lines+=x.lines;r.tods.set(p.tod,(r.tods.get(p.tod)||0)+1);}}
    const list=[...m.values()].sort((a,b)=>b.lines-a.lines);

function clack(kind){if(!prefs.som)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  const noise=(dur,freq,q,vol)=>{const len=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);};
  if(kind==="key")noise(0.035,2400+Math.random()*900,1.2,0.5);
  else if(kind==="soft")noise(0.025,1500,1,0.25);
  else if(kind==="enter"){noise(0.22,500,0.7,0.35);}
  else if(kind==="ding"){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1760;o.type="sine";g.gain.setValueAtTime(0.25,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.9);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.9);}

    if(e.target.dataset.cy!==undefined){const y=+e.target.value;if(y>1800&&y<2200){st.y=y;st.focus=isoOf(new Date(Date.UTC(st.y,st.m,1)));draw(false);c.querySelector("[data-cy]").focus();}}});

/* índice da temporada: falas, cenas, contracenas */
function castIndex(){
  const key=curSid()+"#"+seriesEps(curSid()).map(s=>s.id+":"+s.atualizado+":"+s.els.length).join("|")+"#"+Object.values(S.chars).map(c=>c.id+[c.nome,...(c.aliases||[])].join(",")).join(";");
  if(castIndex.k===key)return castIndex.v;
  const alias=new Map();for(const c of seriesChars())[c.nome,...(c.aliases||[])].filter(Boolean).forEach(n=>alias.set(baseName(n),c.id));
  const keyOf=n=>alias.get(baseName(n))||("@"+baseName(n));
  const st=new Map(),co=new Map(),eps=seriesEps(curSid());
  for(const sc of eps){let sn=0,heading="",who=null,inScene=new Set();
    const close=()=>{const a=[...inScene].sort();for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const k=a[i]+"|"+a[j];co.set(k,(co.get(k)||0)+1);}inScene=new Set();};
    for(const e of sc.els){
      if(e.t==="scene"){close();sn++;heading=e.x;who=null;continue;}
      if(e.t==="character"&&e.x.trim()){who=baseName(e.x);const k=keyOf(who);inScene.add(k);let s=st.get(k);
        if(!s)st.set(k,s={key:k,names:new Map(),falas:0,palavras:0,cenas:new Set(),eps:new Map(),first:null,last:null,locs:new Map(),longest:null});
        s.names.set(who,(s.names.get(who)||0)+1);s.falas++;s.eps.set(+sc.meta.episodio,(s.eps.get(+sc.meta.episodio)||0)+1);
        const sk=sc.id+":"+sn;if(!s.cenas.has(sk)){s.cenas.add(sk);const loc=locParse(heading).loc;s.locs.set(loc,(s.locs.get(loc)||0)+1);}
        const ref={ep:sc.id,epn:+sc.meta.episodio,n:sn,id:e.id};if(!s.first)s.first=ref;s.last=ref;}
      else if(e.t==="dialogue"&&who){const s=st.get(keyOf(who));if(s){const w=(e.x.match(/[\p{L}\p{N}]+/gu)||[]).length;s.palavras+=w;if(!s.longest||w>s.longest.w)s.longest={w,x:e.x,id:e.id,ep:sc.id,epn:+sc.meta.episodio};}}
      else if(e.t!=="paren")who=null;}
    close();}
  castIndex.k=key;castIndex.v={st,co,keyOf,eps};return castIndex.v;
}

    ${s.longest?`<div class="lbl">Fala mais longa (${s.longest.w} palavras, ${epName(s.longest.epn)})</div><div class="quote">“${escH(s.longest.x)}”</div>`:""}

      <div class="row"><button type="button" class="btn sm" data-ca="addrel"${others.length?"":" disabled"}>Adicionar relação</button>${others.length?"":`<span class="muted">Crie outras fichas para ligar personagens.</span>`}</div>
