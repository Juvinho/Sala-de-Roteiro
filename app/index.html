function castMapHTML(ix){
  let nodes=seriesChars().map(c=>({key:c.id,name:c.nome,cor:c.cor||"#3050D0",f:(ix.st.get(c.id)||{falas:0}).falas}));
  if(nodes.length<3)nodes=[...ix.st.values()].sort((a,b)=>b.falas-a.falas).slice(0,14).map(s=>({key:s.key,name:labelOf(s.key)==="@"?topName(s):(S.chars[s.key]?S.chars[s.key].nome:topName(s)),cor:S.chars[s.key]?S.chars[s.key].cor:"#808080",f:s.falas}));
  nodes.sort((a,b)=>b.f-a.f);nodes=nodes.slice(0,18);
  if(!nodes.length)return `<div class="empty">Sem personagens para desenhar ainda.</div>`;
  const W=720,H=620,cx=W/2,cy=H/2,R=Math.min(W,H)/2-95,N=nodes.length;
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/N;n.a=a;n.x=cx+R*Math.cos(a);n.y=cy+R*Math.sin(a);n.r=Math.max(7,Math.min(24,5+Math.sqrt(n.f)*1.1));});
  const idx=new Map(nodes.map(n=>[n.key,n]));let maxW=1;const edges=[];
  for(const [k,w] of ix.co){const [a,b]=k.split("|");if(idx.has(a)&&idx.has(b)&&w>=2){edges.push([idx.get(a),idx.get(b),w]);maxW=Math.max(maxW,w);}}
  const rels=[];for(const c of seriesChars())for(const r of c.relacoes||[])if(idx.has(c.id)&&idx.has(r.alvo))rels.push([idx.get(c.id),idx.get(r.alvo),r.tipo||""]);
  const ln=(a,b,attr)=>`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" ${attr}/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto;color:var(--text)" role="img" aria-label="Mapa de relações entre personagens">
    ${edges.map(([a,b,w])=>ln(a,b,`stroke="#808080" stroke-opacity="${(0.25+0.6*w/maxW).toFixed(2)}" stroke-width="${(0.6+4.4*w/maxW).toFixed(2)}"`)).join("")}
    ${rels.map(([a,b])=>ln(a,b,`stroke="#C00000" stroke-width="2.4" stroke-dasharray="6 3"`)).join("")}
    ${nodes.map(n=>{const ca=Math.cos(n.a),sa=Math.sin(n.a);const tx=n.x+ca*(n.r+8),ty=n.y+sa*(n.r+8)+4;const anchor=Math.abs(ca)<0.3?"middle":(ca>0?"start":"end");
      return `<g class="node" data-node="${escH(n.key)}" tabindex="0" role="button" aria-label="${escH(n.name)}, ${n.f} falas"><circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r.toFixed(1)}" fill="${n.cor}" stroke="currentColor" stroke-width="1.2"/><text x="${tx.toFixed(1)}" y="${(Math.abs(ca)<0.3?ty+(sa>0?8:-4):ty).toFixed(1)}" text-anchor="${anchor}" fill="currentColor">${escH(n.name)}</text></g>`;}).join("")}
    ${rels.map(([a,b,t])=>{if(!t)return "";const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;let dx=mx-cx,dy=my-cy;const L=Math.hypot(dx,dy)||1;const near=L>R*0.8;const off=near?30:0;const x=mx+dx/L*off,y=my+dy/L*off+4;return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" fill="#C00000" stroke="var(--field)" stroke-width="4" paint-order="stroke" font-weight="700">${escH(t)}</text>`;}).join("")}</svg>`;
  return `<div class="col"><div class="mapbox">${svg}</div><p class="muted" style="margin:0">Linha cinza: contracenam (mais grossa = mais cenas juntos, a partir de 2). Linha vermelha tracejada: relação anotada na ficha. O tamanho do círculo segue o número de falas. Clique num nome para abrir a ficha.</p></div>`;
}
function castHeatHTML(ix){
  const epsN=ix.eps.map(e=>+e.meta.episodio);const lastEp=Math.max(...epsN);
  const rows=[...ix.st.values()].filter(s=>s.falas>=3||S.chars[s.key]).sort((a,b)=>b.falas-a.falas).slice(0,60);
  const max=Math.max(1,...rows.flatMap(s=>[...s.eps.values()]));
  if(!rows.length)return `<div class="empty">Importe ou escreva roteiros para ver a presença do elenco.</div>`;

  return m;
}
function elsFromFormat(key,se){
  const f=FORMATOS[key]||FORMATOS.drama;const out=[];const total=(se&&se.dur||f.dur)*60;
  f.atos.forEach(([ato,n,guia],ai)=>{out.push(E("act",ato));if(guia)out.push(E("note",guia));
    for(let k=0;k<n;k++){
      if(f.radio){out.push(E("scene",""),E("time",null),E("note","SOM: "),E("character","LOCUTOR"),E("dialogue",""));continue;}
      out.push(E("scene",ai===0&&k===0&&f.cena?f.cena:""),E("time",null));
      if(f.host&&(ai===0||ai===f.atos.length-1)&&k===0){out.push(E("action","O apresentador, num cenário escuro, encara a câmera."),E("character","APRESENTADOR"),E("dialogue",ai===0?"Boa noite.":"Boa noite… e durma bem, se conseguir."));}
      else out.push(E("action",""));}});
  (f.fim||[]).forEach(([t,x])=>out.push(E(t,x)));
  const times=out.filter(e=>e.t==="time");const per=times.length?Math.max(30,Math.round(total/times.length/30)*30):60;let t=0;
  times.forEach((e,k)=>{const end=k===times.length-1?Math.max(t+30,total):t+per;e.x=`[${mmss(t)}–${mmss(end)}]`;t=end;});
  return out;
}

function prazo(iso){const n=daysTo(iso);if(n==null)return "";if(n<0)return `atrasado ${-n} dia${n===-1?"":"s"}`;if(n===0)return "entrega hoje";return `entrega em ${n} dia${n===1?"":"s"}`;}

/* ---------- comparar versões ---------- */
function diffEls(a,b){
  let s=0;while(s<a.length&&s<b.length&&a[s]===b[s])s++;let ea=a.length,eb=b.length;while(ea>s&&eb>s&&a[ea-1]===b[eb-1]){ea--;eb--;}
  const A=a.slice(s,ea),B=b.slice(s,eb),n=A.length,m=B.length;if(n*m>12e6)return null;
  const W=m+1,dp=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=A[i]===B[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  const ops=[];let i=0,j=0;while(i<n&&j<m){if(A[i]===B[j]){ops.push(["=",s+i,s+j]);i++;j++;}else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ops.push(["-",s+i]);i++;}else{ops.push(["+",s+j]);j++;}}
  while(i<n)ops.push(["-",s+(i++)]);while(j<m)ops.push(["+",s+(j++)]);return ops;
}
function compareVersion(v){
  const oldEls=v.snapshot.els,newEls=cur().els;const key=e=>e.t+"|"+e.x;
  const ops=diffEls(oldEls.map(key),newEls.map(key));
  if(!ops){msgBox({title:"Comparar versões",icon:"warn",text:"As duas versões são diferentes demais para comparar elemento por elemento."});return;}
  const sceneNo=els=>{const out=[];let n=0;for(const e of els){if(e.t==="scene")n++;out.push(n);}return out;};const so=sceneNo(oldEls),sn=sceneNo(newEls);
  let add=0,del=0,lastScene=-1,html="";const who=(els,i)=>{for(let k=i;k>=0;k--){if(els[k].t==="character")return baseName(els[k].x);if(!["dialogue","paren"].includes(els[k].t))break;}return "";};
  let shown=0;
  for(const op of ops){if(op[0]==="=")continue;const isAdd=op[0]==="+";const els=isAdd?newEls:oldEls;const i=op[1];const e=els[i];const scn=(isAdd?sn:so)[i];
    if(isAdd)add++;else del++;if(shown>=400)continue;shown++;
    if(scn!==lastScene){html+=`<div class="ctx">${scn?`Cena ${scn}`:"Antes da primeira cena"}</div>`;lastScene=scn;}
    const w=e.t==="dialogue"?who(els,i):"";html+=`<div class="d ${isAdd?"add":"del"}"><small>${isAdd?"+":"−"} ${TYPES[e.t]?TYPES[e.t].label:e.t}${w?` (${escH(w)})`:""}</small>${escH(e.x||"(vazio)")}</div>`;}
  const dt=new Date(v.at).toLocaleString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
  dialog({title:`Comparar: “${v.label}” × roteiro atual`,width:760,body:`<div class="row"><span class="chip95" style="color:#063"><b>+${add}</b> no roteiro atual</span><span class="chip95" style="color:#700"><b>−${del}</b> só na versão de ${escH(dt)}</span><span class="muted">${ops.length-add-del} elementos iguais</span></div>
    <div class="listview diff" style="max-height:58vh">${html||`<div class="ctx">Nenhuma diferença. A versão é igual ao roteiro atual.</div>`}${shown<add+del?`<div class="ctx">Mostrando ${shown} de ${add+del} diferenças.</div>`:""}</div>`,
    buttons:[{label:"Restaurar esta versão…",run:()=>{setTimeout(()=>{const b=document.querySelector(`[data-ver="restore"][data-vid="${v.id}"]`);if(b){b.click();toast("Clique em Confirmar restauração no painel Versões");}},0);}},{label:"Fechar",def:1}]});
}

function evalTime(src){
  const s=String(src||"").replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/").replace(/\s+/g,"");if(!s)return null;
  let i=0;const toks=[];

    if(m){const t=m[1];let v,time=false;if(t.includes(":")){const p=t.split(":").map(x=>+x.replace(",","."));v=p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];time=true;}else v=+t.replace(",",".");toks.push({n:v,time});i+=t.length;continue;}
    if("+-*/()".includes(s[i])){toks.push({op:s[i]});i++;continue;}return null;}
  let k=0;const peek=()=>toks[k],next=()=>toks[k++];
  const prim=()=>{const t=next();if(!t)throw 0;if(t.op==="("){const v=expr();if(!next()||toks[k-1].op!==")")throw 0;return v;}if(t.op==="-"){const v=prim();return {n:-v.n,time:v.time};}if(t.op)throw 0;return t;};
  const term=()=>{let a=prim();while(peek()&&(peek().op==="*"||peek().op==="/")){const op=next().op,b=prim();
    if(op==="*"){if(a.time&&b.time)throw 0;a={n:a.n*b.n,time:a.time||b.time};}else{if(!b.n)throw 0;a=a.time&&b.time?{n:a.n/b.n,time:false}:{n:a.n/b.n,time:a.time};}}return a;};
  const expr=()=>{let a=term();while(peek()&&(peek().op==="+"||peek().op==="-")){const op=next().op,b=term();const anyT=a.time||b.time;
    const A=anyT&&!a.time?a.n*60:a.n,B=anyT&&!b.time?b.n*60:b.n;a={n:op==="+"?A+B:A-B,time:anyT};}return a;};
  try{const v=expr();if(k<toks.length)return null;if(!v.time)return String(Math.round(v.n*100)/100).replace(".",",");
    const neg=v.n<0,t=Math.round(Math.abs(v.n));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return (neg?"−":"")+(h?`${h}:${pad2(m)}:${pad2(sec)}`:`${m}:${pad2(sec)}`);}catch(e){return null;}
}

/* ---------- PDF próprio (Courier é fonte padrão do PDF, não precisa embutir) ---------- */
const WIN={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function pdfStr(str){let s="(";for(const ch of String(str)){let c=ch.codePointAt(0);if(!(c<0x80||(c>=0xA0&&c<=0xFF)))c=WIN[c]||0x3F;
  if(c===0x28||c===0x29||c===0x5C)s+="\\"+String.fromCharCode(c);else if(c<0x20||c>0x7E)s+="\\"+c.toString(8).padStart(3,"0");else s+=String.fromCharCode(c);}return s+")";}
function wrapLines(s,w){
  const out=[];for(const para of String(s||"").split("\n")){let line="";const words=para.split(/\s+/).filter(Boolean);
    if(!words.length){out.push("");continue;}
    for(const word of words){let wd=word;
      if(!line){while(wd.length>w){out.push(wd.slice(0,w));wd=wd.slice(w);}line=wd;}
      else if(line.length+1+wd.length<=w)line+=" "+wd;
      else{out.push(line);line="";while(wd.length>w){out.push(wd.slice(0,w));wd=wd.slice(w);}line=wd;}}
    out.push(line);}
  return out.length?out:[""];
}

function npFind(t,o){
  const q=o.q||"";if(!q)return {ok:false};const hay=o.cs?t.value:t.value.toLowerCase(),nd=o.cs?q:q.toLowerCase();
  if(o.acao==="all"){let n=0;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),o.cs?"g":"gi");const v=t.value.replace(re,()=>{n++;return o.rep||"";});if(n){t.value=v;t.dispatchEvent(new Event("input"));}return {ok:n>0,count:n};}
  if(o.acao==="replace"){const sel=t.value.slice(t.selectionStart,t.selectionEnd);if((o.cs?sel:sel.toLowerCase())===nd&&sel){t.setRangeText(o.rep||"",t.selectionStart,t.selectionEnd,"end");t.dispatchEvent(new Event("input"));}}
  let i=o.dir==="up"?(t.selectionStart>0?hay.lastIndexOf(nd,t.selectionStart-1):-1):hay.indexOf(nd,t.selectionEnd);let volta=false;
  if(i<0){i=o.dir==="up"?hay.lastIndexOf(nd):hay.indexOf(nd);volta=i>=0;}
  if(i<0)return {ok:false};t.focus();t.setSelectionRange(i,i+q.length);
  const before=t.value.slice(0,i).split("\n").length;t.scrollTop=Math.max(0,(before-4)*18);return {ok:true,volta};
}

  <div class="row"><label class="chk"><input type="checkbox" id="lf-cs"${o.cs?" checked":""}> Diferenciar maiúsculas</label><fieldset style="padding:8px 8px 4px;margin-left:auto"><legend>Direção</legend><label class="chk"><input type="radio" name="lf-d" value="up"> Acima</label> <label class="chk"><input type="radio" name="lf-d" value="down" checked> Abaixo</label></fieldset></div>

function layout(sc){
  const G=geomOf(sc);const els=sc.els,info=[];let n=0;const locked=!!sc.meta.cenasTravadas;let base="0",suf=0,lastWho=null,between=false;

    if(e.t==="scene"){n++;if(locked){if(e.num){base=String(e.num);suf=0;label=base;}else{suf++;label=base+String.fromCharCode(64+Math.min(26,suf));}}else label=String(n);

  const g=geomOf(sc),p=g.p,PT=72/25.4,pw=g.paper.w*PT,ph=g.paper.h*PT,ml=p.ml*PT,mt=p.mt*PT,mr=p.mr*PT;const m=sc.meta;
  const font={r:"F1",b:"F2",i:"F3",bi:"F4"};const pages=[];let pg=null;
  const txt=(x,y,size,f,gray,str)=>{pg.ops.push(`BT /${font[f]} ${size} Tf ${gray?"0.4 g":"0 g"} 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm ${pdfStr(str)} Tj ET`);};
  const water=()=>{if(!o.marca)return;const size=Math.max(18,Math.min(54,Math.floor(pw*1.25/Math.max(8,o.marca.length)/0.6)));const w=o.marca.length*size*0.6;const c=0.7071;

    center(String(m.serie).toUpperCase(),22,"b",0,18);center(epCode(m),14,"r",0,12);center(`“${m.titulo}”`,14,"b",0,4);y-=10*1.17+48;
    center(`${m.temporada}ª temporada · ${m.unidade||"episódio"} ${m.episodio} · ${m.duracao}`,11,"r",0,4);center(estreiaLine(m),11,"r",0,48);(m.notas||[]).forEach(n=>center(n,10,"i",1,4));
    if(sets.size&&o.rev){const s=[...sets.values()].pop();center(`${s.nome} · ${new Date(s.data).toLocaleDateString("pt-BR")}`,10,"b",1,0);}}
  const lay=paginate(sc),info=lay.info,LP=g.lpp;let row=0,pageNo=1,sIdx=0;
  const nextPage=()=>{pageNo++;newPage(false);pg.no=pageNo;pg.fi=curI;row=0;};let curI=0;
  nextPage();
  const styleOf=e=>{switch(e.t){case"act":return {f:"b",size:12,x:0,center:1};case"scene":return {f:"b",size:12,x:0};case"time":return {f:"i",size:10,x:0,gray:1};case"note":return {f:"i",size:11,x:0,gray:1};
    case"trans":return {f:"r",size:12,x:0,right:1};case"character":return {f:"r",size:12,x:p.ic};case"paren":return {f:"r",size:12,x:p.ipl};case"dialogue":return {f:"r",size:12,x:p.idl};default:return {f:"r",size:12,x:0};}};
  const draw=(e,line,isFirst,st)=>{const base=ph-mt-(row+1)*12+2.6;let x=ml+st.x*PT;const cw=st.size*0.6;
    if(st.center)x=ml+(g.tw*PT-line.length*cw)/2;if(st.right)x=ml+g.tw*PT-line.length*cw;
    if(e.t==="note"&&isFirst){const mm=/^([^:]{2,40}:)/.exec(line);if(mm){txt(x,base,st.size,"bi",1,mm[1]);txt(x+mm[1].length*cw,base,st.size,"i",1,line.slice(mm[1].length));return base;}}
    txt(x,base,st.size,st.f,st.gray,line);return base;};
  const half=halfW(g),pairs=new Map(dualPairs(sc).map(q=>[q.L[0],q]));const yAt=()=>ph-mt-(row+1)*12+2.6;
  const star=(y,rv)=>{if(rv){txt(pw-mr*0.55,y,12,"b",0,"*");pg.revs.add(rv);}};
  for(let i=0;i<sc.els.length;i++){const e=sc.els[i],f=info[i];curI=i;if(e.t==="scene")sIdx++;
    if(e.quebra&&row>0)nextPage();
    if(f.keepNext&&row>0){let h=f.before+f.lines+f.after,j=i+1;while(j<sc.els.length&&info[j].keepNext&&h<=LP){h+=info[j].before+info[j].lines+info[j].after;j++;}
      if(j<sc.els.length)h+=info[j].before+tailH(sc.els[j],info[j]);if(h<=LP&&row+h>LP)nextPage();}
    else if(f.keepLines&&!f.split&&row>0&&row+f.before+f.lines>LP&&f.lines<=LP)nextPage();
    if(row>0)row+=f.before;
    const pr=pairs.get(i);
    if(pr){const colW=g.tw/2-2;
      const side=(a,b,base)=>{const out=[];for(let k=a;k<b;k++){const ek=sc.els[k],fk=info[k];let t=ek.x,x=base,w=half.dialogue;
          if(ek.t==="character"){t=t.toUpperCase()+(fk.cont?" (CONT.)":"");x=base+colW*0.25;w=half.character;}else if(ek.t==="paren"){x=base+colW*0.05;w=half.paren;}
          const rv=o.rev&&ek.rev&&sets.has(ek.rev)?ek.rev:null;for(const ln of wrapLines(t,w))out.push({ln,x,rv});}return out;};
      const A=side(pr.L[0],pr.L[1],0),B=side(pr.R[0],pr.R[1],g.tw/2+2);const n=Math.max(A.length,B.length);
      if(row>0&&row+n>LP)nextPage();

      if(row>=LP)nextPage();const y=draw(e,ln,k===0,st);pg.scenes.add(sIdx);star(y,rv);
      if(k===0&&e.t==="scene"&&o.numMargens){const lab=String(f.label||f.num);txt(ml-(lab.length+2)*7.2,y,12,"b",0,lab);txt(pw-mr+10,y,12,"b",0,lab);}

    row+=f.after;if(row>=LP&&i<sc.els.length-1)nextPage();
  }
  const hp=headParts(sc);
  for(const q of pages){if(q.title)continue;pg=q;let s=hp[0]+q.no+hp[1];const rv=[...q.revs].map(id=>sets.get(id)).filter(Boolean);
    if(rv.length){const last=rv.sort((a,b)=>a.data-b.data).pop();s=`(${revCor(last.cor)[1].toUpperCase()} ${new Date(last.data).toLocaleDateString("pt-BR")})  `+s;}
    txt(pw-mr-s.length*9*0.6,ph-35.4-9,9,"r",1,s);}
  // intervalo de cenas: mantém a numeração original das páginas, como nos programas profissionais
  let out=pages;
  if(o.de||o.ate){const labels=[];sc.els.forEach((e,i)=>{if(e.t==="scene")labels.push(info[i].label);});
    const pos=v=>{v=String(v||"").trim().toUpperCase();if(!v)return null;let k=labels.indexOf(v);if(k<0&&/^\d+$/.test(v))k=+v-1;return k<0?null:k+1;};
    const a=pos(o.de)||1,b=pos(o.ate)||labels.length;out=pages.filter(q=>q.title?o.titulo:[...q.scenes].some(s=>s>=Math.min(a,b)&&s<=Math.max(a,b)));}
  const enc=new TextEncoder();const objs=[];const add=s=>{objs.push(s);return objs.length;};
  const catalog=add(null),pagesObj=add(null);
  const fonts=["Courier","Courier-Bold","Courier-Oblique","Courier-BoldOblique"].map(n=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${n} /Encoding /WinAnsiEncoding >>`));
  const res=`<< /Font << /F1 ${fonts[0]} 0 R /F2 ${fonts[1]} 0 R /F3 ${fonts[2]} 0 R /F4 ${fonts[3]} 0 R >> >>`;const kids=[];
  for(const q of out){const stream=q.ops.join("\n");let data=enc.encode(stream),filter="";
    if(typeof CompressionStream!=="undefined"){try{data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());filter=" /Filter /FlateDecode";}catch(x){data=enc.encode(stream);filter="";}}
    const c=add({head:`<< /Length ${data.length}${filter} >>\nstream\n`,data,tail:"\nendstream"});
    kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Resources ${res} /Contents ${c} 0 R >>`));}
  objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;objs[pagesObj-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
  const u16=str=>"<FEFF"+[...String(str)].map(ch=>{const c=ch.codePointAt(0);if(c>0xFFFF){const v=c-0x10000;return ((0xD800+(v>>10)).toString(16)+(0xDC00+(v&1023)).toString(16)).toUpperCase();}return c.toString(16).padStart(4,"0").toUpperCase();}).join("")+">";

  const parts=[enc.encode("%PDF-1.4\n%âãÏÓ\n")];let off=parts[0].length;const offs=[];

}

/* ---------- mensagem do atualizador em português claro ---------- */
function friendlyUpd(msg){
  const s=String(msg||"");const repo=(s.match(/github\.com\/([^/\s"]+\/[^/\s"')]+)/)||[])[1];
  if(/406|Unable to find latest version|production release/i.test(s))return `Ainda não há nenhuma versão publicada${repo?` em ${repo.replace(/\/releases.*$/,"")}`:""}. Crie uma tag (por exemplo v4.4.0) e espere o GitHub Actions terminar.`;
  if(/latest\.yml/i.test(s))return "A versão publicada não tem o arquivo latest.yml. Publique pela tag, pelo GitHub Actions, em vez de enviar o instalador à mão.";
  if(/404|Not Found/i.test(s))return `Não encontrei o repositório${repo?` ${repo}`:""}. Confira se o nome está certo e se ele é público.`;
  if(/ENOTFOUND|ETIMEDOUT|ECONN|EAI_AGAIN|net::|network|socket|30 segundos/i.test(s))return "Sem conexão com a internet, ou um firewall bloqueou o programa.";
  if(/rate limit|403/i.test(s))return "O GitHub limitou as consultas por enquanto. Tente de novo daqui a uma hora.";
  if(/sha512|checksum|integrity/i.test(s))return "O arquivo baixado veio corrompido. Tente de novo.";
  return "Confira a internet e se o repositório do GitHub está configurado (veja o LEIA-ME).";
}

function speechStart(els,i){let k=i;while(k>=0&&["dialogue","paren"].includes(els[k].t))k--;return k>=0&&els[k].t==="character"?k:-1;}
function speechEnd(els,i){let k=i+1;while(k<els.length&&["dialogue","paren"].includes(els[k].t))k++;return k;}
function dualPairs(sc){const els=sc.els,out=[];for(let i=1;i<els.length;i++){const e=els[i];if(e.t!=="character"||!e.dual)continue;const a=speechStart(els,i-1);if(a<0||els[a].dual)continue;if(!["dialogue","paren"].includes(els[i-1].t))continue;out.push({L:[a,i],R:[i,speechEnd(els,i)]});}return out;}
function dualAt(sc,i){return dualPairs(sc).find(p=>p.L[0]===i)||null;}
function canDual(sc,i){const els=sc.els;if(!els[i]||els[i].t!=="character"||i<1)return false;if(!["dialogue","paren"].includes(els[i-1].t))return false;const a=speechStart(els,i-1);return a>=0&&!els[a].dual;}
function toggleDual(id){const sc=cur();const f=findEl(id);if(!f)return;if(!f.e.dual&&!canDual(sc,f.i)){toast("O diálogo simultâneo precisa de outra fala logo antes");return;}
  if(f.e.dual)delete f.e.dual;else f.e.dual=true;markRev(f.e);touch(true);renderSheet();toast(f.e.dual?"As duas falas vão lado a lado":"Falas voltaram a ficar uma embaixo da outra");}
const halfW=g=>{const c=mm=>Math.max(8,Math.floor(mm/25.4*10+1e-6));const col=g.tw/2-2;return {character:c(col*0.75),paren:c(col*0.9),dialogue:c(col)};};
const _layout6=layout;
layout=function(sc){
  const info=_layout6(sc);const els=sc.els;const half=halfW(geomOf(sc));
  for(const pr of dualPairs(sc)){
    const calc=(a,b)=>{let s=0;for(let k=a;k<b;k++){const e=els[k];let t=e.x;if(e.t==="character"&&info[k].cont)t+=" (CONT.)";info[k].lines=wrapCount(t,half[e.t]||half.dialogue);s+=info[k].lines+info[k].after;}return s;};
    const Ls=calc(pr.L[0],pr.L[1]),Rs=calc(pr.R[0],pr.R[1]);
    for(let k=pr.L[0];k<pr.L[1];k++){info[k].keepNext=true;info[k].inDual="L";}info[pr.L[0]].dualL=true;
    for(let k=pr.R[0];k<pr.R[1];k++){info[k].inDual="R";info[k].lines=0;info[k].after=0;info[k].keepLines=false;info[k].keepNext=k<pr.R[1]-1;}
    info[pr.R[0]].dualR=true;info[pr.R[1]-1].lines=Math.max(0,Rs-Ls);
  }
  return info;
};
function positionDual(){
  const sc=cur();if(!sc)return;sheet.querySelectorAll(".dual-l,.dual-r").forEach(n=>{n.classList.remove("dual-l","dual-r");n.style.marginTop="";n.style.marginBottom="";});
  for(const pr of dualPairs(sc)){const L=[],R=[];for(let k=pr.L[0];k<pr.L[1];k++){const n=nodeOf(sc.els[k].id);if(n){n.classList.add("dual-l");L.push(n);}}
    for(let k=pr.R[0];k<pr.R[1];k++){const n=nodeOf(sc.els[k].id);if(n){n.classList.add("dual-r");R.push(n);}}
    if(!L.length||!R.length)continue;const h=a=>a.reduce((s,n)=>s+n.offsetHeight,0);const Lh=h(L),Rh=h(R);
    R[0].style.marginTop=(-Lh)+"px";if(Lh>Rh)R[R.length-1].style.marginBottom=(Lh-Rh)+"px";}
}

/* ---------- (MAIS)/(CONT.) e quebra de página forçada ---------- */
const splittable=(e,f)=>(typeof prefs==="undefined"||prefs.dividirFalas!==false)&&e.t==="dialogue"&&!f.inDual&&f.lines>=4;
const tailH=(e,f)=>f.keepLines?(splittable(e,f)?3:f.lines):1;
paginate=function(sc){
  const LP=geomOf(sc).lpp;const info=layout(sc),els=sc.els;let y=0,page=2;const breaks=[];const canSplit=(typeof prefs==="undefined"||prefs.dividirFalas!==false);
  for(let i=0;i<els.length;i++){const f=info[i],e=els[i];f.split=0;
    if(e.quebra&&y>0){page++;y=0;breaks.push({i,pos:"before",page});}
    if(f.keepNext&&y>0){let h=f.before+f.lines+f.after,j=i+1;
      while(j<els.length&&info[j].keepNext&&h<=LP){h+=info[j].before+info[j].lines+info[j].after;j++;}
      if(j<els.length)h+=info[j].before+(typeof tailH==="function"?tailH(els[j],info[j]):(info[j].keepLines?info[j].lines:1));
      if(h<=LP&&y+h>LP){page++;y=0;breaks.push({i,pos:"before",page});}}
    else if(f.keepLines&&y>0&&y+f.before+f.lines>LP&&f.lines<=LP){
      const room=LP-y-f.before;let first=room-1;if(f.lines-first<2)first=f.lines-2;
      if(canSplit&&splittable(e,f)&&first>=2){f.split=first;f.page=page;page++;breaks.push({i,pos:"after",page,split:1});y=1+(f.lines-first)+f.after;if(y>=LP&&i<els.length-1){page++;y=0;breaks.push({i,pos:"after",page});}continue;}
      page++;y=0;breaks.push({i,pos:"before",page});}
    if(y>0)y+=f.before;
    f.page=page;let L=f.lines;
    while(y+L>LP){L-=(LP-y);page++;y=0;breaks.push({i,pos:"after",page});}
    y+=L+f.after;
    if(y>=LP&&i<els.length-1){page++;y=0;breaks.push({i,pos:"after",page});}
  }
  const seen=new Set();
  return {info,breaks:breaks.filter(b=>!seen.has(b.page)&&seen.add(b.page)),pages:y>0?page:page-1,lpp:LP};
};
function toggleQuebra(id){const f=findEl(id);if(!f)return;if(f.e.quebra)delete f.e.quebra;else f.e.quebra=true;touch(true);decor();toast(f.e.quebra?"Este trecho começa numa página nova":"Quebra de página removida");}

S.hiChars=new Set();
function paintHighlights(){
  if(typeof CSS==="undefined"||!CSS.highlights||typeof Highlight==="undefined")return;
  for(const k of [...CSS.highlights.keys()])if(String(k).startsWith("sr-"))CSS.highlights.delete(k);
  const sc=cur();if(!sc||S.view!=="page")return;
  if(prefs.verAnalise!==false&&(sc.meta.analise||[]).length){const by=new Map(),sceneEls=new Map();let sid=null;
    sc.els.forEach(e=>{if(e.t==="scene")sid=e.id;if(sid){if(!sceneEls.has(sid))sceneEls.set(sid,[]);sceneEls.get(sid).push(e);}});
    for(const a of sc.meta.analise){const q=String(a.item||"").toLowerCase();if(!q)continue;for(const e of sceneEls.get(a.sid)||[]){const n=nodeOf(e.id);const t=n&&n.firstChild;if(!t||t.nodeType!==3)continue;
      const hay=t.data.toLowerCase();let p=hay.indexOf(q);while(p>=0){const r=new Range();r.setStart(t,p);r.setEnd(t,p+q.length);if(!by.has(a.cat))by.set(a.cat,[]);by.get(a.cat).push(r);p=hay.indexOf(q,p+q.length);}}}
    for(const [cat,rs] of by)CSS.highlights.set("sr-bd-"+cat,new Highlight(...rs));}
  if(S.hiChars.size){const rs=[];let who=null;for(const e of sc.els){if(e.t==="character")who=baseName(e.x);else if(!["dialogue","paren"].includes(e.t))who=null;
      if(who&&S.hiChars.has(who)){const n=nodeOf(e.id);if(n&&n.firstChild){const r=new Range();r.selectNodeContents(n);rs.push(r);}}}
    if(rs.length)CSS.highlights.set("sr-hi",new Highlight(...rs));}
}

function planData(sc){
  const lay=S.lay&&sc===cur()?S.lay:paginate(sc);const cs=charStats(sc);const ids=new Map(cs.map((c,i)=>[c.name,i+1]));let last="D";
  const list=scenesOf(sc,lay.info).filter(x=>x.n).map(x=>{const p=locParse(x.h);let d=dnOf(p.tod);if(d==="?")d=last;else last=d;const e=sc.els[x.i];
    const ie=p.ie.startsWith("EXT")||p.ie==="INT/EXT"?"EXT":"INT";
    return Object.assign(x,{ie:p.ie==="?"?"INT":p.ie,loc:p.loc,tod:p.tod,dn:d,key:ie+"|"+d,e8:eighthsN(x.lines,lay.lpp),omit:!!e.omit,syn:(e.syn||x.first||"").trim(),cast:[...x.chars].map(n=>ids.get(n)).filter(Boolean).sort((a,b)=>a-b)});});
  const pl=sc.meta.plano||(sc.meta.plano={ordem:[],dias:{}});pl.dias=pl.dias||{};
  const have=new Set(list.map(x=>x.id));const o=(pl.ordem||[]).filter(k=>k.startsWith("dia:")||have.has(k));const seen=new Set(o);for(const x of list)if(!seen.has(x.id))o.push(x.id);pl.ordem=o;

  for(const k of o){if(k.startsWith("dia:")){curD.k=k;days.push(curD);curD={scenes:[]};}else curD.scenes.push(byId.get(k));}
  const unsched=curD.scenes;days.forEach((d,i)=>{d.n=i+1;d.info=pl.dias[d.k]||(pl.dias[d.k]={data:"",chamada:"07:00",obs:""});d.e8=d.scenes.reduce((s,x)=>s+x.e8,0);});
  return {lay,cs,ids,list,byId,pl,days,unsched};
}

      ${P.unsched.length&&P.days.length?`<p class="muted" style="margin:0">As faixas depois do último “fim do dia” ainda não têm dia de gravação.</p>`:""}
      <p class="muted" style="margin:0"><b>Elenco:</b> ${P.cs.map((c,i)=>`${i+1}. ${escH(c.name)}`).join(" · ")||"ninguém fala"}</p>`;}
  else if(S.planTab==="diarias"){
    const nD=P.days.length;
    if(!nD)body=`<div class="empty">${icon("strip",32)}Divida as faixas em dias primeiro (aba Faixas › + Fim do dia ou Montar os dias).</div>`;
    else{const rows=P.cs.map((c,ci)=>{const w=P.days.map(d=>d.scenes.some(x=>x.chars.has(c.name)));const f=w.indexOf(true),l=w.lastIndexOf(true);if(f<0)return "";
        let tr=0,es=0;const cells=w.map((on,k)=>{let v="";if(on){tr++;v=f===l?"IF":k===f?"I":k===l?"F":"T";}else if(k>f&&k<l){es++;v="E";}return `<td class="dd ${v?"d-"+v:""}">${v}</td>`;}).join("");
        return `<tr><td class="num">${ci+1}</td><td><b>${escH(c.name)}</b></td>${cells}<td class="num">${tr}</td><td class="num">${es}</td><td class="num">${l-f+1}</td></tr>`;}).join("");
      body=`<p class="muted" style="margin:0">Em que dias cada personagem grava. <b>I</b> início · <b>T</b> trabalho · <b>F</b> fim · <b>IF</b> entra e sai no mesmo dia · <b>E</b> espera (pago sem gravar, entre o primeiro e o último dia). Menos “E” sai mais barato.</p>
        <div class="listview plan" style="max-height:none"><table class="dood"><thead><tr><th class="num">Nº</th><th>Personagem</th>${P.days.map(d=>`<th class="num">${d.n}º${d.info.data?`<br><small>${escH(isoToBR(d.info.data).slice(0,5))}</small>`:""}</th>`).join("")}<th class="num">Trab.</th><th class="num">Esp.</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="row"><button type="button" class="btn sm" data-pa="doodcsv">Exportar diárias (.csv)</button></div>`;}}
  else{const nD=P.days.length;
    if(!nD)body=`<div class="empty">${icon("strip",32)}Divida as faixas em dias primeiro para montar a ordem do dia.</div>`;
    else{const k=Math.min(Math.max(1,S.planDay||1),nD);S.planDay=k;const d=P.days[k-1];const cs=callSheet(sc,P,d);
      body=`<div class="row"><label class="row">Dia <select data-pday>${P.days.map(x=>`<option value="${x.n}"${x.n===k?" selected":""}>${x.n}º dia${x.info.data?" · "+escH(isoToBR(x.info.data)):""}</option>`).join("")}</select></label>
          <label class="row">Data ${dpHTML("pdd-"+k,d.info.data,'data-pinfo="data"')}</label><label class="row">Chamada <input type="text" data-pinfo="chamada" value="${escH(d.info.chamada||"")}" style="width:64px" aria-label="Horário de chamada"></label>

        <div class="callsheet"><h3>${escH(String(sc.meta.serie).toUpperCase())} · ${escH(epCode(sc.meta))} · ORDEM DO DIA ${k} DE ${nD}</h3>
          <p>${d.info.data?escH(dataLonga(d.info.data)):"<i>sem data</i>"} · chamada geral ${escH(d.info.chamada||"—")} · ${d.scenes.length} cenas · ${e8(d.e8)} páginas</p>
          <div class="listview" style="max-height:none"><table><thead><tr><th class="num">Cena</th><th>I/E</th><th>Local</th><th>D/N</th><th class="num">Págs.</th><th>Elenco</th><th>Resumo</th></tr></thead><tbody>${d.scenes.map(x=>`<tr style="--sc:${STRIP_COR[x.key]}" class="strip"><td class="num"><b>${escH(String(x.label))}</b></td><td>${escH(x.ie)}</td><td>${escH(x.loc)}</td><td>${x.dn==="N"?"NOITE":"DIA"}</td><td class="num">${e8(x.e8)}</td><td>${x.cast.join(", ")}</td><td class="syn">${escH(x.syn.slice(0,140))}</td></tr>`).join("")}</tbody></table></div>
          <div class="grid2"><div><b>Elenco do dia</b><div class="listview" style="max-height:none"><table><thead><tr><th class="num">Nº</th><th>Personagem</th><th>Cenas</th></tr></thead><tbody>${cs.elenco.map(r=>`<tr><td class="num">${r[0]}</td><td>${escH(r[1])}</td><td>${escH(r[2])}</td></tr>`).join("")||`<tr><td colspan="3">Ninguém fala neste dia.</td></tr>`}</tbody></table></div></div>
            <div><b>Necessidades (da análise técnica)</b><div class="listview" style="max-height:none"><table><tbody>${cs.necess.map(r=>`<tr><td><b>${escH(r[0])}</b></td><td>${escH(r[1])}</td></tr>`).join("")||`<tr><td>Nada marcado na análise técnica destas cenas.</td></tr>`}</tbody></table></div>
            <b>Locais</b><p style="margin:2px 0">${cs.locais.map(escH).join(" · ")}</p></div></div>
          <label class="fld"><span>Observações para a equipe</span><textarea data-pinfo="obs" rows="3">${escH(d.info.obs||"")}</textarea></label></div>`;}}
  el.innerHTML=`<div class="castwin"><div class="titlebar"><span data-icon="strip"></span><span class="ttl">Plano de filmagem — ${escH(epCode(sc.meta))} “${escH(sc.meta.titulo)}”</span><button class="tb-btn" type="button" data-cmd="verPagina" aria-label="Fechar plano de filmagem">×</button></div>
    <div class="col" style="padding:8px"><div class="row"><div class="chips"><span class="chip95">${P.list.length} cenas · ${e8(tot)} páginas</span><span class="chip95">${P.days.length} dia${P.days.length===1?"":"s"} de gravação</span><span class="chip95">${sch} cenas com dia · ${P.list.length-sch} sem dia</span>${P.days.length?`<span class="chip95">média ${e8(Math.round(P.days.reduce((s,d)=>s+d.e8,0)/P.days.length))} pág. por dia</span>`:""}</div></div>
    <div class="ptabs" role="group" aria-label="Plano">${tabs.map(([k,l])=>`<button type="button" data-ptab="${k}" aria-pressed="${S.planTab===k}">${l}</button>`).join("")}</div>

  paintIcons(el);

const MESES_L=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS_L=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
function dataLonga(iso){const d=parseISO(iso);if(!d)return iso;return `${DIAS_L[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES_L[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;}
function callSheet(sc,P,d){
  const el=new Map();for(const x of d.scenes)for(const n of x.chars){if(!el.has(n))el.set(n,[]);el.get(n).push(String(x.label));}
  const elenco=[...el].map(([n,l])=>[P.ids.get(n)||"",n,l.join(", ")]).sort((a,b)=>a[0]-b[0]);
  const sids=new Set(d.scenes.map(x=>x.id));const nec=new Map();for(const a of sc.meta.analise||[]){if(!sids.has(a.sid))continue;const c=bdCat(a.cat)[1];if(!nec.has(c))nec.set(c,new Set());nec.get(c).add(a.item);}
  return {elenco,necess:[...nec].map(([c,s])=>[c,[...s].join(", ")]),locais:[...new Set(d.scenes.map(x=>`${x.ie}. ${x.loc}`))]};
}
function planMove(sc,k,dir){const o=sc.meta.plano.ordem;const i=o.indexOf(k);const j=i+dir;if(i<0||j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];markChanged(sc);}
function planBind(el){
  let drag=null;
  el.addEventListener("click",async e=>{const sc=cur();if(!sc)return;
    const t=e.target.closest("[data-ptab]");if(t){S.planTab=t.dataset.ptab;renderPlano();return;}
    const mv=e.target.closest("[data-pmv]");if(mv){planMove(sc,mv.dataset.k,+mv.dataset.pmv);renderPlano();const b=el.querySelector(`[data-pmv="${mv.dataset.pmv}"][data-k="${mv.dataset.k}"]`);if(b)b.focus();return;}
    const dl=e.target.closest("[data-pdel]");if(dl){const o=sc.meta.plano.ordem;o.splice(o.indexOf(dl.dataset.pdel),1);delete sc.meta.plano.dias[dl.dataset.pdel];markChanged(sc);renderPlano();return;}
    const a=e.target.closest("[data-pa]");
    if(!a){const r=e.target.closest("tr.strip[data-k]");if(r&&!e.target.closest("button")){S.planSel=S.planSel===r.dataset.k?null:r.dataset.k;el.querySelectorAll("tr.strip.sel").forEach(x=>x.classList.remove("sel"));if(S.planSel)r.classList.add("sel");}return;}
    const P=planData(sc);const o=P.pl.ordem;
    if(a.dataset.pa==="dia"){const k="dia:"+uid("d");let at=S.planSel?o.indexOf(S.planSel)+1:o.length;if(at<=0)at=o.length;o.splice(at,0,k);markChanged(sc);renderPlano();toast(S.planSel?"Fim do dia depois da cena selecionada":"Fim do dia no final. Arraste ou use ▲▼ para posicionar.");}
    if(a.dataset.pa==="roteiro")dialog({title:"Voltar à ordem do roteiro",width:380,body:`<p style="margin:0">As faixas voltam para a ordem das cenas no roteiro e as divisões de dia são apagadas.</p>`,buttons:[{label:"Voltar",def:1,run:()=>{sc.meta.plano={ordem:[],dias:{}};markChanged(sc);renderPlano();}},{label:"Cancelar"}]});
    if(a.dataset.pa==="auto")autoDays(sc);
    if(a.dataset.pa==="csv"){const q=v=>{const s=String(v==null?"":v);return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};const rows=[["Dia","Cena","I/E","Local","D/N","Oitavos","Páginas","Elenco","Resumo"]];
      const put=(d,x)=>rows.push([d,x.label,x.ie,x.loc,x.dn==="N"?"NOITE":"DIA",x.e8,e8(x.e8),x.cast.map(n=>`${n}. ${P.cs[n-1].name}`).join(", "),x.syn]);
      P.days.forEach(d=>d.scenes.forEach(x=>put(d.n,x)));P.unsched.forEach(x=>put("",x));
      await offer(fileName(sc).replace(/\.docx$/,"_plano.csv"),new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv"}));}
    if(a.dataset.pa==="doodcsv"){const q=v=>{const s=String(v==null?"":v);return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};const rows=[["Nº","Personagem",...P.days.map(d=>d.n+"º dia"),"Trabalho","Espera"]];
      el.querySelectorAll("table.dood tbody tr").forEach(tr=>{const c=[...tr.children].map(td=>td.textContent);rows.push(c.slice(0,c.length-1));});
      await offer(fileName(sc).replace(/\.docx$/,"_diarias.csv"),new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv"}));}
    if(a.dataset.pa==="callsheet"){const d=P.days[(S.planDay||1)-1];await offer(fileName(sc).replace(/\.docx$/,`_ordem_do_dia_${pad2(d.n)}.docx`),await callSheetDocx(sc,P,[d]));}
    if(a.dataset.pa==="callall")await offer(fileName(sc).replace(/\.docx$/,"_ordens_do_dia.docx"),await callSheetDocx(sc,P,P.days));
  });
  el.addEventListener("change",e=>{const t=e.target;if(t.matches("[data-pday]")){S.planDay=+t.value;renderPlano();}});
  el.addEventListener("input",e=>{const t=e.target;const k=t.dataset.pinfo;if(!k)return;const sc=cur();const P=planData(sc);const d=P.days[(S.planDay||1)-1];if(!d)return;
    if(k==="data"){const iso=brToISO(t.value);if(!iso&&t.value.trim())return;d.info.data=iso||"";}else d.info[k]=t.value;markChanged(sc);});
  el.addEventListener("dragstart",e=>{const r=e.target.closest("tr[data-k]");if(!r)return;drag=r.dataset.k;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag);}catch(x){}});
  el.addEventListener("dragend",()=>{drag=null;el.querySelectorAll(".dragging,.drop-a,.drop-b").forEach(x=>x.classList.remove("dragging","drop-a","drop-b"));});
  el.addEventListener("dragover",e=>{if(!drag)return;const r=e.target.closest("tr[data-k]");if(!r)return;e.preventDefault();const b=r.getBoundingClientRect();const after=e.clientY>b.top+b.height/2;
    el.querySelectorAll(".drop-a,.drop-b").forEach(x=>x.classList.remove("drop-a","drop-b"));r.classList.add(after?"drop-a":"drop-b");});
  el.addEventListener("drop",e=>{if(!drag)return;const r=e.target.closest("tr[data-k]");if(!r)return;e.preventDefault();const sc=cur();const o=sc.meta.plano.ordem;const k=drag;const b=r.getBoundingClientRect();const after=e.clientY>b.top+b.height/2;
    if(r.dataset.k===k)return;o.splice(o.indexOf(k),1);let at=o.indexOf(r.dataset.k)+(after?1:0);o.splice(at,0,k);drag=null;markChanged(sc);renderPlano();});
}
function autoDays(sc){
  dialog({title:"Montar os dias de gravação",width:440,body:`<p class="muted" style="margin:0">O ScriptRoom reorganiza as faixas e coloca as divisões de dia. Depois você ajusta à mão.</p>
    <label class="fld"><span>Páginas por dia (no máximo)</span><input type="number" id="ad-p" min="1" max="30" step="0.5" value="${prefs.paginasDia||5}"></label>
    <label class="chk"><input type="checkbox" id="ad-l" checked> Juntar as cenas do mesmo local (menos mudança de set)</label>
    <label class="chk"><input type="checkbox" id="ad-n" checked> No mesmo local, gravar o dia antes da noite</label>`,
    buttons:[{label:"Montar",def:1,run:w=>{const lim=Math.max(1,parseFloat(String(w.querySelector("#ad-p").value).replace(",","."))||5);prefs.paginasDia=lim;savePrefs();
      const P=planData(sc);let l=P.list.filter(x=>!x.omit);const pos=new Map(l.map((x,i)=>[x.id,i]));
      if(w.querySelector("#ad-l").checked){const first=new Map();l.forEach((x,i)=>{if(!first.has(x.loc))first.set(x.loc,i);});const byN=w.querySelector("#ad-n").checked;
        l=[...l].sort((a,b)=>(first.get(a.loc)-first.get(b.loc))||(byN?(a.dn==="N")-(b.dn==="N"):0)||(pos.get(a.id)-pos.get(b.id)));}
      const o=[];const dias={};let acc=0;const cap=Math.round(lim*8);
      for(const x of l){if(acc>0&&acc+x.e8>cap){const k="dia:"+uid("d");o.push(k);dias[k]={data:"",chamada:"07:00",obs:""};acc=0;}o.push(x.id);acc+=x.e8;}
      if(acc>0){const k="dia:"+uid("d");o.push(k);dias[k]={data:"",chamada:"07:00",obs:""};}
      P.list.filter(x=>x.omit).forEach(x=>o.push(x.id));
      sc.meta.plano={ordem:o,dias};markChanged(sc);renderPlano();toast(`${Object.keys(dias).length} dias de gravação montados`);}},{label:"Cancelar"}]});
}
function dTbl(cols,rows,widths){
  const cell=(t,w,b,fill)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:""}</w:tcPr>${String(t==null?"":t).split("\n").map(l=>pX(`<w:spacing w:after="0"/>`,rX(l,{sz:18,b:b?1:0}))).join("")}</w:tc>`;
  const bd=`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join("")}</w:tblBorders>`;
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${bd}<w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid><w:tr><w:trPr><w:tblHeader/></w:trPr>${cols.map((c,i)=>cell(c,widths[i],1,"D0D0D0")).join("")}</w:tr>${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>cell(c,widths[i],0,r.fill)).join("")}</w:tr>`).join("")}</w:tbl>`;
}

    x+=pX(`<w:spacing w:after="200"/><w:jc w:val="center"/>`,rX(`${d.info.data?dataLonga(d.info.data):"Data a definir"} · Chamada geral: ${d.info.chamada||"—"} · ${d.scenes.length} cenas · ${e8(d.e8)} páginas`,{sz:20}));

    x+=pX(`<w:spacing w:before="200" w:after="80"/>`,rX("ELENCO",{sz:20,b:1}));

  });
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${x}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="850" w:right="1134" w:bottom="850" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr>${FONT}<w:sz w:val="20"/><w:lang w:val="pt-BR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const drels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;

function canon(v){if(Array.isArray(v))return "["+v.map(canon).join(",")+"]";if(v&&typeof v==="object")return "{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}";return JSON.stringify(v===undefined?null:v);}

    const resp=[...r.resp];for(const x of c.resp)if(!resp.some(y=>y.data===x.data&&y.txt===x.txt))resp.push(x);resp.sort((a,b2)=>a.data-b2.data);out.set(c.id,Object.assign({},r,{resp,ok:c.ok||r.ok}));}

    const lc=canon(le),rc=canon(e);

    let at=0;for(let k=i-1;k>=0;k--){const p=out.findIndex(x=>x.id===L.els[k].id);if(p>=0){at=p+1;break;}}out.splice(at,0,e);});

function onRemoteRoteiros(snap){

  for(const ch of snap.docChanges()){const d=ch.doc;if(d.metadata&&(d.metadata.hasPendingWrites||d.metadata.fromCache))continue;
    if(ch.type==="removed"){const l=S.eps[d.id];if(l&&!S.dirty.has(d.id)){delete S.eps[d.id];delete COLAB.base[d.id];listChanged=true;if(S.cur===d.id){toast("Outra pessoa excluiu este roteiro");const L=sortedEps();openEp(L.length?L[L.length-1].id:null);}}continue;}
    const raw=d.data();if(!raw||!raw.meta)continue;const r=JSON.parse(JSON.stringify(raw));r.id=d.id;const rc=canonDoc(r);
    const l=S.eps[d.id];const base=COLAB.base[d.id];
    if(!l){S.eps[d.id]=r;COLAB.base[d.id]=r;listChanged=true;continue;}
    const lc=canonDoc(l);
    if(rc===lc){COLAB.base[d.id]=r;continue;}
    const pd=COLAB.pend[d.id];if(pd&&pd.includes(rc)){COLAB.base[d.id]=r;COLAB.pend[d.id]=pd.slice(pd.indexOf(rc)+1);continue;}
    if(base&&rc===canonDoc(base))continue;

    COLAB.base[d.id]=r;

    if(canonDoc(nd)!==rc){S.eps[d.id].atualizado=Date.now();S.dirty.add(d.id);clearTimeout(saveT);saveT=setTimeout(flush,900);}
    else S.dirty.delete(d.id);

  }

}

const escA=s=>escX(s).replace(/"/g,"&quot;");

/* ---------- exportar .fdx ---------- */
const FDX_T={scene:"Scene Heading",action:"Action",character:"Character",paren:"Parenthetical",dialogue:"Dialogue",trans:"Transition",act:"New Act",time:"General",note:"General"};
function toFdx(sc){
  const m=sc.meta;const lay=paginate(sc);const pairs=new Map(dualPairs(sc).map(q=>[q.L[0],q]));
  const para=(e,i)=>{const f=lay.info[i];const T=FDX_T[e.t]||"Action";let x=e.x;let attrs=` Type="${T}"`;
    if(e.t==="scene"){attrs+=` Number="${escA(String(f.label||f.num))}"`;if(e.omit)x="OMITIDA";}
    if(e.quebra)attrs+=` StartsNewPage="Yes"`;
    if(["scene","character","act","trans"].includes(e.t))x=x.toUpperCase();
    const style=e.t==="note"||e.t==="time"?` Style="Italic"`:"";
    const props=e.t==="scene"&&(e.syn||"").trim()?`<SceneProperties Length="${e8(eighthsN(scenesLines(sc,lay,i),lay.lpp))}" Page="${f.page||1}" Title=""><Summary><Paragraph Type="Action"><Text>${escX(e.syn.trim())}</Text></Paragraph></Summary></SceneProperties>`:"";
    return `    <Paragraph${attrs}>${props}<Text${style}>${escX(x)}</Text></Paragraph>\n`;};
  let body="";
  for(let i=0;i<sc.els.length;i++){const pr=pairs.get(i);
    if(pr){body+=`    <Paragraph${sc.els[i].quebra?` StartsNewPage="Yes"`:""}><DualDialogue>\n`;for(let k=pr.L[0];k<pr.R[1];k++)body+="  "+para(Object.assign({},sc.els[k],{quebra:false}),k);body+=`    </DualDialogue></Paragraph>\n`;i=pr.R[1]-1;continue;}
    body+=para(sc.els[i],i);}
  const tp=[[String(m.serie).toUpperCase(),1],[epCode(m),0],[`“${m.titulo}”`,1],["",0],[`${m.temporada}ª temporada · ${m.unidade||"episódio"} ${m.episodio} · ${m.duracao}`,0],[estreiaLine(m),0],...(m.notas||[]).map(n=>[n,0])];
  const title=tp.map(([t,b])=>`      <Paragraph Alignment="Center" Type="General"><Text${b?' Style="Bold"':""}>${escX(t)}</Text></Paragraph>\n`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n<FinalDraft DocumentType="Script" Template="No" Version="5">\n  <Content>\n${body}  </Content>\n  <TitlePage>\n    <Content>\n${title}    </Content>\n  </TitlePage>\n</FinalDraft>\n`;
}
function scenesLines(sc,lay,i){let s=0;for(let k=i;k<sc.els.length;k++){if(k>i&&(sc.els[k].t==="scene"||sc.els[k].t==="act"))break;const f=lay.info[k];s+=f.before+f.lines+f.after;}return s;}

/* ---------- importar .fdx ---------- */
function importFdx(xml,fname){
  const dom=new DOMParser().parseFromString(xml,"application/xml");if(dom.getElementsByTagName("parsererror").length)throw new Error("o .fdx está corrompido");
  const root=dom.documentElement;if(!root||root.nodeName!=="FinalDraft")throw new Error("não parece um arquivo do Final Draft");
  const content=[...root.children].find(n=>n.nodeName==="Content");if(!content)throw new Error("o .fdx não tem roteiro");
  const txt=p=>[...p.children].filter(n=>n.nodeName==="Text").map(n=>n.textContent).join("");
  const italic=p=>[...p.children].filter(n=>n.nodeName==="Text").some(n=>/Italic/i.test(n.getAttribute("Style")||""));
  const els=[];let pendQ=false;
  const push=(p,dualSecond)=>{const T=p.getAttribute("Type")||"Action";let x=txt(p).replace(/\s+$/,"");const xt=x.trim();let t;
    if(p.getAttribute("StartsNewPage")==="Yes")pendQ=true;
    switch(T){case"Scene Heading":t="scene";break;case"Character":t="character";x=xt.replace(/\s*\((CONT['’]?D|CONT\.?|MAIS|MORE)\)\s*$/i,"");break;case"Parenthetical":t="paren";break;case"Dialogue":t="dialogue";break;
      case"Transition":t="trans";break;case"New Act":case"End of Act":case"Act Break":t="act";break;case"Shot":t="action";x=xt.toUpperCase();break;
      case"General":t=TC.test(xt)?"time":italic(p)||/^[A-ZÇÃÕÉÍ ]{3,24}:/.test(xt)?"note":"action";break;default:t="action";}
    if(!xt&&t!=="action")return;if(!xt&&els.length&&els[els.length-1].t==="action"&&!els[els.length-1].x)return;
    const e={id:uid(),t,x:t==="dialogue"||t==="action"||t==="note"?x.trim():xt};
    if(t==="scene"){const sp=[...p.children].find(n=>n.nodeName==="SceneProperties");if(sp){const sm=[...sp.getElementsByTagName("Summary")][0];if(sm){const s=[...sm.getElementsByTagName("Text")].map(n=>n.textContent).join(" ").trim();if(s)e.syn=s;}}
      if(/^OMITID[AO]$|^OMITTED$/i.test(xt)){e.omit=true;}}
    if(dualSecond)e.dual=true;if(pendQ){e.quebra=true;pendQ=false;}if(e.x||t==="action")els.push(e);};
  for(const p of content.children){if(p.nodeName!=="Paragraph")continue;
    const dd=[...p.children].find(n=>n.nodeName==="DualDialogue");
    if(dd){if(p.getAttribute("StartsNewPage")==="Yes")pendQ=true;let chars=0;for(const q of dd.children){if(q.nodeName!=="Paragraph")continue;const isC=q.getAttribute("Type")==="Character";if(isC)chars++;push(q,isC&&chars===2);}continue;}
    push(p,false);}
  const sc=newScript(null);sc.meta.titulo=String(fname||"Roteiro").replace(/\.fdx$/i,"").trim();
  const tpg=[...root.children].find(n=>n.nodeName==="TitlePage");
  if(tpg){const lines=[...tpg.getElementsByTagName("Paragraph")].map(txt).map(s=>s.trim()).filter(Boolean);let used=new Set();
    lines.forEach((l,k)=>{let mm;if((mm=/^[“"](.+)[”"]$/.exec(l))){sc.meta.titulo=mm[1].toUpperCase();used.add(k);}else if((mm=/^(\S+)\s+EP\s*(\d+)$/i.exec(l))){sc.meta.codigo=mm[1];sc.meta.episodio=+mm[2];used.add(k);}});
    const first=lines.findIndex((l,k)=>!used.has(k));if(first>=0&&first<2){sc.meta.serie=lines[first];used.add(first);}
    if(!lines.some(l=>/^[“"]/.test(l))&&first>=0){sc.meta.titulo=lines[first].toUpperCase();}
    const notas=lines.filter((l,k)=>!used.has(k)&&!/temporada|estreia/i.test(l));if(notas.length)sc.meta.notas=notas.slice(0,6);}
  sc.els=els.length?els:[E("action","")];return sc;
}

/* ---------- Beat Board ---------- */
const BEAT_COR=["#FFF8B0","#C8E0FF","#D8F0D0","#FFD8D8","#E4D4FF","#FFE0B0","#FFFFFF"];
const bbData=sc=>{const b=sc.meta.beats||(sc.meta.beats={items:[],links:[]});b.items=b.items||[];b.links=b.links||[];return b;};

function bbCard(b,scenes){const s=b.sid&&scenes.find(x=>x.id===b.sid);
  return `<div class="beat${S.bbSel===b.id?" sel":""}" data-b="${b.id}" style="left:${b.x}px;top:${b.y}px;--bc:${b.cor||BEAT_COR[0]}" tabindex="0" role="group" aria-label="Beat ${escH(b.t||"sem título")}">
    <div class="bt-h" data-drag="${b.id}" title="Arraste para mover"><span class="grip" aria-hidden="true">⋮⋮</span><input class="bt-t" data-bf="t" value="${escH(b.t||"")}" placeholder="Título do beat" aria-label="Título do beat"><button type="button" class="ib" data-bdel="${b.id}" aria-label="Apagar beat" title="Apagar">×</button></div>
    <textarea class="bt-x" data-bf="txt" rows="3" placeholder="O que acontece. Uma ideia, uma imagem, uma fala." aria-label="Texto do beat">${escH(b.txt||"")}</textarea>
    <div class="bt-f"><select data-bf="sid" aria-label="Cena ligada"><option value="">— sem cena —</option>${scenes.map(x=>`<option value="${x.id}"${x.id===b.sid?" selected":""}>Cena ${escH(String(x.label||x.n))} · ${escH(x.h.slice(0,28))}</option>`).join("")}</select>
      ${s?`<button type="button" class="ib" data-bgo="${s.id}" title="Ir para a cena ${escH(String(s.label||s.n))}" aria-label="Ir para a cena">→</button>`:`<button type="button" class="ib" data-bnew="${b.id}" title="Criar uma cena com este beat" aria-label="Criar cena com este beat">+</button>`}</div></div>`;}
function renderBeats(){

    <div class="col" style="padding:8px"><div class="row"><button type="button" class="btn sm" data-ba="novo">+ Beat</button><button type="button" class="btn sm" data-ba="ligar" aria-pressed="${S.bbLink}">${S.bbLink?"Clique em dois beats…":"Ligar beats"}</button><button type="button" class="btn sm" data-ba="grade">Arrumar em grade</button><button type="button" class="btn sm" data-ba="cenas">Beats das cenas</button><button type="button" class="btn sm" data-ba="criar">Criar cenas dos beats soltos</button>
      <span class="bb-cores" role="group" aria-label="Cor do beat selecionado">${BEAT_COR.map(c=>`<button type="button" class="sw" data-bcor="${c}" style="background:${c}" aria-label="Cor ${c}" title="Cor do beat selecionado"></button>`).join("")}</span>
      <span class="muted" style="margin-left:auto">${B.items.length} beats · ${B.items.filter(b=>b.sid).length} ligados a cenas · dois cliques no fundo criam um beat</span></div>
      <div class="bb-scroll"><div class="bb-canvas" style="width:${W}px;height:${H}px"><svg class="bb-links" width="${W}" height="${H}" aria-hidden="true"><defs><marker id="bbArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C00000"/></marker></defs><g></g></svg>${B.items.map(b=>bbCard(b,scenes)).join("")}</div></div></div></div>`;
  paintIcons(el);bbLinks();
}
function bbLinks(){const el=document.getElementById("beats");const sc=cur();if(!el||!sc)return;const g=el.querySelector(".bb-links g");if(!g)return;const B=bbData(sc);
  const ctr=id=>{const n=el.querySelector(`.beat[data-b="${id}"]`);return n?{x:n.offsetLeft,y:n.offsetTop,w:n.offsetWidth,h:n.offsetHeight}:null;};
  g.innerHTML=B.links.map(([a,b],k)=>{const A=ctr(a),Bb=ctr(b);if(!A||!Bb)return "";const ax=A.x+A.w/2,ay=A.y+A.h/2,bx=Bb.x+Bb.w/2,by=Bb.y+Bb.h/2;
    const dx=bx-ax,dy=by-ay;const t=Math.min(Math.abs((Bb.w/2+4)/(dx||1e-6)),Math.abs((Bb.h/2+4)/(dy||1e-6)));const ex=bx-dx*t,ey=by-dy*t;
    return `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#C00000" stroke-width="2" marker-end="url(#bbArrow)"/><circle class="bb-lk" data-blk="${k}" cx="${((ax+ex)/2).toFixed(1)}" cy="${((ay+ey)/2).toFixed(1)}" r="6" fill="#fff" stroke="#C00000"><title>Clique para apagar esta ligação</title></circle>`;}).join("");}
function bbNew(x,y,extra){const sc=cur();const B=bbData(sc);const b=Object.assign({id:uid("bt"),x:Math.round(x),y:Math.round(y),t:"",txt:"",cor:BEAT_COR[B.items.length%BEAT_COR.length]},extra||{});B.items.push(b);S.bbSel=b.id;markChanged(sc);renderBeats();return b;}
function bbBind(el){
  let drag=null;let saveT2=null;
  const sc=()=>cur();const find=id=>bbData(sc()).items.find(b=>b.id===id);
  el.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-drag]");if(!h||e.target.closest("input,button,select,textarea"))return;const n=h.closest(".beat");const b=find(n.dataset.b);if(!b)return;
    e.preventDefault();h.setPointerCapture(e.pointerId);drag={b,n,h,sx:e.clientX,sy:e.clientY,x0:b.x,y0:b.y,moved:false};n.classList.add("dragging");});
  el.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;
    drag.b.x=Math.max(0,Math.round(drag.x0+dx));drag.b.y=Math.max(0,Math.round(drag.y0+dy));drag.n.style.left=drag.b.x+"px";drag.n.style.top=drag.b.y+"px";bbLinks();});
  el.addEventListener("pointerup",()=>{if(!drag)return;drag.n.classList.remove("dragging");if(drag.moved)markChanged(sc());drag=null;});
  el.addEventListener("click",e=>{const s=sc();if(!s)return;const B=bbData(s);
    const a=e.target.closest("[data-ba]");
    if(a){const k=a.dataset.ba;
      if(k==="novo"){const sb=el.querySelector(".bb-scroll");bbNew((sb?sb.scrollLeft:0)+40+(B.items.length%5)*30,(sb?sb.scrollTop:0)+40+(B.items.length%5)*30);setTimeout(()=>{const i=el.querySelector(`.beat[data-b="${S.bbSel}"] .bt-t`);if(i)i.focus();},0);}
      if(k==="ligar"){S.bbLink=!S.bbLink;S.bbFrom=null;renderBeats();if(S.bbLink)toast("Clique no beat de onde a seta sai e depois no beat aonde ela chega");}
      if(k==="grade"){B.items.forEach((b,i)=>{b.x=24+(i%5)*250;b.y=24+Math.floor(i/5)*200;});markChanged(s);renderBeats();}
      if(k==="cenas"){const lay=paginate(s);const scenes=scenesOf(s,lay.info).filter(x=>x.n);let n=0;
        for(const x of scenes){if(B.items.some(b=>b.sid===x.id))continue;const i=B.items.length;B.items.push({id:uid("bt"),x:24+(i%6)*250,y:24+Math.floor(i/6)*200,t:`Cena ${x.label||x.n}`,txt:(x.syn||x.first||"").slice(0,240),sid:x.id,cor:x.cor||BEAT_COR[1]});n++;}
        markChanged(s);renderBeats();toast(n?`${n} beats criados a partir das cenas`:"Todas as cenas já têm beat");}
      if(k==="criar"){const solt=B.items.filter(b=>!b.sid&&(b.t||b.txt).trim());if(!solt.length){toast("Não há beats soltos com texto");return;}
        solt.sort((p,q)=>p.y-q.y||p.x-q.x).forEach(b=>bbToScene(b,true));renderBeats();toast(`${solt.length} cena${solt.length>1?"s":""} nova${solt.length>1?"s":""} no fim do roteiro`);}
      return;}
    const lk=e.target.closest("[data-blk]");if(lk){B.links.splice(+lk.dataset.blk,1);markChanged(s);bbLinks();return;}
    const del=e.target.closest("[data-bdel]");if(del){const id=del.dataset.bdel;B.items=B.items.filter(b=>b.id!==id);B.links=B.links.filter(l=>l[0]!==id&&l[1]!==id);markChanged(s);renderBeats();toast("Beat apagado (Ctrl+Z desfaz)");histCommit();return;}
    const go=e.target.closest("[data-bgo]");if(go){setMode("page");setTimeout(()=>gotoEl(go.dataset.bgo),0);return;}
    const nw=e.target.closest("[data-bnew]");if(nw){const b=find(nw.dataset.bnew);if(b){bbToScene(b,false);renderBeats();toast("Cena criada no fim do roteiro e ligada ao beat");}return;}

      if(S.bbSel!==card.dataset.b){S.bbSel=card.dataset.b;el.querySelectorAll(".beat.sel").forEach(x=>x.classList.remove("sel"));card.classList.add("sel");}}});
  el.addEventListener("dblclick",e=>{if(e.target.closest(".beat"))return;const cv=e.target.closest(".bb-canvas");if(!cv)return;const r=cv.getBoundingClientRect();
    bbNew(e.clientX-r.left-110,e.clientY-r.top-30);setTimeout(()=>{const i=el.querySelector(`.beat[data-b="${S.bbSel}"] .bt-t`);if(i)i.focus();},0);});
  el.addEventListener("input",e=>{const f=e.target.dataset.bf;if(!f||f==="sid")return;const n=e.target.closest(".beat");const b=n&&find(n.dataset.b);if(!b)return;b[f]=e.target.value;clearTimeout(saveT2);saveT2=setTimeout(()=>markChanged(sc()),400);if(f==="txt")bbLinks();});

    if(st){e.preventDefault();b.x=Math.max(0,b.x+st[0]);b.y=Math.max(0,b.y+st[1]);n.style.left=b.x+"px";n.style.top=b.y+"px";bbLinks();markChanged(sc());}
    if(e.key==="Delete"){e.preventDefault();n.querySelector("[data-bdel]").click();}});
}

/* a sala falsa: mesma forma do room do claude.ai */
function makeLanRoom(){
  const R={peers:[],onp:[],topics:{}};
  const mk=p=>Object.freeze({peer:String(p.peer),by:null,isMe:p.peer===LAN.me,sameTab:p.peer===LAN.me,kind:"viewer",guest:false,presence:Object.freeze(Object.assign({},p.presence||{})),updatedAt:Date.now()});
  R.api={presence:async patch=>{await window.salaNative.lanSend({k:"pres",p:patch});},
    onPeers(fn){R.onp.push(fn);if(R.peers.length)setTimeout(()=>fn({peers:R.peers,joined:R.peers,left:[],updated:[]}),0);return ()=>{R.onp=R.onp.filter(f=>f!==fn);};},
    on(t,fn){(R.topics[t]=R.topics[t]||[]).push(fn);return ()=>{R.topics[t]=R.topics[t].filter(f=>f!==fn);};},
    emit:async(t,d)=>{if(!LAN.on)return;await window.salaNative.lanSend({k:"emit",topic:t,data:d===undefined?null:d});},
    peers:()=>R.peers,connected:()=>LAN.on};
  R.setPeers=list=>{if(!Array.isArray(list))return;const old=new Map(R.peers.map(p=>[p.peer,p]));const nw=list.filter(p=>p&&p.peer).map(mk);const ids=new Set(nw.map(p=>p.peer));
    const joined=nw.filter(p=>!old.has(p.peer)),left=R.peers.filter(p=>!ids.has(p.peer)),updated=nw.filter(p=>old.has(p.peer));R.peers=nw;R.onp.forEach(fn=>fn({peers:nw,joined,left,updated}));};
  R.msg=m=>{if(typeof m.topic!=="string")return;(R.topics[m.topic]||[]).forEach(fn=>fn({peer:String(m.peer),by:null,isMe:m.peer===LAN.me,sameTab:m.peer===LAN.me,kind:"viewer",guest:false,topic:m.topic,data:m.data}));};
  return R;
}

function lanAdapter(native){return {collection(c){const base=native.collection(c);return Object.assign({},base,{doc:id=>{const d=base.doc(id);return Object.assign({},d,{

  delete:async()=>{await d.delete();if(LAN.on&&LAN.role==="client"&&LAN_SHARED.includes(c)&&LAN.ids.has(id))window.salaNative.lanSend({k:"del",c,id});}});}});}};}
const fakeSnap=(type,id,data)=>({docChanges:()=>[{type,doc:{id,data:()=>data,metadata:{hasPendingWrites:false,fromCache:false}}}],metadata:{fromCache:false,hasPendingWrites:false}});
const cacheLocal=(c,id,data)=>{if(LAN.role==="client"&&LAN.nativeDb)LAN.nativeDb.collection(c).doc(id).set(data).catch(()=>{});};
function lanOnDoc(m){const {c,id,data}=m;if(!LAN_SHARED.includes(c)||typeof id!=="string"||!data||typeof data!=="object")return;LAN.ids.add(id);
  if(c==="roteiros"){cacheLocal(c,id,data);onRemoteRoteiros(fakeSnap(S.eps[id]?"modified":"added",id,data));return;}
  if(c==="mapas"){cacheLocal(c,id,data);if(typeof MAPCACHE!=="undefined")MAPCACHE[id]=data;return;}
  const obj=c==="series"?S.series:S.chars;const r=Object.assign({},data,{id});if(obj[id]&&canon(obj[id])===canon(r))return;obj[id]=r;cacheLocal(c,id,data);
  if(c==="series"){renderEpSel();if(S.view==="season")renderSeason();}else if(S.view==="cast")renderCast();}
function lanOnDel(m){const {c,id}=m;if(!LAN_SHARED.includes(c)||typeof id!=="string")return;
  if(c==="roteiros"){const l=S.eps[id];if(l){onRemoteRoteiros(fakeSnap("removed",id,l));if(LAN.role==="client"&&LAN.nativeDb)LAN.nativeDb.collection(c).doc(id).delete().catch(()=>{});}return;}
  const obj=c==="series"?S.series:S.chars;if(obj[id]){delete obj[id];if(LAN.role==="client"&&LAN.nativeDb)LAN.nativeDb.collection(c).doc(id).delete().catch(()=>{});renderEpSel();}}
async function lanWelcome(m){
  clearTimeout(LAN.waitT);LAN.me=String(m.you);LAN.host=String(m.host||"");LAN.role="client";LAN.nativeDb=S.db;
  LAN.localAtJoin=new Set([...Object.keys(S.eps),...Object.keys(S.chars),...Object.keys(S.series)]);LAN.ids=new Set();
  const docs=m.docs||{};let trocados=0;
  for(const {id,data} of docs.series||[]){if(!data)continue;LAN.ids.add(id);S.series[id]=Object.assign({},data,{id});cacheLocal("series",id,data);}
  for(const {id,data} of docs.mapas||[]){if(!data)continue;LAN.ids.add(id);cacheLocal("mapas",id,data);if(typeof MAPCACHE!=="undefined")MAPCACHE[id]=data;}
  for(const {id,data} of docs.personagens||[]){if(!data)continue;LAN.ids.add(id);S.chars[id]=Object.assign({},data,{id});cacheLocal("personagens",id,data);}
  for(const {id,data} of docs.roteiros||[]){if(!data||!data.meta)continue;LAN.ids.add(id);const r=Object.assign({},data,{id});const l=S.eps[id];
    if(l&&canonDoc(l)!==canonDoc(r)){trocados++;const v={id:uid("v"),epId:id,label:"Minha cópia antes de entrar na sala",auto:true,at:Date.now(),cenas:l.els.filter(e=>e.t==="scene").length,snapshot:JSON.parse(JSON.stringify({meta:l.meta,els:l.els}))};
      try{await LAN.nativeDb.collection("versoes").doc(v.id).set(v);}catch(e){}}
    S.eps[id]=r;COLAB.base[id]=JSON.parse(JSON.stringify(r));cacheLocal("roteiros",id,data);S.dirty.delete(id);}
  S.db=lanAdapter(LAN.nativeDb);lanUp();

}

/* o modem de 1996 (curto e baixinho; desliga em Ferramentas › Som de teclado) */
function modemSound(){if(prefs.somRede===false)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C();const g=a.createGain();g.gain.value=.035;g.connect(a.destination);let t=a.currentTime+.05;
  const tone=(f1,f2,d)=>{for(const f of [f1,f2]){const o=a.createOscillator();o.type="sine";o.frequency.value=f;o.connect(g);o.start(t);o.stop(t+d);}t+=d+.04;};
  const DT={4:[770,1209],7:[852,1209],9:[852,1477],5:[770,1336]};for(const d of [4,7,9,5])tone(...DT[d],.07);
  t+=.1;const o=a.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(1300,t);o.frequency.setValueAtTime(2100,t+.25);o.frequency.setValueAtTime(980,t+.5);o.frequency.linearRampToValueAtTime(1650,t+.9);o.connect(g);o.start(t);o.stop(t+1.05);
  const n=a.createBufferSource();const b=a.createBuffer(1,a.sampleRate*.5|0,a.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*.5;n.buffer=b;n.connect(g);n.start(t+1.05);
  setTimeout(()=>a.close(),2600);}catch(e){}}

function hDiff(A,B){const P={els:{}};if(canon(A.meta)!==canon(B.meta))P.meta=JSON.parse(JSON.stringify(A.meta));
  const ai=A.els.map(e=>e.id),bi=B.els.map(e=>e.id);if(ai.join("\u0001")!==bi.join("\u0001"))P.ids=ai;
  const bm=new Map(B.els.map(e=>[e.id,JSON.stringify(e)]));for(const e of A.els){const s=JSON.stringify(e);if(bm.get(e.id)!==s)P.els[e.id]=JSON.parse(s);}return P;}
function hApply(B,P){const bm=new Map(B.els.map(e=>[e.id,e]));const ids=P.ids||B.els.map(e=>e.id);
  return {meta:P.meta!==undefined?P.meta:B.meta,els:ids.map(id=>P.els[id]||bm.get(id)).filter(Boolean)};}
const hq=s=>{s=String(s).replace(/\s+/g," ").trim();return "“"+(s.length>36?s.slice(0,35)+"…":s)+"”";};
const HMETA={coment:"os comentários",plano:"o plano de filmagem",beats:"o Beat Board",titulo:"o título",analise:"a análise técnica",rev:"as revisões",pagina:"a página e as margens",episodio:"o número do episódio",logline:"a logline",status:"a etapa",notas:"as notas da folha de rosto",estreia:"a data de estreia",cenasTravadas:"a numeração das cenas"};
function hLabel(A,B){
  const am=new Map(A.els.map(e=>[e.id,e])),bm=new Map(B.els.map(e=>[e.id,e]));const T=e=>((TYPES[e.t]||TYPES.action).label);
  const added=B.els.filter(e=>!am.has(e.id)),removed=A.els.filter(e=>!bm.has(e.id)),changed=B.els.filter(e=>am.has(e.id)&&JSON.stringify(am.get(e.id))!==JSON.stringify(e));
  if(added.length===1&&!removed.length&&changed.length<=1)return `Novo elemento: ${T(added[0])}${added[0].x.trim()?" "+hq(added[0].x):""}`;
  if(removed.length===1&&!added.length&&changed.length<=1)return `Apagou ${T(removed[0])}${removed[0].x.trim()?" "+hq(removed[0].x):""}`;
  if(added.length||removed.length)return [added.length?`${added.length} elemento${added.length>1?"s":""} novo${added.length>1?"s":""}`:"",removed.length?`${removed.length} apagado${removed.length>1?"s":""}`:""].filter(Boolean).join(", ");
  if(changed.length===1){const a=am.get(changed[0].id),b=changed[0];if(a.t!==b.t)return `${T(a)} virou ${T(b)}`;
    if(a.x!==b.x){let p=0;while(p<a.x.length&&p<b.x.length&&a.x[p]===b.x[p])p++;let s=0;while(s<a.x.length-p&&s<b.x.length-p&&a.x[a.x.length-1-s]===b.x[b.x.length-1-s])s++;
      const ins=b.x.slice(p,b.x.length-s),del=a.x.slice(p,a.x.length-s);
      if(ins&&!del)return `Escreveu ${hq(ins)} em ${T(b)}`;if(del&&!ins)return `Apagou ${hq(del)} em ${T(b)}`;return `Trocou ${hq(del)} por ${hq(ins)}`;}
    return `Mudou ${T(b)} (${b.dual!==a.dual?"diálogo simultâneo":b.quebra!==a.quebra?"página nova":b.ponto!==a.ponto?"ponto de estrutura":b.nota!==a.nota?"nota":b.cor!==a.cor?"cor":"propriedades"})`;}
  if(changed.length>1)return `${changed.length} elementos alterados`;
  if(A.els.map(e=>e.id).join()!==B.els.map(e=>e.id).join())return "Mudou a ordem das cenas";
  const ks=[...new Set([...Object.keys(A.meta||{}),...Object.keys(B.meta||{})])].filter(k=>canon(A.meta[k])!==canon(B.meta[k]));
  return ks.length?`Mudou ${ks.map(k=>HMETA[k]||"as propriedades").filter((v,i,a)=>a.indexOf(v)===i).slice(0,2).join(" e ")}`:"Alteração";

    if(o.x!==e.x){let s=0;while(s<o.x.length&&s<e.x.length&&o.x[o.x.length-1-s]===e.x[e.x.length-1-s])s++;let p=0;while(p<o.x.length-s&&p<e.x.length-s&&o.x[p]===e.x[p])p++;return {id:e.id,off:Math.max(p,e.x.length-s)};}

function netData(scope){const sc=cur();const eps=scope==="serie"?seriesEps(sc.meta.serieId):[sc];const falas=new Map(),pares=new Map(),cenas=new Map();
  for(const s of eps){const lay=paginate(s);for(const x of scenesOf(s,lay.info)){if(!x.n)continue;const who=[...x.chars].filter(Boolean);
      for(const w of who)cenas.set(w,(cenas.get(w)||0)+1);
      for(let i=0;i<who.length;i++)for(let j=i+1;j<who.length;j++){const k=[who[i],who[j]].sort().join("\u0001");pares.set(k,(pares.get(k)||0)+1);}}
    for(const c of charStats(s))falas.set(c.name,(falas.get(c.name)||0)+c.falas);}
  const top=[...falas].sort((a,b)=>b[1]-a[1]).slice(0,26).map(([n])=>n);const set=new Set(top);
  const edges=[...pares].map(([k,w])=>{const [a,b]=k.split("\u0001");return {a,b,w};}).filter(e=>set.has(e.a)&&set.has(e.b));
  return {nodes:top.map(n=>({id:n,falas:falas.get(n),cenas:cenas.get(n)||0})),edges,eps:eps.length};}

    for(const e of D.edges){const a=N[idx.get(e.a)],b=N[idx.get(e.b)];const dx=b.x-a.x,dy=b.y-a.y;const d=Math.sqrt(dx*dx+dy*dy)||.01;const want=170-90*(e.w/maxW);const f=(d-want)*.012*t;a.x+=dx/d*f;a.y+=dy/d*f;b.x-=dx/d*f;b.y-=dy/d*f;}
    for(const n of N){n.x+=(W/2-n.x)*.004;n.y+=(Hh/2-n.y)*.004;}}
  if(N.length>1){const xs=N.map(n=>n.x),ys=N.map(n=>n.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    for(const n of N){n.x=60+(n.x-x0)/((x1-x0)||1)*(W-120);n.y=40+(n.y-y0)/((y1-y0)||1)*(Hh-90);}}else if(N[0]){N[0].x=W/2;N[0].y=Hh/2;}}
const netColor=name=>{const c=Object.values(S.chars).find(x=>baseName(x.nome||"")===name);if(c&&c.cor)return c.cor;let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;return `hsl(${h%360} 62% 46%)`;};
function netDialog(){const sc=cur();if(!sc)return;let scope="ep",sel=null,D=null;const W=760,Hh=420;

      ${D.nodes.map(n=>{const r=7+16*Math.sqrt(n.falas/maxF);const dim=sel&&n.id!==sel&&!nb.has(n.id);return `<g class="nnode" data-nn="${escH(n.id)}" transform="translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})" opacity="${dim?.3:1}" style="cursor:pointer"><circle r="${r.toFixed(1)}" fill="${netColor(n.id)}" stroke="${n.id===sel?"#000":"#fff"}" stroke-width="${n.id===sel?3:1.5}"/><text y="${(r+12).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" paint-order="stroke" stroke="var(--face,#C0C0C0)" stroke-width="3">${escH(n.id)}</text><title>${escH(n.id)}: ${n.falas} falas, ${n.cenas} cenas</title></g>`;}).join("")}</svg>`;};
  const info=()=>{if(!sel)return `<p class="muted" style="margin:0">Cada círculo é um personagem, do tamanho de quantas falas ele tem. As linhas ligam quem divide cenas; quanto mais grossa, mais cenas juntos. Clique num nome para ver com quem ele contracena; arraste para arrumar.</p>`;
    const l=D.edges.filter(e=>e.a===sel||e.b===sel).map(e=>({n:e.a===sel?e.b:e.a,w:e.w})).sort((a,b)=>b.w-a.w);const n=D.nodes.find(x=>x.id===sel);const sozinho=D.nodes.filter(x=>x.id!==sel&&!l.some(y=>y.n===x.id)).map(x=>x.id);
    return `<p style="margin:0"><b>${escH(sel)}</b> · ${n.falas} falas em ${n.cenas} cenas. Contracena com: ${l.map(x=>`${escH(x.n)} (${x.w})`).join(", ")||"ninguém"}.${sozinho.length&&l.length?` <span class="muted">Nunca divide cena com ${escH(sozinho.slice(0,6).join(", "))}${sozinho.length>6?"…":""}.</span>`:""}</p>`;};
  const draw=w=>{w.querySelector("#net-svg").innerHTML=svgOf();w.querySelector("#net-i").innerHTML=info();};
  const build=w=>{D=netData(scope);netLayout(D,W,Hh);if(sel&&!D.nodes.some(n=>n.id===sel))sel=null;draw(w);w.querySelector("#net-c").textContent=`${D.nodes.length} personagens · ${D.edges.length} ligações · ${D.eps} roteiro${D.eps>1?"s":""}`;};
  dialog({id:"netWin",title:`Rede de personagens — ${epCode(sc.meta)}`,width:820,modal:false,icon:"net",body:`<div class="row"><label class="row">Mostrar <select id="net-sc"><option value="ep">Este roteiro</option><option value="serie">A série inteira</option></select></label><span class="muted" id="net-c"></span><button type="button" class="btn sm" id="net-x" style="margin-left:auto">Salvar imagem (.svg)</button></div>
    <div class="mapbox" id="net-svg" style="color:var(--text)"></div><div id="net-i"></div>`,
    onOpen:w=>{build(w);w.querySelector("#net-sc").onchange=e=>{scope=e.target.value;build(w);};
      let drag=null;const box=w.querySelector("#net-svg");
      const pt=ev=>{const s=box.querySelector("svg");const r=s.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*Hh};};
      box.addEventListener("pointerdown",ev=>{const g=ev.target.closest("[data-nn]");if(!g)return;drag={id:g.dataset.nn,moved:false};box.setPointerCapture(ev.pointerId);});

function teleprompter(){const sc=cur();if(!sc)return;histCommit();
  const f=S.focusId&&findEl(S.focusId);let from=f?f.i:0;while(from>0&&sc.els[from].t!=="scene")from--;
  const lay=layOk(sc);const els=sc.els.map((e,i)=>({e,i})).filter(({e,i})=>i>=from&&e.x.trim()&&!["time","note"].includes(e.t));
  const cs=charStats(sc);let who=null;
  const P={speed:+(prefs.tpSpeed||3),size:+(prefs.tpSize||44),mirror:!!prefs.tpMirror,only:""};
  const text=els.map(({e,i})=>{let t=e.x;if(e.t==="scene")t=`CENA ${lay.info[i].label||lay.info[i].num} — ${e.x.toUpperCase()}`;if(e.t==="character"){who=baseName(e.x);t=e.x.toUpperCase();}else if(!["dialogue","paren"].includes(e.t))who=null;
    return `<p class="tp-${e.t}" data-who="${escH(["dialogue","paren","character"].includes(e.t)?who||"":"")}">${escH(t)}</p>`;}).join("");
  dialog({id:"tpWin",title:`Teleprompter — ${epCode(sc.meta)}`,width:980,modal:false,icon:"prompt",body:`<div class="row tp-ctl">
      <button type="button" class="btn" id="tp-play">▶ Rodar</button>
      <label class="row">Velocidade <input type="range" id="tp-v" min="1" max="12" value="${P.speed}"></label>
      <label class="row">Letra <input type="range" id="tp-f" min="24" max="96" step="2" value="${P.size}"></label>
      <label class="chk"><input type="checkbox" id="tp-m"${P.mirror?" checked":""}> Espelhar</label>
      <label class="row">Destacar <select id="tp-o"><option value="">ninguém</option>${cs.map(c=>`<option>${escH(c.name)}</option>`).join("")}</select></label>
      <button type="button" class="btn sm" id="tp-fs">Tela cheia</button><span class="tp-time" id="tp-t">0:00</span></div>
    <div class="tp-stage" id="tp-stage" tabindex="0" aria-label="Texto do teleprompter. Espaço roda e pausa; setas mudam a velocidade."><div class="tp-guide" aria-hidden="true"></div><div class="tp-count" id="tp-c" hidden></div><div class="tp-text" id="tp-x">${text}<p class="tp-end">— FIM —</p></div></div>
    <p class="muted" style="margin:0">Espaço roda e pausa · ↑ ↓ velocidade · + − tamanho da letra · Home volta ao começo · a faixa amarela é a linha de leitura.</p>`,
    onOpen:(w,close)=>{const st=w.querySelector("#tp-stage"),tx=w.querySelector("#tp-x"),view=w.ownerDocument.defaultView||window;let run=false,raf=0,last=0,el=0,acc=0;
      const apply=()=>{tx.style.fontSize=P.size+"px";st.classList.toggle("mirror",P.mirror);tx.querySelectorAll("p").forEach(p=>p.classList.toggle("tp-hi",!!P.only&&p.dataset.who===P.only));};apply();
      const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
      const tick=t=>{if(!run)return;const v=view;if(!last)last=t;const dt=Math.min(.1,(t-last)/1000);last=t;el+=dt;acc+=P.speed*P.size*.32*dt;if(acc>=1){const k=Math.floor(acc);st.scrollTop+=k;acc-=k;}
        w.querySelector("#tp-t").textContent=fmt(el);if(st.scrollTop+st.clientHeight>=st.scrollHeight-2){stop();}else raf=v.requestAnimationFrame(tick);};
      const play=()=>{if(run)return;const c=w.querySelector("#tp-c");let n=el?0:3;const go=()=>{c.hidden=true;run=true;last=0;w.querySelector("#tp-play").textContent="❚❚ Pausar";raf=view.requestAnimationFrame(tick);};
        if(!n)return go();c.hidden=false;c.textContent=n;const iv=view.setInterval(()=>{n--;if(n<=0){view.clearInterval(iv);go();}else c.textContent=n;},700);};
      const stop=()=>{run=false;view.cancelAnimationFrame(raf);w.querySelector("#tp-play").textContent="▶ Rodar";};
      w.querySelector("#tp-play").onclick=()=>{run?stop():play();st.focus();};
      w.querySelector("#tp-v").oninput=e=>{P.speed=+e.target.value;prefs.tpSpeed=P.speed;savePrefs();};
      w.querySelector("#tp-f").oninput=e=>{P.size=+e.target.value;prefs.tpSize=P.size;savePrefs();apply();};
      w.querySelector("#tp-m").onchange=e=>{P.mirror=e.target.checked;prefs.tpMirror=P.mirror;savePrefs();apply();};
      w.querySelector("#tp-o").onchange=e=>{P.only=e.target.value;apply();const first=[...tx.querySelectorAll("p.tp-hi")].find(p=>p.offsetTop>st.scrollTop);if(first&&!run)st.scrollTop=first.offsetTop-st.clientHeight*.3;};
      w.querySelector("#tp-fs").onclick=()=>{const d=st.ownerDocument;if(d.fullscreenElement){d.exitFullscreen();return;}const r=st.requestFullscreen&&st.requestFullscreen();if(r&&r.catch)r.catch(()=>toast("Este navegador não deixou abrir em tela cheia"));st.focus();};
      st.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();run?stop():play();}else if(e.key==="ArrowUp"){e.preventDefault();P.speed=Math.min(12,P.speed+1);w.querySelector("#tp-v").value=P.speed;}else if(e.key==="ArrowDown"){e.preventDefault();P.speed=Math.max(1,P.speed-1);w.querySelector("#tp-v").value=P.speed;}
        else if(e.key==="+"||e.key==="="){P.size=Math.min(96,P.size+4);w.querySelector("#tp-f").value=P.size;apply();}else if(e.key==="-"){P.size=Math.max(24,P.size-4);w.querySelector("#tp-f").value=P.size;apply();}else if(e.key==="Home"){e.preventDefault();st.scrollTop=0;el=0;w.querySelector("#tp-t").textContent="0:00";}});
      setTimeout(()=>st.focus(),60);},
    onClose:()=>{},buttons:[{label:"Fechar"}]});}

function plantsAll(sid){const out=[];for(const s of seriesEps(sid)){const lay=paginate(s);let scn=null;s.els.forEach((e,i)=>{if(e.t==="scene")scn=lay.info[i].label||lay.info[i].num;
    if(e.plant)out.push({kind:"p",id:e.plant.id,nome:e.plant.nome,ep:s,el:e,i,scn});if(e.colhe)for(const pid of e.colhe)out.push({kind:"c",id:pid,ep:s,el:e,i,scn});});}return out;}
function plantIndex(sid){const all=plantsAll(sid);const P=new Map();const order=new Map(sortedEps().map((s,i)=>[s.id,i]));
  for(const x of all)if(x.kind==="p")P.set(x.id,{id:x.id,nome:x.nome,where:x,colhe:[]});
  for(const x of all)if(x.kind==="c"){const p=P.get(x.id);if(p)p.colhe.push(x);}
  for(const p of P.values()){const po=[order.get(p.where.ep.id),p.where.i];p.antes=p.colhe.filter(c=>{const co=[order.get(c.ep.id),c.i];return co[0]<po[0]||(co[0]===po[0]&&co[1]<po[1]);});}
  return [...P.values()];}
