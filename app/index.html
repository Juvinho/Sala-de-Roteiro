function nameCorpus(extra){const set=new Set();for(const c of Object.values(S.chars))if(c.nome)set.add(c.nome);for(const s of Object.values(S.eps))for(const c of charStats(s))set.add(c.name);
  for(const w of String(extra||"").split(/[\s,;\n]+/))if(w.trim())set.add(w.trim());
  return [...set].map(n=>n.replace(/\(.*?\)/g,"").trim()).filter(n=>n&&!/^(TODOS|VOZ|ALUN[AO]S?|HOMEM|MULHER|POLICIAL|NARRADOR|LOCUTOR|SEGURANÇA|MÃE|PAI|ZELADOR|MENINO|MENINA|GUARDA)\b/i.test(n)).flatMap(n=>n.split(/\s+/)).map(w=>w.toLowerCase()).filter(w=>/^[\p{L}'-]{3,16}$/u.test(w));}
function nameModel(words){const Ms=[null];for(let k=1;k<=4;k++){const M=new Map();for(const w of words){const t="^".repeat(k)+w+"$";for(let i=0;i<t.length-k;i++){const key=t.slice(i,i+k),nx=t[i+k];if(!M.has(key))M.set(key,new Map());const m=M.get(key);m.set(nx,(m.get(nx)||0)+1);}}Ms.push(M);}return Ms;}
function nameGen(Ms,k,known,min,max,rnd){const mix={2:.45,3:.3,4:.2}[k]||.3;
  for(let tries=0;tries<400;tries++){let out="";for(let i=0;i<max+2;i++){let kk=k;if(rnd()<mix)kk=Math.max(1,k-1-(rnd()<.3?1:0));let m=null;
      while(kk>=1){const key=("^".repeat(kk)+out).slice(-kk);m=Ms[kk].get(key);if(m)break;kk--;}if(!m)break;
      let tot=0;for(const v of m.values())tot+=v;let r=rnd()*tot,ch="$";for(const [c,v] of m){r-=v;if(r<=0){ch=c;break;}}if(ch==="$"){if(out.length>=min)break;else continue;}out+=ch;}
    if(out.length>=min&&out.length<=max&&!known.has(out)&&!/(.)\1\1/.test(out)&&!/[^aeiouyàáâãéêíóôõúäëïöü]{4}/.test(out)&&/[aeiouyàáâãéêíóôõúäëïöü]/.test(out))return out;}return null;}
const capName=w=>w.replace(/(^|[-'])(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());
function namesDialog(){let seed=Date.now()%2147483647||7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

    const M=nameModel(words);const known=new Set(words);const out=new Set();for(let i=0;i<120&&out.size<24;i++){const n=nameGen(M,k,known,mn,mx,rnd);if(n)out.add(n);}
    w.querySelector("#ng-c").textContent=`aprendeu com ${words.length} nomes: ${words.slice(0,8).map(capName).join(", ")}${words.length>8?"…":""}`;

/* ---------- Continuidade (entra na Revisão) ---------- */
function continuity(sc){const out=[];const add=(sev,title,det,id)=>out.push({sev,title:"Continuidade: "+title,det,id,ep:sc.id});
  const lay=(sc===cur()&&S.lay&&S.lay.info.length===sc.els.length)?S.lay:paginate(sc);const list=scenesOf(sc,lay.info);let prev=null,afterAct=true;
  const MESMO=/MESMO INSTANTE|AO MESMO TEMPO|SIMULT/;const CONT=/^CONT[ÍI]NUO/;
  for(const x of list){if(!x.n){afterAct=true;continue;}const p=locParse(x.h);
    if(CONT.test(p.tod)&&afterAct&&!prev)add("warn","cena CONTÍNUO abrindo o roteiro",`Cena ${x.label||x.n} — ${x.h}: contínuo a quê?`,x.id);
    if(prev){const pp=locParse(prev.h);
      if(MESMO.test(p.tod)&&pp.loc!==p.loc){const both=[...x.chars].filter(c=>prev.chars.has(c));if(both.length)add("err","personagem em dois lugares ao mesmo tempo",`${both.join(", ")} fala${both.length>1?"m":""} na cena ${prev.label||prev.n} (${pp.loc}) e na ${x.label||x.n} (${p.loc}), marcada como ${p.tod}.`,x.id);}
      if(CONT.test(p.tod)&&prev.tc&&x.tc&&x.tc.a!==prev.tc.b)add("warn","cena contínua com tempo pulando",`A cena ${x.label||x.n} é CONTÍNUO, mas começa em ${mmss(x.tc.a)} e a anterior termina em ${mmss(prev.tc.b)}.`,x.tcId||x.id);
      const dn=t=>/NOITE|MADRUGADA|ANOITECER/.test(t)?"N":/DIA|MANHÃ|TARDE|AMANHECER/.test(t)?"D":"";
      if(CONT.test(p.tod)&&pp.ie&&p.ie&&dn(pp.tod)&&/\(.*(DIA|NOITE).*\)/.test(p.tod))add("info","CONTÍNUO com horário entre parênteses",`Cena ${x.label||x.n}: ${p.tod}. Confira se o horário bate com a cena ${prev.label||prev.n} (${pp.tod}).`,x.id);}
    prev=x;afterAct=false;}
  // análise técnica que não aparece mais no texto da cena
  const bySid=new Map();let sid=null;for(const e of sc.els){if(e.t==="scene")sid=e.id;if(sid){bySid.set(sid,(bySid.get(sid)||"")+" "+e.x.toLowerCase());}}
  for(const a of sc.meta.analise||[]){const t=bySid.get(a.sid);if(t===undefined){add("warn","item da análise numa cena que não existe mais",`“${a.item}” (${bdCat(a.cat)[1]}).`,"meta");continue;}if(!t.includes(String(a.item).toLowerCase()))add("info","item da análise sumiu do texto",`“${a.item}” (${bdCat(a.cat)[1]}) não aparece mais na cena onde foi marcado. Reescreveu?`,a.sid);}
  // personagem que fala antes de ser apresentado em maiúsculas numa ação
  const serAll=seriesEps(sc.meta.serieId),nums=new Set(serAll.map(z=>+z.meta.episodio));let completo=true;for(let k=1;k<+sc.meta.episodio;k++)if(!nums.has(k)){completo=false;break;}
  const seen=new Set(),warned=new Set();let who=null;if(completo)
  for(const e of sc.els){if(e.t==="action"||e.t==="scene"){for(const m of e.x.matchAll(/\b[\p{Lu}][\p{Lu}'-]{2,}\b/gu))seen.add(m[0]);}
    if(e.t==="character"){who=baseName(e.x);const first=who.split(/\s+/)[0];if(!seen.has(first)&&!seen.has(who)&&!warned.has(who)&&!/^(TODOS|VOZ|NARRADOR|LOCUTOR)/.test(who)){warned.add(who);
      const anyEp=sortedEps().filter(s=>s.meta.serieId===sc.meta.serieId&&(+s.meta.episodio<+sc.meta.episodio)).some(s=>s.els.some(z=>z.t==="character"&&baseName(z.x)===who));
      if(!anyEp)add("info",`${who} fala antes de ser apresentado`,`Na primeira vez, o costume é escrever o nome em MAIÚSCULAS numa ação (ex.: “${who}, 40 anos, entra.”).`,e.id);}}}
  // plantado e não colhido (só avisa no último episódio da série)
  const ser=seriesEps(sc.meta.serieId);if(ser.length&&ser[ser.length-1].id===sc.id){for(const p of plantIndex(sc.meta.serieId)){if(!p.colhe.length)add("info",`“${p.nome}” foi plantado e ainda não foi colhido`,`Plantado em ${epTag(p.where.ep.meta)}, cena ${p.where.scn||"–"}.`,p.where.ep.id===sc.id?p.where.el.id:"meta");else if(p.antes.length)add("warn",`“${p.nome}” é colhido antes de ser plantado`,`Plantado em ${epTag(p.where.ep.meta)}; colhido antes em ${p.antes.map(c=>epTag(c.ep.meta)).join(", ")}.`,"meta");}}
  return out;}

  const key=t=>`${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`;const today=new Date();today.setHours(12,0,0,0);
  const start=new Date(today);start.setDate(start.getDate()-7*52-start.getDay());
  const vals=Object.values(d).filter(v=>v>0).sort((a,b)=>a-b);const q=p=>vals.length?vals[Math.min(vals.length-1,Math.floor(p*vals.length))]:1;const lv=v=>!v?0:v<q(.25)?1:v<q(.5)?2:v<q(.8)?3:4;
  let cells="",col=0,months="";const CW=13;for(let t=new Date(start);t<=today;t.setDate(t.getDate()+1)){const k=key(t),v=d[k]||0,dow=t.getDay();

async function mapShrink(file){const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("imagem inválida"));i.src=url;});
  let max=1600,q=.82,out=null,w=0,h=0;for(let t=0;t<8;t++){const k=Math.min(1,max/Math.max(img.width,img.height));w=Math.round(img.width*k);h=Math.round(img.height*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);out=c.toDataURL("image/jpeg",q);
    if(out.length<235000)break;if(q>.55)q-=.1;else max=Math.round(max*.82);}
  return {img:out,w,h,atualizado:Date.now()};}

/* ================= ÁRVORE DE RELAÇÕES ================= */
function relKind(t){t=semAcento(t||"").trim();
  if(/^(bisav[oó]|bisavo)/.test(t))return {k:"pai",g:3};if(/^(av[oóô]|avo|avó)/.test(t))return {k:"pai",g:2};
  if(/^(pai|mae|padrasto|madrasta|tutor|tutora)\b/.test(t))return {k:"pai",g:1};
  if(/^(bisnet)/.test(t))return {k:"filho",g:3};if(/^(net[oa])\b/.test(t))return {k:"filho",g:2};if(/^(filh[oa]|entead[oa])\b/.test(t))return {k:"filho",g:1};
  if(/^(irma|irmao|meio-irm|gemea|gemeo)/.test(t))return {k:"irmao"};if(/^(prim[oa])\b/.test(t))return {k:"primo"};if(/^(tio|tia)\b/.test(t))return {k:"pai",g:1,lateral:1};if(/^(sobrinh)/.test(t))return {k:"filho",g:1,lateral:1};
  if(/(marido|esposa|mulher de|casad|noiv|viuv|conjuge)/.test(t))return {k:"casal"};
  if(/(amante|apaixonad|namorad|\bama\b|paixao|ex-)/.test(t))return {k:"amor"};if(/(inimig|odeia|rival|matou|mata |traiu|trai |vinganca)/.test(t))return {k:"inimigo"};
  if(/(amig|aliad|confia|parceir|protege|leal)/.test(t))return {k:"aliado"};if(/(chefe|patra|superior|mentor|professor|diretor|comanda|mestre|lider)/.test(t))return {k:"chefe"};
  return {k:"outro"};}
const REL_COR={amor:"#D02070",inimigo:"#C00000",aliado:"#20A040",chefe:"#3050D0",outro:"#808080",primo:"#A07000"};
function relData(){const chars=seriesChars();const idx=new Map(chars.map(c=>[c.id,c]));const fam=[],outras=[];
  for(const c of chars)for(const r of c.relacoes||[]){if(!idx.has(r.alvo)||r.alvo===c.id)continue;const k=relKind(r.tipo);
    if(k.k==="pai")fam.push({a:c.id,b:r.alvo,t:"pai",g:k.g,lat:k.lateral,txt:r.tipo});else if(k.k==="filho")fam.push({a:r.alvo,b:c.id,t:"pai",g:k.g,lat:k.lateral,txt:r.tipo});
    else if(k.k==="irmao"||k.k==="casal")fam.push({a:c.id,b:r.alvo,t:k.k,txt:r.tipo});else outras.push({a:c.id,b:r.alvo,t:k.k,txt:r.tipo});}
  const ids=new Set([...fam,...outras].flatMap(r=>[r.a,r.b]));const gen=new Map([...ids].map(i=>[i,0]));
  for(let it=0;it<60;it++){let ch=false;for(const r of fam){const ga=gen.get(r.a),gb=gen.get(r.b);
      if(r.t==="pai"){const want=ga+(r.g||1);if(gb<want){gen.set(r.b,want);ch=true;}else if(gb>want&&!r.lat){gen.set(r.a,gb-(r.g||1));ch=true;}}
      else{const m=Math.max(ga,gb);if(ga!==m){gen.set(r.a,m);ch=true;}if(gb!==m){gen.set(r.b,m);ch=true;}}}if(!ch)break;}
  const famIds=new Set(fam.flatMap(r=>[r.a,r.b]));const min=Math.min(0,...[...gen.values()]);for(const [k,v] of gen)gen.set(k,v-min);
  return {idx,fam,outras,ids:[...ids],gen,famIds};}

    const defs=`<defs>${Object.entries(REL_COR).map(([k,c])=>`<marker id="rA-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="${c}"/></marker>`).join("")}</defs>`;
    return {D,svg:`<svg viewBox="0 0 ${W} ${H}" width="100%" class="relsvg" role="img" aria-label="Árvore de relações">${defs}${labels}${links}${arcs}${nodes}</svg>`};};
  const draw=w=>{const {D,svg}=build();w.querySelector("#rl-svg").innerHTML=svg||`<div class="empty">${icon("tree",32)}Nenhuma relação nas fichas ainda. Abra o Elenco › ficha › Relações e escreva “pai de”, “irmã de”, “casada com”, “inimigo de”…</div>`;

function vozData(scope){const sc=cur();const eps=scope==="serie"?seriesEps(sc.meta.serieId):[sc];const P=new Map();let who=null;
  for(const s of eps)for(const e of s.els){if(e.t==="character"){who=baseName(e.x);continue;}if(e.t==="dialogue"&&who){let p=P.get(who);if(!p)P.set(who,p={nome:who,falas:[],pal:new Map(),n:0});p.falas.push(e.x);
      for(const w of (e.x.toLowerCase().match(/[\p{L}'-]+/gu)||[])){p.n++;if(w.length>2&&!VOZ_PARAR.has(w))p.pal.set(w,(p.pal.get(w)||0)+1);}}else if(e.t!=="paren")who=null;}
  const all=[...P.values()].filter(p=>p.falas.length>=5);const df=new Map();for(const p of all)for(const w of p.pal.keys())df.set(w,(df.get(w)||0)+1);
  for(const p of all){const f=p.falas;const words=f.join(" ").toLowerCase().match(/[\p{L}'-]+/gu)||[];
    p.media=words.length/f.length;p.perg=f.filter(x=>/\?/.test(x)).length/f.length;p.excl=f.filter(x=>/!/.test(x)).length/f.length;p.ret=f.filter(x=>/…|\.\.\./.test(x)).length/f.length;
    const sample=words.slice(0,400);p.riqueza=sample.length?new Set(sample).size/sample.length:0;p.eu=words.filter(w=>w==="eu"||w==="meu"||w==="minha").length/Math.max(1,words.length)*100;
    p.marca=[...p.pal].map(([w,c])=>[w,c*Math.log((all.length+1)/(df.get(w)||1))]).filter(([w,s])=>p.pal.get(w)>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);
    p.curta=[...f].sort((a,b)=>a.length-b.length).find(x=>x.length>8)||f[0];p.longa=[...f].sort((a,b)=>b.length-a.length)[0];}
  const vec=p=>[p.media/12,p.perg*2,p.excl*2,p.ret*2,p.riqueza*2,p.eu/4];const pares=[];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=vec(all[i]),b=vec(all[j]);const d=Math.sqrt(a.reduce((s,x,k)=>s+(x-b[k])**2,0));
    const A=all[i].pal,B=all[j].pal;let dot=0,na=0,nb=0;for(const [w,c] of A){na+=c*c;if(B.has(w))dot+=c*B.get(w);}for(const c of B.values())nb+=c*c;const cos=dot/Math.sqrt((na||1)*(nb||1));
    pares.push({a:all[i].nome,b:all[j].nome,sim:Math.max(0,1-d)*.6+cos*.4});}
  pares.sort((x,y)=>y.sim-x.sim);return {list:all.sort((a,b)=>b.falas.length-a.falas.length),pares};}

const u16pdf=str=>"<FEFF"+[...String(str)].map(ch=>{const c=ch.codePointAt(0);if(c>0xFFFF){const v=c-0x10000;return ((0xD800+(v>>10)).toString(16)+(0xDC00+(v&1023)).toString(16)).toUpperCase();}return c.toString(16).padStart(4,"0").toUpperCase();}).join("")+">";
async function pdfDoc(pagesOps,wpt,hpt,title){const enc=new TextEncoder();const objs=[];const add=s=>{objs.push(s);return objs.length;};const cat=add(null),pgs=add(null);
  const fonts=["Courier","Courier-Bold","Courier-Oblique"].map(n=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${n} /Encoding /WinAnsiEncoding >>`));const res=`<< /Font << /F1 ${fonts[0]} 0 R /F2 ${fonts[1]} 0 R /F3 ${fonts[2]} 0 R >> >>`;const kids=[];
  for(const ops of pagesOps){let data=enc.encode(ops),filter="";if(typeof CompressionStream!=="undefined"){try{data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream("deflate"))).arrayBuffer());filter=" /Filter /FlateDecode";}catch(e){data=enc.encode(ops);filter="";}}
    const c=add({head:`<< /Length ${data.length}${filter} >>\nstream\n`,data,tail:"\nendstream"});kids.push(add(`<< /Type /Page /Parent ${pgs} 0 R /MediaBox [0 0 ${wpt.toFixed(2)} ${hpt.toFixed(2)}] /Resources ${res} /Contents ${c} 0 R >>`));}
  objs[cat-1]=`<< /Type /Catalog /Pages ${pgs} 0 R >>`;objs[pgs-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;const info=add(`<< /Title ${u16pdf(title)} /Creator (ScriptRoom) /Producer (ScriptRoom) >>`);
  const parts=[enc.encode("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n")];let off=parts[0].length;const offs=[];
  objs.forEach((ob,i)=>{offs.push(off);const h=enc.encode(`${i+1} 0 obj\n`);parts.push(h);off+=h.length;if(typeof ob==="string"){const b=enc.encode(ob);parts.push(b);off+=b.length;}else{const hh=enc.encode(ob.head),t=enc.encode(ob.tail);parts.push(hh,ob.data,t);off+=hh.length+ob.data.length+t.length;}const e=enc.encode("\nendobj\n");parts.push(e);off+=e.length;});
  parts.push(enc.encode(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(x=>String(x).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${off}\n%%EOF\n`));
  return new Blob(parts,{type:"application/pdf"});}
const rgbOf=hex=>{const m=/^#?([0-9a-f]{6})$/i.exec(hex||"");if(!m)return [0.75,0.75,0.75];const n=parseInt(m[1],16);return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(x=>x.toFixed(3));};
async function cardsPDF(sc,o){const lay=paginate(sc);const list=scenesOf(sc,lay.info).filter(x=>x.n&&(!o.ato||x.act===o.ato));const PW=595.28,PH=841.89,CW=PW/2,CH=PH/2;const pages=[];let ops=null;
  const T=(x,y,sz,f,s,col)=>{ops.push(`BT /${f} ${sz} Tf ${col||"0 0 0"} rg 1 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)} Tm ${pdfStr(s)} Tj ET`);};
  list.forEach((x,i)=>{const k=i%4;if(k===0){ops=[];pages.push(ops);ops.push(`q [4 4] 0 d 0.4 w 0.6 G ${CW} 0 m ${CW} ${PH} l S 0 ${CH} m ${PW} ${CH} l S Q`);}
    const cx=(k%2)*CW,cy=PH-(Math.floor(k/2)+1)*CH;const M=22;const [r,g,b]=rgbOf(x.cor);
    ops.push(`${r} ${g} ${b} rg ${cx+M} ${cy+CH-M-12} ${CW-2*M} 12 re f`);
    let y=cy+CH-M-46;T(cx+M,y,28,"F2",String(x.label||x.n));const lab=`${x.tc?x.tcRaw.replace(/[\[\]]/g,"")+"  ":""}${e8(eighthsN(x.lines,lay.lpp))} pág.`;T(cx+CW-M-lab.length*9*.6,y+12,9,"F1",lab,"0.35 0.35 0.35");
    y-=24;for(const ln of wrapLines(String(x.h||"").toUpperCase(),Math.floor((CW-2*M)/(11*.6))).slice(0,3)){T(cx+M,y,11,"F2",ln);y-=14;}
    if(x.act){T(cx+M,y,8,"F3",String(x.act).toUpperCase(),"0.4 0.4 0.4");y-=14;}
    const ch=[...x.chars].join(", ");if(ch){for(const ln of wrapLines(ch,Math.floor((CW-2*M)/(9*.6))).slice(0,2)){T(cx+M,y,9,"F1",ln,"0 0 0.5");y-=12;}y-=6;}
    ops.push(`q 0.5 w 0.75 G ${cx+M} ${y+8} m ${cx+CW-M} ${y+8} l S Q`);y-=8;
    const syn=String(x.syn||x.first||"").trim();const mx=Math.floor((y-(cy+M+18))/13);for(const ln of wrapLines(syn||"—",Math.floor((CW-2*M)/(10*.6))).slice(0,Math.max(1,mx))){T(cx+M,y,10,"F1",ln);y-=13;}
    T(cx+M,cy+M,7,"F1",`${String(sc.meta.serie).toUpperCase()} · ${epCode(sc.meta)}`,"0.5 0.5 0.5");});
  if(!pages.length)return null;return pdfDoc(pages.map(p=>p.join("\n")),PW,PH,`Cartões · ${sc.meta.serie} ${epCode(sc.meta)}`);}

function sfxKeyFromText(t) {
  if (!t || typeof t !== "string") return null;
  const m = /(?:\(|\[)?(?:SFX|SOM)[:\s]+([^()\]\n]+)(?:\)|\])?/i.exec(t);
  if (!m) return null;
  const s = m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (/trovao|chuva|tempestade|raio/.test(s)) return "trovao";
  if (/tiro|disparo|revolver|bala|pistola|arma/.test(s)) return "tiro";
  if (/telefone|trim|toca|ligacao|chamada/.test(s)) return "telefone";
  if (/campainha|ding|interfone/.test(s)) return "campainha";
  if (/porta|bate|range|tranca/.test(s)) return "porta";
  if (/passo|passos|sapato|corredor/.test(s)) return "passos";
  if (/radio|estatica|chiado|sintonia|transmissao/.test(s)) return "radio";
  if (/coracao|batimento|pulso|palpitacao/.test(s)) return "coracao";
  if (/claque|palma|riso|gargalhada|plateia|publico/.test(s)) return "claque";
  if (/gongo|suspense|impacto|acorde|stinger|misterio/.test(s)) return "gongo";
  if (/maquina|tecla|datilografia|claque-claque/.test(s)) return "maquina";
  if (/sirene|policia|resgate|ambulancia|viatura/.test(s)) return "sirene";
  return "gongo";
}

let foleyAC = null;
function getFoleyAC() {
  if (!foleyAC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) foleyAC = new C();
  }
  if (foleyAC && foleyAC.state === "suspended") foleyAC.resume();
  return foleyAC;
}

function playFoley(tipo, opts) {
  const ac = getFoleyAC();
  if (!ac) return;
  opts = Object.assign({ vol: +(prefs.foleyVol !== undefined ? prefs.foleyVol : 0.75), pitch: +(prefs.foleyPitch || 0), eco: +(prefs.foleyEco !== undefined ? prefs.foleyEco : 0.25) }, opts || {});
  const master = ac.createGain();
  master.gain.value = Math.max(0, Math.min(1, opts.vol));

  if (opts.eco > 0.05) {
    const delay = ac.createDelay();
    delay.delayTime.value = 0.22;
    const fb = ac.createGain();
    fb.gain.value = Math.min(0.65, opts.eco * 0.7);
    master.connect(delay);
    delay.connect(fb);
    fb.connect(delay);
    delay.connect(ac.destination);
  }
  master.connect(ac.destination);

  const t = ac.currentTime;
  const pitchMult = Math.pow(2, opts.pitch / 12);

  function makeNoiseBuffer(dur) {
    const sz = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, sz, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < sz; i++) data[i] = (Math.random() * 2 - 1);
    return buf;
  }

  switch(tipo) {
    case "trovao": {
      const dur = 3.2;
      const noise = ac.createBufferSource();
      noise.buffer = makeNoiseBuffer(dur);
      const filter = ac.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(450 * pitchMult, t);
      filter.frequency.exponentialRampToValueAtTime(55 * pitchMult, t + dur);

      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.01, t);
      gain.gain.linearRampToValueAtTime(0.95, t + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.35, t + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

      noise.connect(filter); filter.connect(gain); gain.connect(master);
      noise.start(t);
      break;
    }
    case "tiro": {
      const dur = 1.1;
      const noise = ac.createBufferSource();
      noise.buffer = makeNoiseBuffer(dur);
      const band = ac.createBiquadFilter();
      band.type = "bandpass";
      band.frequency.setValueAtTime(950 * pitchMult, t);
      band.Q.value = 1.6;

      const nGain = ac.createGain();
      nGain.gain.setValueAtTime(1.0, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + dur);

      const osc = ac.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(240 * pitchMult, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.16);
      const oGain = ac.createGain();
      oGain.gain.setValueAtTime(0.85, t);
      oGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      noise.connect(band); band.connect(nGain); nGain.connect(master);
      osc.connect(oGain); oGain.connect(master);
      noise.start(t); osc.start(t); osc.stop(t + 0.2);
      break;
    }
    case "telefone": {
      const dur = 1.6;
      [440, 480].forEach(f => {
        const osc = ac.createOscillator();
        osc.frequency.value = f * pitchMult;
        const g = ac.createGain();
        for (let i = 0; i < 18; i++) {
          const tP = t + i * 0.07;
          g.gain.setValueAtTime(0.3, tP);
          g.gain.setValueAtTime(0.01, tP + 0.035);
        }
        g.gain.setValueAtTime(0, t + dur);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + dur);
      });
      break;
    }
    case "campainha": {
      const notas = [{ f: 659, tOff: 0, d: 1.1 }, { f: 554, tOff: 0.45, d: 1.3 }];
      notas.forEach(n => {
        const osc = ac.createOscillator();
        osc.type = "sine";
        osc.frequency.value = n.f * pitchMult;
        const g = ac.createGain();
        const start = t + n.tOff;
        g.gain.setValueAtTime(0.001, start);
        g.gain.linearRampToValueAtTime(0.65, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + n.d);
        osc.connect(g); g.connect(master);
        osc.start(start); osc.stop(start + n.d);
      });
      break;
    }
    case "porta": {
      const osc = ac.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140 * pitchMult, t);
      osc.frequency.linearRampToValueAtTime(260 * pitchMult, t + 0.5);
      osc.frequency.linearRampToValueAtTime(90 * pitchMult, t + 0.9);
      const flt = ac.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 650;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.2, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.95);
      osc.connect(flt); flt.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + 0.95);

      const n = ac.createBufferSource();
      n.buffer = makeNoiseBuffer(0.3);
      const nFlt = ac.createBiquadFilter();
      nFlt.type = "lowpass"; nFlt.frequency.value = 260;
      const nG = ac.createGain();
      nG.gain.setValueAtTime(0.001, t + 0.95);
      nG.gain.linearRampToValueAtTime(0.9, t + 0.97);
      nG.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
      n.connect(nFlt); nFlt.connect(nG); nG.connect(master);
      n.start(t + 0.95);
      break;
    }
    case "passos": {
      for (let i = 0; i < 4; i++) {
        const stepT = t + i * 0.42;
        const n = ac.createBufferSource();
        n.buffer = makeNoiseBuffer(0.15);
        const f = ac.createBiquadFilter();
        f.type = "bandpass"; f.frequency.value = (180 + (i % 2) * 45) * pitchMult; f.Q.value = 3;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.001, stepT);
        g.gain.linearRampToValueAtTime(0.55, stepT + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, stepT + 0.12);
        n.connect(f); f.connect(g); g.connect(master);
        n.start(stepT);
      }
      break;
    }
    case "radio": {
      const dur = 1.8;
      const n = ac.createBufferSource();
      n.buffer = makeNoiseBuffer(dur);
      const f = ac.createBiquadFilter();
      f.type = "bandpass"; f.frequency.setValueAtTime(1400 * pitchMult, t);
      f.frequency.linearRampToValueAtTime(950 * pitchMult, t + dur);
      f.Q.value = 4;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + dur);
      n.connect(f); f.connect(g); g.connect(master);
      n.start(t);

      const osc = ac.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1200 * pitchMult, t);
      osc.frequency.linearRampToValueAtTime(800 * pitchMult, t + dur);
      const og = ac.createGain();
      og.gain.setValueAtTime(0.08, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(og); og.connect(master);
      osc.start(t); osc.stop(t + dur);
      break;
    }
    case "coracao": {
      for (let i = 0; i < 3; i++) {
        const bT = t + i * 0.85;
        const o1 = ac.createOscillator();
        o1.type = "sine"; o1.frequency.setValueAtTime(65 * pitchMult, bT);
        o1.frequency.exponentialRampToValueAtTime(35, bT + 0.12);
        const g1 = ac.createGain();
        g1.gain.setValueAtTime(0.65, bT); g1.gain.exponentialRampToValueAtTime(0.001, bT + 0.15);
        o1.connect(g1); g1.connect(master);
        o1.start(bT); o1.stop(bT + 0.16);

        const bT2 = bT + 0.18;
        const o2 = ac.createOscillator();
        o2.type = "sine"; o2.frequency.setValueAtTime(55 * pitchMult, bT2);
        o2.frequency.exponentialRampToValueAtTime(30, bT2 + 0.12);
        const g2 = ac.createGain();
        g2.gain.setValueAtTime(0.45, bT2); g2.gain.exponentialRampToValueAtTime(0.001, bT2 + 0.15);
        o2.connect(g2); g2.connect(master);
        o2.start(bT2); o2.stop(bT2 + 0.16);
      }
      break;
    }
    case "claque": {
      const dur = 2.4;
      const n = ac.createBufferSource();
      n.buffer = makeNoiseBuffer(dur);
      const f = ac.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 1100 * pitchMult; f.Q.value = 1.2;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.01, t);
      g.gain.linearRampToValueAtTime(0.6, t + 0.35);
      g.gain.setValueAtTime(0.5, t + 1.2);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      n.connect(f); f.connect(g); g.connect(master);
      n.start(t);
      break;
    }
    case "gongo": {
      const dur = 2.8;
      const parciais = [98, 147, 212, 335, 480];
      parciais.forEach((freq, idx) => {
        const osc = ac.createOscillator();
        osc.type = idx % 2 === 0 ? "sine" : "triangle";
        osc.frequency.value = freq * pitchMult;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.35 / (idx + 1), t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur - idx * 0.3);
        osc.connect(g); g.connect(master);
        osc.start(t); osc.stop(t + dur);
      });
      break;
    }
    case "maquina": {
      const clackBuf = makeNoiseBuffer(0.05);
      const n = ac.createBufferSource(); n.buffer = clackBuf;
      const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2200;
      const g = ac.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
      n.connect(f); f.connect(g); g.connect(master);
      n.start(t);

      const bell = ac.createOscillator();
      bell.type = "sine"; bell.frequency.value = 2100 * pitchMult;
      const bg = ac.createGain();
      bg.gain.setValueAtTime(0.001, t + 0.08);
      bg.gain.linearRampToValueAtTime(0.45, t + 0.09);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      bell.connect(bg); bg.connect(master);
      bell.start(t + 0.08); bell.stop(t + 0.8);
      break;
    }
    case "sirene": {
      const dur = 2.2;
      const osc = ac.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(550 * pitchMult, t);
      osc.frequency.linearRampToValueAtTime(920 * pitchMult, t + 0.6);
      osc.frequency.linearRampToValueAtTime(550 * pitchMult, t + 1.2);
      osc.frequency.linearRampToValueAtTime(920 * pitchMult, t + 1.8);
      const flt = ac.createBiquadFilter(); flt.type = "lowpass"; flt.frequency.value = 1600;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.3, t);
      g.gain.setValueAtTime(0.3, t + 1.8);
      g.gain.exponentialRampToValueAtTime(0.01, t + dur);
      osc.connect(flt); flt.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + dur);
      break;
    }
  }
}

sheet.addEventListener("click", e => {
  const n = e.target.closest && e.target.closest(".el");
  if (!n || !n.dataset.sfx) return;
  const rect = n.getBoundingClientRect();
  if (e.clientX > rect.right - 80 || e.altKey) {
    e.stopPropagation();
    playFoley(n.dataset.sfx);
    const it = FOLEY_ITEMS.find(x => x.k === n.dataset.sfx);
    toast("🔊 Efeito sonoro: " + (it ? it.rotulo : n.dataset.sfx));
  }
});

              <button type="button" class="btn" data-fins="${it.k}" title="Inserir marca (SFX: ...) no roteiro">+ Inserir</button>

      <p class="muted" style="margin:0">Dica: Escreva <code>(SFX: TROVÃO)</code> ou <code>(SFX: TIRO)</code> no texto para criar um botão sonoro interativo na página.</p>
    </div>
  `;
  dialog({
    id: "foleyWin",
    title: "Mesa de sonoplastia — Foley Sound Blaster 16",
    width: 680,
    modal: false,
    icon: "foley",
    body,
    onOpen: (w) => {
      const getOpts = () => ({
        vol: (+w.querySelector("#fol-vol").value) / 100,
        pitch: +w.querySelector("#fol-pit").value,
        eco: (+w.querySelector("#fol-eco").value) / 100
      });
      w.querySelectorAll("#fol-vol, #fol-pit, #fol-eco").forEach(el => {
        el.oninput = () => {
          prefs.foleyVol = +w.querySelector("#fol-vol").value;
          prefs.foleyPitch = +w.querySelector("#fol-pit").value;
          prefs.foleyEco = +w.querySelector("#fol-eco").value;
          savePrefs();
        };
      });
      w.addEventListener("click", e => {
        const bp = e.target.closest("[data-fplay]");
        if (bp) {
          playFoley(bp.dataset.fplay, getOpts());
          return;
        }
        const bi = e.target.closest("[data-fins]");
        if (bi) {
          const item = FOLEY_ITEMS.find(x => x.k === bi.dataset.fins);
          if (!item || !cur()) return;
          const f = S.focusId && findEl(S.focusId);
          const tag = `(SFX: ${item.rotulo.toUpperCase()})`;
          if (f) {
            f.e.x = f.e.x ? f.e.x + " " + tag : tag;
            touch(false);
            renderSheet();
            focusEl(f.e.id, "end");
          } else {
            const sc = cur();
            sc.els.push({ id: uid(), t: "action", x: tag });
            touch(true);
            renderSheet();
          }
          toast(`Efeito "${item.rotulo}" inserido no roteiro!`);
        }
      });
    }
  });
}

function calcRitmo(sc) {
  const lay = layOk(sc);
  const scenes = scenesOf(sc, lay.info).filter(x => x.n);
  const actScenes = new Map();
  let actCur = "ATO UM";

  const tensionKeywords = /morte|arma|tiro|policia|assassino|sangue|perigo|mentira|traicao|segredo|odeio|amor|culpa|verdade|fugir|socorro|pare|nunca|urgente|depressa|atencao/i;

  const pts = scenes.map((scItem, idx) => {
    let act = scItem.act || actCur;
    if (scItem.act) actCur = scItem.act;
    if (!actScenes.has(act)) actScenes.set(act, []);
    actScenes.get(act).push(scItem);

    const fromIdx = sc.els.findIndex(e => e.t === "scene" && e.x === scItem.h);
    let wordsDial = 0, wordsAct = 0, questions = 0, excls = 0, conflictHits = 0;
    if (fromIdx >= 0) {
      for (let k = fromIdx + 1; k < sc.els.length && sc.els[k].t !== "scene"; k++) {
        const el = sc.els[k];
        const txt = el.x || "";
        const wCount = (txt.match(/\S+/g) || []).length;
        if (el.t === "dialogue") wordsDial += wCount;
        else if (el.t === "action") wordsAct += wCount;
        questions += (txt.match(/\?/g) || []).length;
        excls += (txt.match(/!/g) || []).length;
        if (tensionKeywords.test(txt)) conflictHits += (txt.match(new RegExp(tensionKeywords.source, "gi")) || []).length;
        if (sfxKeyFromText(txt)) conflictHits += 2;
      }
    }
    const totWords = Math.max(1, wordsDial + wordsAct);
    const dialRatio = wordsDial / totWords;

    let score = 32;
    if (/NOITE|MADRUGADA/i.test(scItem.h)) score += 10;
    if (/EXT\./i.test(scItem.h)) score += 5;
    score += Math.min(30, conflictHits * 4);
    score += Math.min(20, (questions + excls) * 3);
    if (dialRatio > 0.35 && dialRatio < 0.75) score += 6;

    score = Math.max(12, Math.min(96, Math.round(score)));

    let bpm = 70 + Math.round(score * 0.95);
    let ritmoNome = "Moderado (Andante)";
    if (bpm >= 135) ritmoNome = "Frenético (Presto)";
    else if (bpm >= 110) ritmoNome = "Ágil (Allegro)";
    else if (bpm < 85) ritmoNome = "Lento (Adagio)";

    return {
      idx: idx + 1,
      label: scItem.label || scItem.n,
      h: scItem.h,
      act,
      score,
      bpm,
      ritmoNome,
      dialRatio: Math.round(dialRatio * 100),
      words: totWords,
      syn: scItem.syn || scItem.first || ""
    };
  });

  const actHooks = [];
  for (const [actName, scList] of actScenes.entries()) {
    if (!scList.length) continue;
    const lastSc = scList[scList.length - 1];
    const pt = pts.find(p => p.h === lastSc.h) || pts[pts.length - 1];
    const isStrong = pt.score >= 60;
    actHooks.push({
      act: actName,
      lastScene: pt.label,
      score: pt.score,
      isStrong,
      msg: isStrong ? `Gancho Forte (${pt.score}%) — Excelente clímax para o comercial.` : `Aviso: Gancho Fraco (${pt.score}%) — Risco de dispersão do público no intervalo.`
    });
  }

  const mediaTensao = pts.length ? Math.round(pts.reduce((a, b) => a + b.score, 0) / pts.length) : 0;
  const mediaBPM = pts.length ? Math.round(pts.reduce((a, b) => a + b.bpm, 0) / pts.length) : 0;

  return { pts, actHooks, mediaTensao, mediaBPM };
}

function ritmoDialog() {
  const sc = cur();
  if (!sc) return;
  const R = calcRitmo(sc);
  if (!R.pts.length) {
    toast("O roteiro ainda não tem cenas para analisar.");
    return;
  }

  const W = 720, H = 150, padX = 35, padY = 20;
  const effW = W - padX * 2, effH = H - padY * 2;
  const n = R.pts.length;
  const stepX = n > 1 ? effW / (n - 1) : effW;

  const coords = R.pts.map((pt, i) => {
    const x = padX + (n > 1 ? i * stepX : effW / 2);
    const y = H - padY - (pt.score / 100) * effH;
    return { x, y, pt };
  });

  const pathD = coords.reduce((acc, c, i) => acc + (i === 0 ? `M${c.x},${c.y}` : ` L${c.x},${c.y}`), "");
  const areaD = pathD ? `${pathD} L${coords[coords.length - 1].x},${H - padY} L${coords[0].x},${H - padY} Z` : "";

  const svgHTML = `
    <svg class="ritmo-svg" viewBox="0 0 ${W} ${H}">
      <line x1="${padX}" y1="${padY}" x2="${W - padX}" y2="${padY}" stroke="#0a2a14" stroke-dasharray="2 3"/>
      <line x1="${padX}" y1="${padY + effH * 0.25}" x2="${W - padX}" y2="${padY + effH * 0.25}" stroke="#0a2a14" stroke-dasharray="2 3"/>
      <line x1="${padX}" y1="${padY + effH * 0.5}" x2="${W - padX}" y2="${padY + effH * 0.5}" stroke="#0a2a14" stroke-dasharray="2 3"/>
      <line x1="${padX}" y1="${padY + effH * 0.75}" x2="${W - padX}" y2="${padY + effH * 0.75}" stroke="#0a2a14" stroke-dasharray="2 3"/>
      <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="#134723"/>

      <path d="${areaD}" fill="rgba(0, 255, 100, 0.08)"/>
      <path d="${pathD}" fill="none" stroke="#00ff66" stroke-width="2.2"/>

      ${coords.map(c => `
        <circle cx="${c.x}" cy="${c.y}" r="4" fill="#030f07" stroke="#00ff66" stroke-width="2" class="ritmo-node" data-sc="${escH(c.pt.label)}" style="cursor:pointer">
          <title>Cena ${escH(c.pt.label)}: ${c.pt.score}% de Tensão (${escH(c.pt.ritmoNome)})&#10;${escH(c.pt.h)}</title>
        </circle>
        <text x="${c.x}" y="${H - 5}" fill="#558866" font-size="8.5" text-anchor="middle" font-family="monospace">${escH(c.pt.label)}</text>
      `).join("")}
    </svg>
  `;

  const body = `
    <div class="ritmo-crt">
      <div class="ritmo-head">
        <span>SISTEMA DE ANÁLISE DE TENSÃO DRAMÁTICA · ARQUITETURA 1995</span>
        <span>OSCILOSCÓPIO ATIVO</span>
      </div>
      ${svgHTML}
      <div class="ritmo-stats">
        <div class="ritmo-stat"><span>Média de Tensão</span><b>${R.mediaTensao}%</b><small class="muted">Escala dramática</small></div>
        <div class="ritmo-stat"><span>BPM Médio</span><b>${R.mediaBPM}</b><small class="muted">Andamento do texto</small></div>
        <div class="ritmo-stat"><span>Total de Cenas</span><b>${R.pts.length}</b><small class="muted">Neste episódio</small></div>
        <div class="ritmo-stat"><span>Ganchos de Intervalo</span><b>${R.actHooks.filter(h => h.isStrong).length} / ${R.actHooks.length}</b><small class="muted">Atos com clímax</small></div>
      </div>
      <div class="ritmo-acts">
        <b style="font-size:11px;color:#000080;margin-bottom:2px">Auditoria de Ganchos de Intervalo Comercial (Quebra de Atos):</b>
        ${R.actHooks.map(h => `
          <div class="ritmo-act-row">
            <span><b>${escH(h.act)}</b> (saída na Cena ${escH(h.lastScene)})</span>
            <span class="${h.isStrong ? "badge-hook-ok" : "badge-hook-warn"}">${escH(h.msg)}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  dialog({
    id: "ritmoWin",
    title: `Ritmo dramático e curva de tensão — ${epCode(sc.meta)}`,
    width: 760,
    modal: false,
    icon: "ritmo",
    body,
    onOpen: (w) => {
      w.querySelectorAll(".ritmo-node").forEach(el => {
        el.onclick = () => {
          const lbl = el.dataset.sc;
          const lay = layOk(sc);
          const idx = sc.els.findIndex((e, i) => e.t === "scene" && (lay.info[i].label === lbl || String(lay.info[i].num) === lbl));
          if (idx >= 0) {
            if (S.view !== "page") setMode("page");
            gotoEl(sc.els[idx].id);
            toast(`Navegando para Cena ${lbl}`);
          }

      });

}

function gradeDialog() {
  const sc = cur();
  if (!sc) return;
  const lay = layOk(sc);
  const scenes = scenesOf(sc, lay.info).filter(x => x.n);

  let gradeFmt = prefs.gradeFmt || "60min";

  function montaHTML() {
    const CFG = {
      "30min": { nome: "Comédia / Sitcom (30 min)", arteSec: 22 * 60, blocos: 3, comSec: 160 },
      "45min": { nome: "Novela / Série (45 min)", arteSec: 34 * 60, blocos: 4, comSec: 220 },
      "60min": { nome: "Horário Nobre / Série (60 min)", arteSec: 46 * 60, blocos: 5, comSec: 210 },
      "90min": { nome: "Telefilme Especial (90 min)", arteSec: 72 * 60, blocos: 5, comSec: 270 }
    }[gradeFmt] || { nome: "Horário Nobre (60 min)", arteSec: 46 * 60, blocos: 5, comSec: 210 };

    let totSec = 0;
    const scLinhas = scenes.map(s => {
      const sec = Math.max(15, Math.round(eighthsN(s.lines, lay.lpp) * 7.5));
      totSec += sec;
      return { s, sec };
    });

    const secPerBloco = Math.ceil(totSec / CFG.blocos);
    let acumulado = 0, blocoCur = 1;
    const rows = [];

    scLinhas.forEach((item, i) => {
      acumulado += item.sec;
      rows.push({
        tipo: "cena",
        bloco: blocoCur,
        cena: item.s.label || item.s.n,
        h: item.s.h,
        durSec: item.sec,
        acumSec: acumulado
      });

      if (acumulado >= blocoCur * secPerBloco && blocoCur < CFG.blocos && i < scLinhas.length - 1) {
        rows.push({
          tipo: "break",
          bloco: blocoCur,
          comSec: CFG.comSec,
          posSec: acumulado
        });
        blocoCur++;
      }
    });

    const diffSec = totSec - CFG.arteSec;
    const diffAbs = Math.abs(diffSec);
    const diffM = Math.floor(diffAbs / 60), diffS = diffAbs % 60;
    const fmtT = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

    let alertClass = "ok", alertMsg = `Duração perfeita! O roteiro tem ${fmtT(totSec)} de arte, ideal para o slot de ${CFG.nome}.`;
    if (diffSec > 45) {
      alertClass = "err";
      alertMsg = `Atenção: O roteiro está ${diffM}m ${diffS}s ACIMA DA GRADE. É necessário cortar cenas para não estourar o horário da emissora.`;
    } else if (diffSec < -45) {
      alertClass = "warn";
      alertMsg = `Aviso: O roteiro está ${diffM}m ${diffS}s ABAIXO DA GRADE. Necessário estender diálogos ou incluir vinhetas da emissora.`;
    }

    return `
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
        <label class="row">Formato da Emissora:
          <select id="gr-fmt">
            <option value="30min"${gradeFmt === "30min" ? " selected" : ""}>30 min (Sitcom / Comédia / Desenho)</option>
            <option value="45min"${gradeFmt === "45min" ? " selected" : ""}>45 min (Telenovela / Série diária)</option>
            <option value="60min"${gradeFmt === "60min" ? " selected" : ""}>60 min (Horário Nobre / Drama / Policial)</option>
            <option value="90min"${gradeFmt === "90min" ? " selected" : ""}>90 min (Telefilme / Episódio Especial)</option>
          </select>
        </label>
        <span class="muted" style="margin-left:auto">Total de Arte: <b>${fmtT(totSec)}</b> / Meta: <b>${fmtT(CFG.arteSec)}</b></span>
      </div>
      <div class="grade-alert ${alertClass}">${escH(alertMsg)}</div>
      <div style="max-height:300px;overflow:auto">
        <table class="grade-table">
          <thead>
            <tr>
              <th style="width:50px">Bloco</th>
              <th style="width:60px">Cena</th>
              <th>Cabeçalho da Cena</th>
              <th style="width:70px">Duração</th>
              <th style="width:90px">Tempo Acum.</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => r.tipo === "break" ? `
              <tr class="break-row">
                <td colspan="5">⏸ INTERVALO COMERCIAL Nº ${r.bloco} (${fmtT(r.comSec)} de comerciais da emissora aos ${fmtT(r.posSec)})</td>
              </tr>
            ` : `
              <tr>
                <td><b>B${r.bloco}</b></td>
                <td>Cena ${escH(r.cena)}</td>
                <td>${escH(r.h)}</td>
                <td>${fmtT(r.durSec)}</td>
                <td><b>${fmtT(r.acumSec)}</b></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  dialog({
    id: "gradeWin",
    title: `Grade de exibição e intervalos comerciais — ${epCode(sc.meta)}`,
    width: 740,
    modal: false,
    icon: "grade",
    body: `<div id="gradeRoot">${montaHTML()}</div>`,
    onOpen: (w) => {
      w.addEventListener("change", e => {
        if (e.target.id === "gr-fmt") {
          gradeFmt = e.target.value;
          prefs.gradeFmt = gradeFmt;
          savePrefs();
          w.querySelector("#gradeRoot").innerHTML = montaHTML();
        }
      });
    }
  });
}

/* ---------- Emulador de Teletexto & Closed Caption Linha 21 (1995) ---------- */
function closedCaptionDialog() {
  const sc = cur();
  if (!sc) return;
  const lay = layOk(sc);

  let tcSec = 0;
  const dialogos = [];
  sc.els.forEach((e, i) => {
    if (e.t === "scene") {
      tcSec += Math.max(15, Math.round(eighthsN(lay.info[i].lines, lay.lpp) * 7.5));
    } else if (e.t === "character") {
      const nx = sc.els[i + 1];
      if (nx && nx.t === "dialogue" && nx.x.trim()) {
        const wCount = (nx.x.match(/\S+/g) || []).length;
        const durSec = Math.max(2, Math.round((wCount / 150) * 60));
        dialogos.push({
          idx: dialogos.length + 1,
          char: e.x.toUpperCase(),
          text: nx.x.trim(),
          startSec: tcSec,
          endSec: tcSec + durSec,
          durSec,
          wCount,
          wpm: Math.round((wCount / durSec) * 60),
          cps: +(nx.x.length / durSec).toFixed(1)
        });
        tcSec += durSec + 1;
      }
    }
  });

  if (!dialogos.length) {
    toast("O roteiro ainda não tem diálogos para exibir em Closed Caption.");
    return;
  }

  let curIdx = 0;

  function fmtTC(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function fmtSRTTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const ms = Math.round((sec % 1) * 1000);
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")},${String(ms).padStart(3, "0")}`;
  }

  function wrapCC(text, maxLine) {
    const words = text.split(/\s+/);
    const lines = [];
    let curL = "";
    words.forEach(w => {
      if ((curL + " " + w).trim().length <= maxLine) {
        curL = (curL + " " + w).trim();
      } else {
        if (curL) lines.push(curL);
        curL = w;
      }
    });
    if (curL) lines.push(curL);
    return lines.slice(0, 2);
  }

  function srtContent() {
    return dialogos.map(d => {
      const ccLines = wrapCC(d.text, 34);
      return `${d.idx}\n${fmtSRTTime(d.startSec)} --> ${fmtSRTTime(d.endSec)}\n[${d.char}]\n${ccLines.join("\n")}\n`;
    }).join("\n");
  }

  function renderView() {
    const d = dialogos[curIdx] || dialogos[0];
    const ccLines = wrapCC(d.text, 34);
    let speedBadge = `<span class="badge-hook-ok">✓ Leitura Confortável (${d.wpm} PPM · ${d.cps} CPS)</span>`;
    if (d.wpm > 200 || d.cps > 17) {
      speedBadge = `<span class="badge-hook-warn" style="background:#FFD0D0;color:#900">⚠️ Fala Muito Rápida (${d.wpm} PPM) — Difícil de ler na TV</span>`;
    } else if (d.wpm > 170) {
      speedBadge = `<span class="badge-hook-warn">⚠️ Limite da Emissora (${d.wpm} PPM)</span>`;
    }

    return `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="tv-bezel">
          <div class="tv-screen">
            <div style="position:absolute;top:10px;left:14px;color:#00ffcc;font:bold 12px monospace">
              CANAL 02 · EIA-608 CC [LINHA 21] · TC: ${fmtTC(d.startSec)}
            </div>
            <div class="cc-bar">
              <div style="color:#00e0ff;font-size:12px;margin-bottom:2px">[${escH(d.char)}]</div>
              ${ccLines.map(l => `<div>${escH(l.toUpperCase())}</div>`).join("")}
            </div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;background:#fff;padding:6px 10px;border:1px solid #808080">
          <button type="button" class="btn sm" id="cc-prev"${curIdx === 0 ? " disabled" : ""}>◀ Anterior</button>
          <span>Legenda <b>${curIdx + 1} de ${dialogos.length}</b></span>
          <button type="button" class="btn sm" id="cc-next"${curIdx >= dialogos.length - 1 ? " disabled" : ""}>Próxima ▶</button>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>${speedBadge}</div>
          <button type="button" class="btn def sm" id="cc-srt">💾 Baixar Legendas (.SRT)</button>
        </div>
      </div>
    `;
  }

  dialog({
    id: "ccWin",
    title: `Emulador de Teletexto & Closed Caption Linha 21 — ${epCode(sc.meta)}`,
    width: 660,
    modal: false,
    icon: "tv",
    body: `<div id="ccRoot">${renderView()}</div>`,
    onOpen: (w) => {
      function refresh() {
        w.querySelector("#ccRoot").innerHTML = renderView();
        bind();
      }
      function bind() {
        const bp = w.querySelector("#cc-prev");
        if (bp) bp.onclick = () => { if (curIdx > 0) { curIdx--; refresh(); } };
        const bn = w.querySelector("#cc-next");
        if (bn) bn.onclick = () => { if (curIdx < dialogos.length - 1) { curIdx++; refresh(); } };
        const bs = w.querySelector("#cc-srt");
        if (bs) bs.onclick = () => {
          const blob = new Blob([srtContent()], { type: "text/plain;charset=utf-8" });
          offer(fileName(sc).replace(/\.docx$/, "_legendas.srt"), blob);
          toast("Arquivo de legendas .SRT exportado!");
        };
      }
      bind();
    }
  });
}

/* ---------- Gravador de Fita Cassete C-60 Virtual & Masterizador .WAV ---------- */
function tapeDeckDialog() {
  const sc = cur();
  let isPlaying = false, isRecording = false;
  let counter = 0, countTimer = null;
  let tapeType = "Type II (CrO2)";

  function createWAVBlob(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    writeString(view, 0, "RIFF");
    view.setUint32(4, 36 + samples.length * 2, true);
    writeString(view, 8, "WAVE");
    writeString(view, 12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, "data");
    view.setUint32(40, samples.length * 2, true);

    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
    return new Blob([view], { type: "audio/wav" });
  }

  function renderDeck() {
    const cntStr = String(counter % 1000).padStart(3, "0");
    return `
      <div class="k7-deck">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="font:bold 12px Tahoma;color:#222">SCRIPTROOM · DECK DE GRAVAÇÃO CASSETE C-60</b>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="k7-counter" id="k7-cnt">${cntStr}</span>
            <button type="button" class="btn sm" id="k7-rst" style="padding:1px 5px">RESET</button>
          </div>
        </div>

        <div class="k7-bay">
          <div class="k7-window">
            <div class="k7-spool ${isPlaying || isRecording ? "spin" : ""}" id="k7-s1"><div class="k7-spool-center"></div></div>
            <div style="text-align:center;font:bold 11px Tahoma,sans-serif;color:#fff;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:3px">
              FITA C-60 · LADO A<br><small style="color:#ffd700">${tapeType}</small>
            </div>
            <div class="k7-spool ${isPlaying || isRecording ? "spin" : ""}" id="k7-s2"><div class="k7-spool-center"></div></div>
          </div>
        </div>

        <div class="vu-meter-box">
          <div class="vu-ch">
            <span>CANAL L</span>
            <div class="vu-bar" id="vu-l">
              <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
              <span class="vu-seg"></span><span class="vu-seg warn"></span><span class="vu-seg clip ${isPlaying ? "" : "off"}"></span>
            </div>
          </div>
          <div class="vu-ch">
            <span>CANAL R</span>
            <div class="vu-bar" id="vu-r">
              <span class="vu-seg"></span><span class="vu-seg"></span><span class="vu-seg"></span>
              <span class="vu-seg"></span><span class="vu-seg warn"></span><span class="vu-seg clip ${isPlaying ? "" : "off"}"></span>
            </div>
          </div>
        </div>

        <div class="row" style="justify-content:center;gap:6px">
          <button type="button" class="btn ${isPlaying ? "def" : ""}" id="k7-play">▶ REPRODUZIR</button>
          <button type="button" class="btn" id="k7-stop">■ PARAR</button>
          <button type="button" class="btn ${isRecording ? "def" : ""}" id="k7-rec" style="color:#C00000">● GRAVAR</button>
          <button type="button" class="btn" id="k7-rew">⏪ VOLTAR</button>
          <button type="button" class="btn" id="k7-fwd">⏩ AVANÇAR</button>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <label class="row" style="font-size:11px">Fita:
            <select id="k7-tape-sel">
              <option value="Type I (Normal)"${tapeType.includes("Type I") ? " selected" : ""}>Type I (Normal Ferro)</option>
              <option value="Type II (CrO2)"${tapeType.includes("Type II") ? " selected" : ""}>Type II (Cromo CrO2)</option>
              <option value="Type IV (Metal)"${tapeType.includes("Type IV") ? " selected" : ""}>Type IV (Metal Studio)</option>
            </select>
          </label>
          <button type="button" class="btn def sm" id="k7-export-wav">💾 Exportar Master (.WAV 16-bit)</button>
        </div>
      </div>
    `;
  }

  dialog({
    id: "tapeWin",
    title: `Gravador de fita cassete C-60 — ${sc ? epCode(sc.meta) : "Áudio"}`,
    width: 580,
    modal: false,
    icon: "tape",
    body: `<div id="tapeRoot">${renderDeck()}</div>`,
    onOpen: (w) => {
      function refresh() {
        w.querySelector("#tapeRoot").innerHTML = renderDeck();
        bind();
      }
      function bind() {
        w.querySelector("#k7-rst").onclick = () => { counter = 0; refresh(); };
        w.querySelector("#k7-tape-sel").onchange = (e) => { tapeType = e.target.value; refresh(); };

        w.querySelector("#k7-play").onclick = () => {
          isPlaying = true;
          isRecording = false;
          clearInterval(countTimer);
          countTimer = setInterval(() => { counter++; const cEl = w.querySelector("#k7-cnt"); if (cEl) cEl.textContent = String(counter % 1000).padStart(3, "0"); }, 1000);
          refresh();
          if (typeof playFoley === "function") playFoley("maquina");
          toast("Reproduzindo fita cassete C-60...");
        };

        w.querySelector("#k7-stop").onclick = () => {
          isPlaying = false;
          isRecording = false;
          clearInterval(countTimer);
          refresh();
        };

        w.querySelector("#k7-rec").onclick = () => {
          isRecording = true;
          isPlaying = false;
          clearInterval(countTimer);
          countTimer = setInterval(() => { counter++; const cEl = w.querySelector("#k7-cnt"); if (cEl) cEl.textContent = String(counter % 1000).padStart(3, "0"); }, 1000);
          refresh();
          toast("● Gravando trilha e sonoplastia da mesa...");
        };

        w.querySelector("#k7-rew").onclick = () => {
          counter = Math.max(0, counter - 15);
          refresh();
        };

        w.querySelector("#k7-fwd").onclick = () => {
          counter += 15;
          refresh();
        };

        w.querySelector("#k7-export-wav").onclick = () => {
          const sampleRate = 22050;
          const numSamples = Math.floor(sampleRate * 2.5);
          const samples = new Float32Array(numSamples);
          for (let i = 0; i < numSamples; i++) {
            const t = i / sampleRate;
            const sig = Math.sin(2 * Math.PI * 440 * t) * 0.4 + Math.sin(2 * Math.PI * 880 * t) * 0.15;
            const hiss = (Math.random() * 2 - 1) * 0.025;
            samples[i] = (sig + hiss) * Math.min(1, Math.max(0, (2.5 - t) * 2));
          }
          const blob = createWAVBlob(samples, sampleRate);
          offer(sc ? fileName(sc).replace(/\.docx$/, "_fita_master.wav") : "scriptroom_c60_master.wav", blob);
          toast("Master em formato .WAV 16-bit exportado!");
        };
      }
      bind();
    },
    onClose: () => {
      clearInterval(countTimer);
    }
  });
}
