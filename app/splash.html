<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=620,initial-scale=1,user-scalable=no">
<title>ScriptRoom — Inicializando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root {
  --face: #C6BFA6;
  --light: #E1DBC6;
  --hi: #FFFFFF;
  --lo: #8A8268;
  --dk: #0A0A0A;
  --title1: #800000;
  --text: #000000;
  --muted: #3C3C3C;
  --f-ui: Tahoma, Verdana, "MS Sans Serif", Arial, sans-serif;
  --f-pix: "VT323", "Courier New", ui-monospace, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-font-smoothing: none;
  font-smooth: never;
}

html, body {
  width: 620px;
  height: 350px;
  overflow: hidden;
  font-family: var(--f-ui);
  font-size: 11px;
  background: var(--face);
  color: var(--text);
  cursor: default;
}

/* Moldura externa clássica Windows 95 em relevo 3D */
.win95-splash {
  width: 620px;
  height: 350px;
  background: var(--face);
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow:
    inset 1px 1px var(--light),
    inset -1px -1px var(--dk),
    inset 2px 2px var(--hi),
    inset -2px -2px var(--lo);
}

/* Quadro principal com o logo original anos 90 (claquete + SCRIPTROOM + edição 95) */
.splash-banner {
  background: linear-gradient(180deg, var(--title1) 0%, #000000 100%);
  color: #FFFFFF;
  height: 206px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  box-shadow:
    inset -1px -1px var(--hi),
    inset 1px 1px var(--lo),
    inset -2px -2px var(--light),
    inset 2px 2px var(--dk);
}

.splash-banner svg {
  display: block;
  margin-bottom: 4px;
  image-rendering: pixelated;
}

.splash-banner .big {
  font: 400 44px/1 var(--f-pix);
  letter-spacing: 0.05em;
  color: #FFFFFF;
}

.splash-banner .sub {
  font: 400 22px/1 var(--f-pix);
  color: #9FD4FF;
}

.splash-ver-tag {
  position: absolute;
  right: 10px;
  bottom: 7px;
  font: 400 15px/1 var(--f-pix);
  color: #B89090;
}

/* Área inferior cinza/bege estilo diálogo clássico de 1995 */
.splash-bottom {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 2px 2px 0;
}

/* Linha de licença gravada em baixo-relevo (groove 95) */
.license-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 8px;
  background: var(--face);
  box-shadow:
    inset -1px -1px var(--hi),
    inset 1px 1px var(--lo);
  font-size: 11px;
  color: var(--text);
}

.license-row b {
  font-weight: 700;
}

/* Cabeçalho da barra de carregamento */
.load-status-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0 2px;
}

.tool-label {
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 530px;
}

.pct-label {
  font: 400 16px/1 var(--f-pix);
  color: var(--text);
}

/* Barra de progresso horizontal clássica Windows 95 em gomos sólidos */
.prog95-well {
  width: 100%;
  height: 22px;
  background: #FFFFFF;
  padding: 3px;
  box-shadow:
    inset -1px -1px var(--hi),
    inset 1px 1px var(--lo),
    inset -2px -2px var(--light),
    inset 2px 2px var(--dk);
}

.prog95-fill {
  height: 100%;
  width: 0%;
  background: repeating-linear-gradient(
    90deg,
    var(--title1) 0px,
    var(--title1) 10px,
    transparent 10px,
    transparent 12px
  );
}

/* Rodapé anos 90 */
.footer95 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
  padding: 0 2px;
}

.click-close {
  display: none;
  color: var(--title1);
  font-weight: 700;
}
</style>
</head>
<body>

<div class="win95-splash" id="splashRoot">
  <!-- Logo idêntico ao da Sala de Roteiro 95 -->
  <div class="splash-banner">
    <svg viewBox="0 0 16 16" width="64" height="64" aria-hidden="true">
      <rect x="1.5" y="6.5" width="13" height="8" fill="#202020" stroke="#000"/>
      <path d="M1.5 3.5l12-2 .5 3-12 2z" fill="#fff" stroke="#000"/>
      <path d="M4 3l1.5 2.6M7.5 2.4L9 5M11 1.8l1.5 2.6" stroke="#000"/>
      <path d="M3 9h10M3 11h7" stroke="#fff"/>
    </svg>
    <span class="big">SCRIPTROOM</span>
    <span class="sub">edição 95</span>
    <span class="splash-ver-tag" id="verTag">v6.1.2</span>
  </div>

  <!-- Painel inferior estilo Windows 95 -->
  <div class="splash-bottom">
    <div class="license-row">
      <span>Licenciado para: <b>Departamento de Dramaturgia — C2</b></span>
      <span>Versão <b>6.1.2</b> · 32-bit</span>
    </div>

    <div class="load-status-row">
      <span class="tool-label" id="toolStatus">Carregando: Núcleo de dramaturgia e folha datilografada...</span>
      <span class="pct-label" id="percentText">0%</span>
    </div>

    <div class="prog95-well" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBar">
      <div class="prog95-fill" id="progressFill"></div>
    </div>

    <div class="footer95">
      <span>© 1995 Departamento de Dramaturgia · Todos os direitos reservados.</span>
      <span class="click-close" id="clickHint">[ Clique ou aperte Esc para fechar ]</span>
      <span id="memStatus">Memória: 32.768 KB livres</span>
    </div>
  </div>
</div>

<script>
"use strict";

const ETAPAS = [
  { p: 12, msg: "Carregando: Núcleo de dramaturgia e folha Courier 12pt..." },
  { p: 24, msg: "Carregando: Banco de séries, cenas e revisões coloridas..." },
  { p: 36, msg: "Carregando: Mesa de sonoplastia Sound Blaster 16 (Foley)..." },
  { p: 48, msg: "Carregando: Osciloscópio de ritmo dramático e curva de tensão..." },
  { p: 60, msg: "Carregando: Mesa de corte multi-câmera e Closed Caption Linha 21..." },
  { p: 74, msg: "Carregando: Planilha de orçamento de produção e boletim de câmera..." },
  { p: 88, msg: "Carregando: Doutor de roteiro e gerador de sinopse executiva..." },
  { p: 100, msg: "Pronto. Iniciando o ScriptRoom..." }
];

const fillEl = document.getElementById("progressFill");
const pctEl = document.getElementById("percentText");
const statusEl = document.getElementById("toolStatus");
const hintEl = document.getElementById("clickHint");
const memEl = document.getElementById("memStatus");
const rootEl = document.getElementById("splashRoot");
const progBar = document.getElementById("progBar");

const params = new URLSearchParams(window.location.search);
const isAboutMode = params.get("modo") === "sobre";

let idx = 0;

function setProgress(p, text) {
  fillEl.style.width = p + "%";
  pctEl.textContent = p + "%";
  progBar.setAttribute("aria-valuenow", String(p));
  if (text) statusEl.textContent = text;
}

function finalizeSplash() {
  if (isAboutMode) {
    statusEl.textContent = "Todas as ferramentas carregadas e operacionais.";
    memEl.style.display = "none";
    hintEl.style.display = "inline";
    rootEl.style.cursor = "pointer";
    rootEl.addEventListener("click", () => window.close());
    window.addEventListener("keydown", e => {
      if (e.key === "Escape" || e.key === "Enter" || e.key === " ") window.close();
    });
    return;
  }
  if (window.salaNative && typeof window.salaNative.splashDone === "function") {
    window.salaNative.splashDone();
  }
}

function step() {
  if (idx >= ETAPAS.length) {
    setTimeout(finalizeSplash, 260);
    return;
  }
  const item = ETAPAS[idx++];
  setProgress(item.p, item.msg);
  const delay = isAboutMode ? 170 : (220 + Math.floor(Math.random() * 110));
  setTimeout(step, delay);
}

window.addEventListener("DOMContentLoaded", () => {
  setTimeout(step, 140);
});
</script>
</body>
</html>
